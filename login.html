<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meaningless — login</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fff;--text:#29262a;--muted:#8a8588;--line:#e5eeee;--point:#62b9aa;--soft:#dff2ee}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{width:min(390px,calc(100% - 40px));margin:18vh auto 0}
.back{display:inline-block;margin-bottom:48px;color:var(--muted);font-size:11px;text-decoration:none}
.back:hover{color:var(--point)}
.logo{font-size:28px;font-weight:700;letter-spacing:-.055em;margin-bottom:5px}
.sub{font-size:11px;color:var(--muted);margin-bottom:42px}
label{display:block;margin:0 0 7px;color:var(--point);font-size:10px;font-weight:700;letter-spacing:.08em}
.field{margin-bottom:20px}
input{width:100%;height:43px;padding:0 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff;color:var(--text);font:inherit;font-size:13px}
input:focus{border-color:var(--point);box-shadow:0 0 0 3px var(--soft)}
button{width:100%;height:42px;margin-top:10px;border:1px solid var(--point);border-radius:9px;background:var(--point);color:#fff;font:inherit;font-size:11px;cursor:pointer}
button:hover{opacity:.84}
#message{min-height:20px;margin-top:16px;color:var(--muted);font-size:10px;line-height:1.6}
.top-nav{position:fixed;top:28px;right:28px;z-index:10;display:flex;align-items:flex-start;gap:18px}
.login-current{color:var(--point);font-size:10px;letter-spacing:.08em;padding:6px 0}
.theme-wrap{position:relative;z-index:10}
.theme-button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:10px;letter-spacing:.08em;cursor:pointer;padding:6px 0}
.theme-button:hover{color:var(--point)}
.theme-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;width:145px;padding:8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.97);box-shadow:0 8px 25px rgba(50,100,95,.08)}
.theme-wrap.open .theme-menu{display:block}
.theme-option{display:flex;align-items:center;gap:8px;width:100%;padding:8px 7px;border:0;border-radius:7px;background:transparent;color:var(--text);font:inherit;font-size:11px;text-align:left;cursor:pointer}
.theme-option:hover{background:var(--soft)}
.theme-dot{width:9px;height:9px;border-radius:50%;background:var(--theme-color);flex:0 0 auto}
@media (max-width:600px){.top-nav{top:18px;right:18px;gap:13px}}
</style>
</head>
<body>
<div class="top-nav">
  <div class="login-current">LOGIN</div>
  <div class="theme-wrap" id="themeWrap">
    <button class="theme-button" id="themeButton" type="button">THEME</button>
    <div class="theme-menu">
      <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint</button>
      <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d8799a"></span> Pink</button>
      <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender</button>
      <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue</button>
    </div>
  </div>
</div>
<div class="wrap">
<a class="back" href="index.html">← meaningless</a>
<div class="logo">meaningless</div>
<div class="sub">private archive</div>

<form id="loginForm">
  <div class="field">
    <label for="email">EMAIL</label>
    <input id="email" type="email" autocomplete="email" required>
  </div>
  <div class="field">
    <label for="password">PASSWORD</label>
    <input id="password" type="password" autocomplete="current-password" required>
  </div>
  <button type="submit">LOGIN</button>
</form>
<div id="message"></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config-auth.js";

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.textContent = "로그인 중…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    message.textContent = "이메일 또는 비밀번호를 확인해주세요.";
    return;
  }

  location.href = "index.html";
});
</script>

<script>
const themes = {
  mint:{point:"#62b9aa",pointSoft:"#dff2ee",line:"#e5eeee"},
  pink:{point:"#d8799a",pointSoft:"#f6dfe8",line:"#eee3e7"},
  lavender:{point:"#9a8bc2",pointSoft:"#e9e4f4",line:"#e8e5ee"},
  blue:{point:"#70a9c2",pointSoft:"#e0eef3",line:"#e3ebee"}
};

function applyTheme(name){
  const theme=themes[name]||themes.mint;
  document.documentElement.style.setProperty("--point",theme.point);
  document.documentElement.style.setProperty("--soft",theme.pointSoft);
  document.documentElement.style.setProperty("--line",theme.line);
  localStorage.setItem("meaningless-theme",name);
}

applyTheme(localStorage.getItem("meaningless-theme")||"mint");

const themeWrap=document.getElementById("themeWrap");
document.getElementById("themeButton").addEventListener("click",()=>{
  themeWrap.classList.toggle("open");
});

document.querySelectorAll(".theme-option").forEach(button=>{
  button.addEventListener("click",()=>{
    applyTheme(button.dataset.theme);
    themeWrap.classList.remove("open");
  });
});

document.addEventListener("click",(event)=>{
  if(!themeWrap.contains(event.target)) themeWrap.classList.remove("open");
});
</script>

</body>
</html>
