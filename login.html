<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meaningless — login</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f7fbfa;--text:#29262a;--muted:#8a8588;--line:#e5eeee;--point:#62b9aa;--soft:#dff2ee}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{width:min(390px,calc(100% - 40px));margin:18vh auto 0}
.back{display:inline-block;margin-bottom:48px;color:var(--muted);font-size:11px;text-decoration:none}
.back:hover{color:var(--point)}
.logo{font-size:28px;font-weight:700;letter-spacing:-.055em;margin-bottom:5px;color:var(--point)}
.sub{font-size:11px;color:var(--muted);margin-bottom:42px}
.field{margin-bottom:20px}
label{display:block;margin:0 0 7px;color:var(--point);font-size:10px;font-weight:700;letter-spacing:.08em}
input{width:100%;height:43px;padding:0 12px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff;color:var(--text);font:inherit;font-size:13px}
input:focus{border-color:var(--point);box-shadow:0 0 0 3px var(--soft)}
button{width:100%;height:42px;margin-top:10px;border:1px solid var(--point);border-radius:9px;background:var(--point);color:#fff;font:inherit;font-size:11px;cursor:pointer}
button:hover{opacity:.84}
#message{min-height:20px;margin-top:16px;color:var(--muted);font-size:10px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<a class="back" id="backLink" href="./index.html">← meaningless</a>
<div class="logo">meaningless</div>
<div class="sub">private archive</div>

<form id="loginForm">
  <div class="field">
    <label for="email">EMAIL</label>
    <input id="email" type="email" autocomplete="email" required>
  </div>
  <div class="field">
    <label for="password">PASSWORD</label>
    <input id="password" type="password" autocomplete="current-password" required>
  </div>
  <button type="submit">LOGIN</button>
</form>
<div id="message"></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const form = document.getElementById("loginForm");
const message = document.getElementById("message");

const themes = {
  mint:{point:"#62b9aa",soft:"#dff2ee",line:"#e5eeee",bg:"#f7fbfa"},
  pink:{point:"#d8799a",soft:"#f6dfe8",line:"#eee3e7",bg:"#fff8fa"},
  lavender:{point:"#9a8bc2",soft:"#e9e4f4",line:"#e8e5ee",bg:"#faf8fd"},
  blue:{point:"#70a9c2",soft:"#e0eef3",line:"#e3ebee",bg:"#f7fbfd"}
};

const params = new URLSearchParams(location.search);
const themeName = themes[params.get("theme")] ? params.get("theme") : "mint";
const theme = themes[themeName];

document.documentElement.style.setProperty("--point", theme.point);
document.documentElement.style.setProperty("--soft", theme.soft);
document.documentElement.style.setProperty("--line", theme.line);
document.documentElement.style.setProperty("--bg", theme.bg);

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.textContent = "로그인 중…";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({ email, password });

  if (error) {
    message.textContent = "이메일 또는 비밀번호를 확인해주세요.";
    return;
  }

  location.href = "./index.html?theme=" + encodeURIComponent(themeName);
});
</script>
<script>
const theme = new URLSearchParams(location.search).get("theme") || "mint";
document.getElementById("backLink").href =
  "./index.html?theme=" + encodeURIComponent(theme);
</script>
</body>
</html>
