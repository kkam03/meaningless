<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meaningless — search</title>
  <style>
:root {
  --background: #ffffff;
  --text: #29262a;
  --muted: #8a8588;
  --line: #e0ecea;
  --point: #4fae9f;
  --point-soft: #d6efea;
  --theme-bg: #f7fbfa;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--background);
  color: var(--text);
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  font-size: 13px;
  line-height: 1.7;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(760px, calc(100% - 40px));
  margin: 0 auto;
}


footer {
  padding: 32px 0 52px;
  font-size: 12px;
  color: var(--muted);
}

.footer-copy {
  font-size: 10px;
  letter-spacing: 0.04em;
}

.top-nav {
  position: relative;
  min-height: 24px;
  padding-top: 22px;
}

.top-nav .back {
  position: absolute;
  left: 0;
  top: 22px;
  display: inline-block;
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 10px;
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: .08em;
  color: var(--muted);
}


.top-nav .back {
  pointer-events: auto;
  position: relative;
  z-index: 20;
}

.top-nav .back:hover {
  color: var(--point);
}


header {
  position: relative;
  padding: 34px 0 48px;
}

.logo-main {
  display: inline-block;
  font-size: 40px;
  font-weight: 700;
  letter-spacing: -0.055em;
  color: var(--point);
}

.intro {
  margin-top: 11px;
  font-size: 14px;
  color: var(--muted);
  line-height: 1.75;
  letter-spacing: -0.02em;
}

.intro::before {
  content: "—";
  margin-right: 7px;
  color: var(--point);
}

.intro strong {
  display: block;
  color: var(--text);
  font-weight: 500;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 28px 0 22px;
}


.legacy-logo {
  font-size: 14px;
  letter-spacing: .03em;
}

.search-head {
  padding: 28px 0 42px;
  border-top: 1px solid var(--line);
}

.search-title {
  margin: 0 0 18px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .14em;
  color: var(--muted);
}

/* compact search */
.search-form {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 46px;
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
  width: 34px;
  height: 28px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--background);
  overflow: hidden;
  cursor: text;
  transition: width .2s ease, border-color .2s ease;
}

.search-box:hover {
  border-color: var(--point);
}

.search-box:focus-within {
  width: 190px;
  border-color: var(--point);
}

.search-icon {
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
  color: var(--point);
  font-size: 14px;
  line-height: 1;
  pointer-events: none;
}

.search-input {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0 9px 0 29px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 10px;
  opacity: 0;
  cursor: text;
  transition: opacity .15s ease;
}

.search-box:focus-within .search-input {
  opacity: 1;
}

.search-input::placeholder {
  color: #b3adaf;
}

.search-submit {
  display: none;
}

.summary {
  margin: 0 0 34px;
  font-size: 11px;
  color: var(--muted);
}

.result-section {
  margin: 0 0 48px;
}

.result-section + .result-section {
  margin-top: 48px;
}

.result-heading {
  margin: 0 0 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .14em;
  color: var(--point);
}

.result-heading span {
  margin-left: 5px;
  color: var(--muted);
  letter-spacing: 0;
}

.result-item {
  display: block;
  padding: 16px 2px;
  border-bottom: 1px solid var(--line);
  transition: background .15s ease, padding .15s ease;
}

.result-item:hover {
  background: var(--theme-bg);
  padding-left: 8px;
  padding-right: 8px;
}

.result-meta {
  margin-bottom: 5px;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .03em;
}

.result-title {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 500;
}

.result-snippet {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.empty {
  padding: 24px 2px;
  color: var(--muted);
  font-size: 12px;
}

mark {
  padding: 0 2px;
  border-radius: 2px;
  background: var(--point-soft);
  color: inherit;
}

@media (max-width: 600px) {
  .search-form {
    margin-bottom: 40px;
  }

  .search-box:focus-within {
    width: 165px;
  }

  .result-section {
    margin-bottom: 38px;
  }

  .result-section + .result-section {
    margin-top: 38px;
  }


  header {
    padding-top: 28px;
    padding-bottom: 38px;
  }

  .logo-main {
    font-size: 34px;
  }

  .intro {
    margin-top: 7px;
    font-size: 13px;
  }

  .container {
    width: min(100% - 28px, 760px);
  }

  .topbar {
    padding-top: 20px;
  }

  .search-head {
    padding-top: 22px;
    padding-bottom: 34px;
  }

  .search-form {
    display: block;
  }

  .search-box {
    max-width: none;
  }

  .search-submit {
    margin-top: 8px;
    width: 100%;
  }

  .results-section {
    margin-bottom: 38px;
  }
}
</style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a class="back" id="backLink" href="./index.html">← BACK</a>
    </div>

    <header>
      <a class="logo-main" id="logoLink" href="./index.html">✧ meaningless</a>
      <div class="intro">
        <strong>things that probably mean nothing.</strong>
        별거 아닌 것들을 기록합니다. 가끔은 별거인 것도.
      </div>
    </header>

    <form class="search-form" id="searchForm">
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input
          class="search-input"
          id="searchInput"
          name="q"
          type="search"
          placeholder="SEARCH"
          autocomplete="off"
          aria-label="검색"
        >
      </div>
    </form>

    <div class="summary" id="summary"></div>

    <section class="result-section" id="diarySection">
      <div class="result-heading">DIARY <span id="diaryCount"></span></div>
      <div id="diaryResults"></div>
    </section>

    <section class="result-section" id="archiveSection">
      <div class="result-heading">ARCHIVE <span id="archiveCount"></span></div>
      <div id="archiveResults"></div>
    </section>

    <footer>
      <div class="footer-copy">© 2026 meaningless. All rights reserved.</div>
    </footer>
  </div>

  <script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const themes={
  mint:{point:"#4fae9f",pointSoft:"#d6efea",line:"#e0ecea",themeBg:"#f7fbfa"},
  pink:{point:"#d3638b",pointSoft:"#f3d6e1",line:"#eadde2",themeBg:"#fff8fa"},
  lavender:{point:"#8d78bb",pointSoft:"#e5dff2",line:"#e4e1ea",themeBg:"#faf8fd"},
  blue:{point:"#5f9fbc",pointSoft:"#dbeaf0",line:"#dfe8eb",themeBg:"#f7fbfd"}
};

function esc(v){
  return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function stripHtml(v){
  const d=document.createElement("div");
  d.innerHTML=String(v??"");
  return d.textContent||"";
}
function highlight(v,q){
  const s=String(v??"");
  if(!q)return esc(s);
  const safe=esc(s);
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
  return safe.replace(re,m=>`<mark>${m}</mark>`);
}
function formatDate(v){
  if(!v)return "";
  const d=new Date(`${v}T00:00:00`);
  return Number.isNaN(d.getTime())?String(v):
    `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}
function getTheme(){
  const p=new URLSearchParams(location.search);
  if(themes[p.get("theme")])return p.get("theme");
  const m=document.cookie.match(/(?:^|;\s*)meaningless-theme=([^;]+)/);
  const n=m?decodeURIComponent(m[1]):null;
  return themes[n]?n:"mint";
}
function applyTheme(n){
  const t=themes[n]||themes.mint;
  document.documentElement.style.setProperty("--point",t.point);
  document.documentElement.style.setProperty("--point-soft",t.pointSoft);
  document.documentElement.style.setProperty("--line",t.line);
  document.documentElement.style.setProperty("--theme-bg",t.themeBg);
}
const currentTheme=getTheme();
applyTheme(currentTheme);

const params=new URLSearchParams(location.search);
const initialQuery=params.get("q")||"";
const form=document.getElementById("searchForm");
const input=document.getElementById("searchInput");
const summary=document.getElementById("summary");
const results=document.getElementById("results");

if(input)input.value=initialQuery;

async function searchAll(keyword){
  const q=keyword.trim().toLowerCase();

  const diarySection=document.getElementById("diarySection");
  const archiveSection=document.getElementById("archiveSection");
  const diaryResults=document.getElementById("diaryResults");
  const archiveResults=document.getElementById("archiveResults");
  const diaryCount=document.getElementById("diaryCount");
  const archiveCount=document.getElementById("archiveCount");

  if(!q){
    summary.textContent="";
    diaryResults.innerHTML="";
    archiveResults.innerHTML="";
    diaryCount.textContent="";
    archiveCount.textContent="";
    return;
  }

  summary.textContent=`"${keyword}" 검색 결과`;

  const [
    {data:diaries,error:diaryError},
    {data:categories,error:categoryError},
    {data:archives,error:archiveError}
  ]=await Promise.all([
    supabase.from("diary")
      .select("id,date,title,content,created_at")
      .order("date",{ascending:false})
      .order("created_at",{ascending:false}),
    supabase.from("archive_categories")
      .select("id,name,description,created_at")
      .order("created_at",{ascending:true}),
    supabase.from("archives")
      .select("id,name,type,category_id,created_at")
      .order("created_at",{ascending:false})
  ]);

  if(diaryError)console.error("SEARCH DIARY",diaryError);
  if(categoryError)console.error("SEARCH CATEGORY",categoryError);
  if(archiveError)console.error("SEARCH ARCHIVES",archiveError);

  const diaryHits=(diaries||[]).filter(x=>
    [x.title,x.content].some(v=>String(v??"").toLowerCase().includes(q))
  );

  const categoryHits=(categories||[]).filter(x=>
    [x.name,x.description].some(v=>String(v??"").toLowerCase().includes(q))
  );

  let recordHits=[];
  const archiveList=archives||[];

  if(archiveList.length){
    const ids=archiveList.map(x=>x.id);
    const {data:records,error}=await supabase.from("archive_records")
      .select("id,archive_id,date,title,content,image_url,extra_data,created_at")
      .in("archive_id",ids)
      .order("date",{ascending:true})
      .order("created_at",{ascending:true});

    if(error){
      console.error("SEARCH ARCHIVE RECORDS",error);
    }else{
      recordHits=(records||[]).filter(r=>{
        const blocks=Array.isArray(r.extra_data?.content_blocks)
          ?r.extra_data.content_blocks.filter(b=>b?.type==="text").map(b=>b.value||"").join("\n")
          :"";
        const extra=r.extra_data&&typeof r.extra_data==="object"
          ?Object.entries(r.extra_data)
            .filter(([k])=>k!=="content_blocks")
            .map(([,v])=>String(v??"")).join("\n")
          :"";
        return [r.title,r.content,blocks,extra]
          .some(v=>String(v??"").toLowerCase().includes(q));
      });
    }
  }

  const archiveHits=archiveList.filter(a=>
    [a.name,a.type].some(v=>String(v??"").toLowerCase().includes(q)) ||
    recordHits.some(r=>r.archive_id===a.id)
  );

  diaryCount.textContent=diaryHits.length?` ${diaryHits.length}`:"";
  archiveCount.textContent=(archiveHits.length+categoryHits.length)
    ?` ${archiveHits.length+categoryHits.length}`:"";

  diaryResults.innerHTML=diaryHits.length
    ?diaryHits.map(x=>`
      <a class="result-item" href="./diary-detail.html?id=${encodeURIComponent(x.id)}&theme=${encodeURIComponent(currentTheme)}">
        <div class="result-meta">${esc(formatDate(x.date))}</div>
        <div class="result-title">${highlight(x.title,keyword)}</div>
        ${x.content?`<div class="result-snippet">${highlight(stripHtml(x.content).slice(0,180),keyword)}</div>`:""}
      </a>`).join("")
    :'<div class="empty">검색 결과가 없습니다.</div>';

  let archiveOut="";

  if(categoryHits.length){
    archiveOut+=categoryHits.map(x=>`
      <a class="result-item" href="./archive-view.html?category=${encodeURIComponent(x.id)}&theme=${encodeURIComponent(currentTheme)}">
        <div class="result-meta">CATEGORY</div>
        <div class="result-title">${highlight(x.name,keyword)}</div>
        ${x.description?`<div class="result-snippet">${highlight(x.description,keyword)}</div>`:""}
      </a>`).join("");
  }

  if(archiveHits.length){
    archiveOut+=archiveHits.map(a=>{
      const hits=recordHits.filter(r=>r.archive_id===a.id);
      const snippet=hits.map(r=>{
        const blocks=Array.isArray(r.extra_data?.content_blocks)
          ?r.extra_data.content_blocks.filter(b=>b?.type==="text").map(b=>b.value||"").join(" ")
          :"";
        const body=stripHtml(r.content||blocks);
        return body?highlight(body.slice(0,140),keyword):"";
      }).filter(Boolean).join(" · ");

      return `<a class="result-item" href="./archive-view.html?id=${encodeURIComponent(a.id)}${a.category_id?`&fromCategory=${encodeURIComponent(a.category_id)}`:""}&theme=${encodeURIComponent(currentTheme)}">
        <div class="result-meta">${esc((a.type||"ARCHIVE").toUpperCase())}</div>
        <div class="result-title">${highlight(a.name,keyword)}</div>
        ${snippet?`<div class="result-snippet">${snippet}</div>`:""}
      </a>`;
    }).join("");
  }

  archiveResults.innerHTML=archiveOut||'<div class="empty">검색 결과가 없습니다.</div>';
}

form?.addEventListener("submit",e=>{
  e.preventDefault();
  const q=input.value.trim();
  const url=new URL(location.href);
  if(q)url.searchParams.set("q",q);else url.searchParams.delete("q");
  url.searchParams.set("theme",currentTheme);
  history.replaceState(null,"",url);
  searchAll(q);
});

if(initialQuery)searchAll(initialQuery);
</script>
</body>
</html>
