<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meaningless — search</title>
  <style>
:root {
  --background: #ffffff;
  --text: #29262a;
  --muted: #8a8588;
  --line: #e0ecea;
  --point: #4fae9f;
  --point-soft: #d6efea;
  --theme-bg: #f7fbfa;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--background);
  color: var(--text);
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  min-height: 100vh;
  font-size: 13px;
  line-height: 1.7;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(760px, calc(100% - 40px));
  margin: 0 auto;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 28px 0 22px;
}

.back {
  font-size: 10px;
  letter-spacing: .08em;
  color: var(--muted);
}

.back:hover { color: var(--point); }

.logo {
  font-size: 14px;
  letter-spacing: .03em;
}

.search-head {
  padding: 28px 0 42px;
  border-top: 1px solid var(--line);
}

.search-title {
  margin: 0 0 18px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .14em;
  color: var(--muted);
}

.search-form {
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-box {
  display: flex;
  align-items: center;
  width: 100%;
  max-width: 420px;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--background);
  transition: border-color .2s ease;
}

.search-box:focus-within {
  border-color: var(--point);
}

.search-icon {
  flex: 0 0 auto;
  color: var(--point);
  font-size: 14px;
  line-height: 1;
}

.search-input {
  min-width: 0;
  width: 100%;
  margin-left: 8px;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 11px;
}

.search-input::placeholder { color: #b3adaf; }

.search-submit {
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--theme-bg);
  color: var(--point);
  font: inherit;
  font-size: 10px;
  cursor: pointer;
}

.search-submit:hover {
  border-color: var(--point);
}

.summary {
  margin: 0 0 34px;
  font-size: 11px;
  color: var(--muted);
}

.results-section {
  margin-bottom: 48px;
}

.section-label {
  margin: 0 0 16px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .14em;
  color: var(--point);
}

.result-list {
  border-top: 1px solid var(--line);
}

.result-item {
  display: block;
  padding: 16px 2px;
  border-bottom: 1px solid var(--line);
  transition: background .15s ease, padding .15s ease;
}

.result-item:hover {
  background: var(--theme-bg);
  padding-left: 8px;
  padding-right: 8px;
}

.result-date {
  margin-bottom: 3px;
  font-size: 9px;
  color: var(--muted);
  letter-spacing: .03em;
}

.result-title {
  margin: 0 0 4px;
  font-size: 13px;
  font-weight: 500;
}

.result-excerpt {
  margin: 0;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.65;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.empty {
  padding: 24px 2px;
  color: var(--muted);
  font-size: 10px;
}

mark {
  padding: 0 2px;
  border-radius: 2px;
  background: var(--point-soft);
  color: inherit;
}

@media (max-width: 600px) {
  .container {
    width: min(100% - 28px, 760px);
  }

  .topbar {
    padding-top: 20px;
  }

  .search-head {
    padding-top: 22px;
    padding-bottom: 34px;
  }

  .search-form {
    display: block;
  }

  .search-box {
    max-width: none;
  }

  .search-submit {
    margin-top: 8px;
    width: 100%;
  }

  .results-section {
    margin-bottom: 38px;
  }
}
</style>
</head>
<body>
  <div class="container">
    <header>
      <a class="back" id="backLink" href="./index.html">← BACK</a><br>
      <a class="logo" id="logoLink" href="./index.html">✧ meaningless</a>
    </header>

    <form class="search-box" id="searchForm">
      <span class="search-icon">⌕</span>
      <input
        class="search-input"
        id="searchInput"
        name="q"
        type="search"
        placeholder="SEARCH"
        autocomplete="off"
        aria-label="검색"
      >
      <button class="search-submit" type="submit">SEARCH</button>
    </form>

    <div class="summary" id="summary"></div>

    <section class="section">
      <div class="section-heading">
        <div class="section-title">♡ DIARY</div>
      </div>
      <div class="result-list" id="diaryResults"></div>
    </section>

    <section class="section">
      <div class="section-heading">
        <div class="section-title">ARCHIVE</div>
      </div>
      <div class="result-list" id="archiveResults"></div>
    </section>

    <footer>© 2026 meaningless. All rights reserved.</footer>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const $ = id => document.getElementById(id);

    const themes = {
      mint:{point:"#4fae9f",pointSoft:"#d6efea",line:"#e0ecea",themeBg:"#f7fbfa"},
      pink:{point:"#d3638b",pointSoft:"#f3d6e1",line:"#eadde2",themeBg:"#fff8fa"},
      lavender:{point:"#8d78bb",pointSoft:"#e5dff2",line:"#e4e1ea",themeBg:"#faf8fd"},
      blue:{point:"#5f9fbc",pointSoft:"#dbeaf0",line:"#dfe8eb",themeBg:"#f7fbfd"}
    };

    const params = new URLSearchParams(location.search);
    const currentTheme = themes[params.get("theme")] ? params.get("theme") : "mint";
    const query = (params.get("q") || "").trim();

    const esc = v => String(v ?? "")
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");

    const formatDate = d => {
      if(!d) return "";
      const x = new Date(`${d}T00:00:00`);
      return Number.isNaN(x.getTime()) ? String(d) :
        `${String(x.getMonth()+1).padStart(2,"0")}.${String(x.getDate()).padStart(2,"0")}`;
    };

    function applyTheme(name) {
      const t = themes[name] || themes.mint;
      document.documentElement.style.setProperty("--point",t.point);
      document.documentElement.style.setProperty("--point-soft",t.pointSoft);
      document.documentElement.style.setProperty("--line",t.line);
      document.documentElement.style.setProperty("--theme-bg",t.themeBg);
    }

    function addTheme(url) {
      url.searchParams.set("theme", currentTheme);
      return url;
    }

    applyTheme(currentTheme);
    $("searchInput").value = query;

    const backUrl = addTheme(new URL("./index.html", location.href));
    const logoUrl = addTheme(new URL("./index.html", location.href));
    $("backLink").href = backUrl.href;
    $("logoLink").href = logoUrl.href;

    function normalize(v) {
      return String(v ?? "").toLocaleLowerCase("ko-KR").trim();
    }

    function highlightText(text, q) {
      if(!q) return esc(text);
      const source = String(text ?? "");
      const lower = source.toLocaleLowerCase("ko-KR");
      const target = q.toLocaleLowerCase("ko-KR");
      const index = lower.indexOf(target);
      if(index < 0) return esc(source);

      return esc(source.slice(0,index)) +
        "<mark>" + esc(source.slice(index,index+q.length)) + "</mark>" +
        esc(source.slice(index+q.length));
    }

    function searchableValues(row) {
      const excluded = new Set([
        "id","user_id","category_id","created_at","updated_at",
        "image_url","avatar_url","date"
      ]);
      return Object.entries(row || {})
        .filter(([key,value]) =>
          !excluded.has(key) &&
          typeof value === "string" &&
          value.trim()
        )
        .map(([,value]) => value.trim());
    }

    function matchesRow(row, q) {
      if(!q) return false;
      return searchableValues(row).some(value => normalize(value).includes(normalize(q)));
    }

    function firstUsefulValue(row, preferred = []) {
      for(const key of preferred) {
        if(typeof row?.[key] === "string" && row[key].trim()) return row[key].trim();
      }
      return searchableValues(row)[0] || "RECORD";
    }

    function snippet(row, q) {
      const values = searchableValues(row);
      const hit = values.find(v => normalize(v).includes(normalize(q))) || values[0] || "";
      if(!hit) return "";
      const lower = hit.toLocaleLowerCase("ko-KR");
      const index = lower.indexOf(q.toLocaleLowerCase("ko-KR"));
      if(index < 0) return hit.length > 100 ? hit.slice(0,100) + "…" : hit;

      const start = Math.max(0, index - 42);
      const end = Math.min(hit.length, index + q.length + 58);
      return (start > 0 ? "…" : "") + hit.slice(start,end) + (end < hit.length ? "…" : "");
    }

    function renderEmpty(message) {
      return `<div class="empty">${esc(message)}</div>`;
    }

    async function loadResults() {
      if(!query) {
        $("summary").textContent = "검색어를 입력해주세요.";
        $("diaryResults").innerHTML = renderEmpty("SEARCH로 검색해보세요.");
        $("archiveResults").innerHTML = renderEmpty("SEARCH로 검색해보세요.");
        return;
      }

      $("summary").textContent = `"${query}" 검색 결과를 불러오는 중…`;

      const [
        {data: diaries, error: diaryError},
        {data: categories, error: categoryError},
        {data: archives, error: archiveError}
      ] = await Promise.all([
        supabase.from("diary")
          .select("id,date,title,content,image_url,created_at")
          .order("date",{ascending:false})
          .order("created_at",{ascending:false}),
        supabase.from("archive_categories")
          .select("id,name,description,image_url,text_color,created_at")
          .order("created_at",{ascending:true}),
        supabase.from("archives")
          .select("*")
      ]);

      if(diaryError) {
        console.error("SEARCH DIARY", diaryError);
      }

      if(categoryError) {
        console.error("SEARCH CATEGORY", categoryError);
      }

      if(archiveError) {
        console.error("SEARCH ARCHIVE", archiveError);
      }

      const diaryHits = (diaries || []).filter(row =>
        normalize(`${row.title || ""} ${row.content || ""}`).includes(normalize(query))
      );

      const categoryHits = (categories || []).filter(row =>
        normalize(`${row.name || ""} ${row.description || ""}`).includes(normalize(query))
      );

      const categoryMap = new Map((categories || []).map(row => [String(row.id), row]));
      const archiveHits = (archives || [])
        .filter(row => matchesRow(row, query))
        .map(row => ({
          row,
          category: categoryMap.get(String(row.category_id))
        }));

      $("summary").textContent =
        `"${query}" · ${diaryHits.length + categoryHits.length + archiveHits.length} results`;

      $("diaryResults").innerHTML = diaryHits.length
        ? diaryHits.map(row => `
            <a class="result" href="./diary-detail.html?id=${encodeURIComponent(row.id)}&theme=${encodeURIComponent(currentTheme)}">
              <div class="result-meta">${esc(formatDate(row.date))}</div>
              <div class="result-title">${highlightText(row.title || "DIARY", query)}</div>
              ${row.content ? `<div class="result-snippet">${highlightText(row.content, query)}</div>` : ""}
            </a>
          `).join("")
        : renderEmpty("검색 결과가 없습니다.");

      const categoryHtml = categoryHits.map(row => `
        <a class="result" href="./archive-view.html?category=${encodeURIComponent(row.id)}&theme=${encodeURIComponent(currentTheme)}">
          <div class="result-meta">ARCHIVE</div>
          <div class="result-title">${highlightText(row.name || "ARCHIVE", query)}</div>
          ${row.description ? `<div class="result-snippet">${highlightText(row.description, query)}</div>` : ""}
        </a>
      `).join("");

      const archiveHtml = archiveHits.map(({row,category}) => {
        const title = firstUsefulValue(row, ["title","name","subject"]);
        const categoryName = category?.name || "ARCHIVE";
        const href = category
          ? `./archive-view.html?category=${encodeURIComponent(category.id)}&theme=${encodeURIComponent(currentTheme)}`
          : `./index.html?theme=${encodeURIComponent(currentTheme)}`;

        return `
          <a class="result" href="${href}">
            <div class="result-meta">${esc(categoryName)}</div>
            <div class="result-title">${highlightText(title, query)}</div>
            <div class="result-snippet">${highlightText(snippet(row, query), query)}</div>
          </a>
        `;
      }).join("");

      $("archiveResults").innerHTML =
        categoryHtml + archiveHtml ||
        renderEmpty("검색 결과가 없습니다.");
    }

    $("searchForm").addEventListener("submit", e => {
      e.preventDefault();
      const value = $("searchInput").value.trim();
      const url = new URL(location.href);
      if(value) url.searchParams.set("q", value);
      else url.searchParams.delete("q");
      url.searchParams.set("theme", currentTheme);
      location.href = url.href;
    });

    loadResults().catch(error => {
      console.error("SEARCH LOAD", error);
      $("summary").textContent = "검색 중 오류가 발생했습니다.";
      $("diaryResults").innerHTML = renderEmpty("DIARY 검색에 실패했습니다.");
      $("archiveResults").innerHTML = renderEmpty("ARCHIVE 검색에 실패했습니다.");
    });
  </script>
</body>
</html>
