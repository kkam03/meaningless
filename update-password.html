<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meaningless — password</title>
<style>
*{box-sizing:border-box}
:root{--text:#29262a;--muted:#8a8588;--line:#e5eeee;--point:#62b9aa;--soft:#dff2ee}
body{margin:0;background:#fff;color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{width:min(390px,calc(100% - 40px));margin:18vh auto 0}
.logo{font-size:28px;font-weight:700;letter-spacing:-.055em;margin-bottom:5px;color:var(--point)}
.sub{font-size:11px;color:var(--muted);margin-bottom:42px}
.field{margin-bottom:20px}
label{display:block;margin-bottom:7px;color:var(--point);font-size:10px;font-weight:700;letter-spacing:.08em}
input{width:100%;height:43px;padding:0 12px;border:1px solid var(--line);border-radius:9px;outline:none;font:inherit;font-size:13px}
input:focus{border-color:var(--point);box-shadow:0 0 0 3px var(--soft)}
button{width:100%;height:42px;border:1px solid var(--point);border-radius:9px;background:var(--point);color:#fff;font:inherit;font-size:11px;cursor:pointer}
#message{min-height:20px;margin-top:16px;color:var(--muted);font-size:10px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">meaningless</div>
  <div class="sub">set a new password</div>

  <form id="form">
    <div class="field">
      <label for="password">NEW PASSWORD</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required>
    </div>
    <div class="field">
      <label for="confirm">CONFIRM PASSWORD</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="6" required>
    </div>
    <button type="submit">UPDATE PASSWORD</button>
  </form>
  <div id="message"></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const form = document.getElementById("form");
const message = document.getElementById("message");

let recoveryReady = false;

supabase.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    recoveryReady = true;
    message.textContent = "새 비밀번호를 입력해주세요.";
  }
});

const { data: { session } } = await supabase.auth.getSession();
if (session) {
  recoveryReady = true;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (password !== confirm) {
    message.textContent = "비밀번호가 서로 다릅니다.";
    return;
  }

  if (password.length < 6) {
    message.textContent = "비밀번호는 6자 이상이어야 합니다.";
    return;
  }

  message.textContent = "변경 중…";

  const { error } = await supabase.auth.updateUser({ password });

  if (error) {
    message.textContent = "비밀번호 변경에 실패했습니다.";
    return;
  }

  message.textContent = "비밀번호가 변경되었습니다.";
  setTimeout(() => {
    location.href = "./login.html";
  }, 1000);
});
</script>
</body>
</html>
