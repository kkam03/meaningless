<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meaningless — photo </title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --background: #fff;
      --text: #29262a;
      --muted: #8a8588;
      --line: #e5eeee;
      --point: #62b9aa;
      --point-soft: #dff2ee;
      --theme-bg: #f7fbfa;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    input, textarea, button { font: inherit; }

    .container {
      width: min(680px, calc(100% - 40px));
      margin: 0 auto;
    }

    .theme-wrap {
      position: fixed;
      top: 28px;
      right: 28px;
      z-index: 10;
    }

    .theme-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .08em;
      cursor: pointer;
      padding: 6px 0;
    }

    .theme-button:hover { color: var(--point); }

    .theme-menu {
      display: none;
      width: 145px;
      margin-top: 6px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 8px 25px rgba(50,100,95,.08);
    }

    .theme-wrap.open .theme-menu { display: block; }

    .theme-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-size: 11px;
      text-align: left;
      cursor: pointer;
    }

    .theme-option:hover { background: var(--point-soft); }

    .theme-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--theme-color);
    }

    header {
      padding: 45px 0 48px;
    }

    .back {
      display: inline-block;
      margin-bottom: 48px;
      color: var(--muted);
      font-size: 11px;
    }

    .back:hover { color: var(--point); }

    .heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-left: 3px;
    }

    .label {
      color: var(--point);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 11px;
    }

    main {
      padding-bottom: 70px;
    }

    .field {
      margin-bottom: 30px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--point);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: var(--text);
      font-size: 13px;
    }

    input {
      height: 42px;
      padding: 0 12px;
    }

    textarea {
      min-height: 260px;
      padding: 13px 12px;
      resize: vertical;
      line-height: 1.9;
    }

    input:focus,
    textarea:focus {
      border-color: var(--point);
      box-shadow: 0 0 0 3px var(--point-soft);
    }

    .title-field input {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -.025em;
    }

    .date-field input {
      width: 180px;
      color: var(--text);
    }

    .editor-wrap {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      overflow: hidden;
    }

    .editor {
      min-height: 260px;
      padding: 13px 12px;
      outline: none;
      font-size: 13px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .editor:empty::before {
      content: attr(data-placeholder);
      color: #aaa;
      pointer-events: none;
    }

    .editor:focus {
      box-shadow: inset 0 0 0 1px var(--point);
    }

    .editor img {
      display: block;
      max-width: 100%;
      width: auto;
      height: auto;
      margin: 14px 0;
      border-radius: 8px;
    }

    .editor-toolbar {
      display: flex;
      justify-content: flex-end;
      padding: 8px 10px;
      border-top: 1px solid var(--line);
      background: var(--theme-bg);
    }

    .editor-toolbar button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .06em;
      cursor: pointer;
      padding: 4px 2px;
    }

    .editor-toolbar button:hover {
      color: var(--point);
    }

    .photo-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 105px;
      border: 1px dashed #cfe5e1;
      border-radius: 10px;
      background: var(--theme-bg);
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
    }

    .photo-placeholder input {
      display: none;
    }

    .photo-note {
      margin-top: 7px;
      color: var(--muted);
      font-size: 9px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .actions button,
    .actions a {
      border-radius: 8px;
      padding: 8px 15px;
      font-size: 11px;
      cursor: pointer;
    }

    .cancel {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
    }

    .save {
      border: 1px solid var(--point);
      background: var(--point);
      color: #fff;
    }

    .save:hover { opacity: .82; }

    footer {
      padding: 0 0 50px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .container { width: min(100% - 30px, 680px); }

      .theme-wrap {
        top: 18px;
        right: 18px;
      }

      header {
        padding-top: 32px;
        padding-bottom: 40px;
      }

      .back { margin-bottom: 40px; }

      .heading {
        gap: 10px;
      }

      .date-field input {
        width: 100%;
      }

      textarea {
        min-height: 230px;
      }

      .actions {
        margin-top: 38px;
      }
    }
  </style>
</head>

<body>
  <div class="theme-wrap" id="themeWrap">
    <button class="theme-button" id="themeButton" type="button">THEME</button>
    <div class="theme-menu">
      <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint</button>
      <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d8799a"></span> Pink</button>
      <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender</button>
      <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue</button>
    </div>
  </div>

  <div class="container">
    <header>
      <a href="index.html" class="back">← DIARY</a>

      <div class="heading">
        <div class="label">♡ NEW DIARY</div>
        <div class="subtitle">하루 한 줄</div>
      </div>
    </header>

    <main>
      <section class="field date-field">
        <label class="field-label" for="date">DATE</label>
        <input id="date" type="date">
      </section>

      <section class="field title-field">
        <label class="field-label" for="title">TITLE</label>
        <input id="title" type="text" placeholder="오늘의 제목">
      </section>

      <section class="field">
        <label class="field-label">CONTENT</label>
        <div class="editor-wrap">
          <div
            id="content"
            class="editor"
            contenteditable="true"
            data-placeholder="오늘을 기록해두기."
          ></div>
          <div class="editor-toolbar">
            <button id="insertPhoto" type="button">＋ PHOTO</button>
            <input id="photo" type="file" accept="image/*" hidden>
          </div>
        </div>
        <div class="photo-note">사진은 저장할 때 Supabase Storage에 업로드됩니다.</div>
      </section>

      <div class="actions">
        <a href="index.html" class="cancel">CANCEL</a>
        <button class="save" id="save" type="button">SAVE</button>
      </div>
    </main>

    <footer>
      <a href="index.html">♡ back to meaningless</a>
    </footer>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const themes = {
      mint: { point:"#62b9aa", pointSoft:"#dff2ee", line:"#e5eeee", themeBg:"#f7fbfa" },
      pink: { point:"#d8799a", pointSoft:"#f6dfe8", line:"#eee3e7", themeBg:"#fff8fa" },
      lavender: { point:"#9a8bc2", pointSoft:"#e9e4f4", line:"#e8e5ee", themeBg:"#faf8fd" },
      blue: { point:"#70a9c2", pointSoft:"#e0eef3", line:"#e3ebee", themeBg:"#f7fbfd" }
    };

    function saveThemeCookie(name) {
      document.cookie = "meaningless-theme=" + encodeURIComponent(name) +
        "; path=/; max-age=31536000; SameSite=Lax";
    }

    function getThemeFromCookie() {
      const prefix = "meaningless-theme=";
      for (const cookie of (document.cookie || "").split(";")) {
        const value = cookie.trim();
        if (value.startsWith(prefix)) return decodeURIComponent(value.slice(prefix.length));
      }
      return null;
    }

    function applyTheme(name, save = true) {
      const theme = themes[name] || themes.mint;
      document.documentElement.style.setProperty("--point", theme.point);
      document.documentElement.style.setProperty("--point-soft", theme.pointSoft);
      document.documentElement.style.setProperty("--line", theme.line);
      document.documentElement.style.setProperty("--theme-bg", theme.themeBg);
      if (save) saveThemeCookie(name);
    }

    const params = new URLSearchParams(location.search);
    const editId = params.get("edit");
    const urlTheme = params.get("theme");
    applyTheme(themes[urlTheme] ? urlTheme : (getThemeFromCookie() || "mint"), true);

    const themeWrap = document.getElementById("themeWrap");
    document.getElementById("themeButton").addEventListener("click", () => {
      themeWrap.classList.toggle("open");
    });

    document.querySelectorAll(".theme-option").forEach(button => {
      button.addEventListener("click", () => {
        applyTheme(button.dataset.theme);
        const url = new URL(location.href);
        url.searchParams.set("theme", button.dataset.theme);
        history.replaceState(null, "", url.pathname + "?" + url.searchParams.toString());
        themeWrap.classList.remove("open");
      });
    });

    document.addEventListener("click", event => {
      if (!themeWrap.contains(event.target)) themeWrap.classList.remove("open");
    });

    const label = document.querySelector(".heading .label");
    const photoNote = document.querySelector(".photo-note");
    const saveButton = document.getElementById("save");
    const cancelLinks = document.querySelectorAll('a[href="index.html"]');

    if (editId) {
      label.textContent = "♡ EDIT DIARY";
      saveButton.textContent = "UPDATE";
      if (photoNote) photoNote.textContent = "기존 사진 기능은 다음 단계에서 연결합니다.";

      const { data: post, error } = await supabase
        .from("diary")
        .select("id,date,title,content,image_url")
        .eq("id", editId)
        .single();

      if (error || !post) {
        console.error("DIARY EDIT LOAD", error);
        alert("수정할 DIARY를 불러오지 못했습니다.");
        location.href = "./index.html";
      } else {
        document.getElementById("date").value = post.date || "";
        document.getElementById("title").value = post.title || "";
        const loadedContent = post.content || "";
        document.getElementById("content").innerHTML =
          /<\/?(img|p|div|br|strong|em|ul|ol|li)[\s>]/i.test(loadedContent)
            ? loadedContent
            : loadedContent.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
      }
    } else {
      const dateInput = document.getElementById("date");
      const today = new Date();
      dateInput.value = [
        today.getFullYear(),
        String(today.getMonth() + 1).padStart(2, "0"),
        String(today.getDate()).padStart(2, "0")
      ].join("-");
    }

    cancelLinks.forEach(link => {
      link.href = editId
        ? `./diary-detail.html?id=${encodeURIComponent(editId)}&theme=${encodeURIComponent(getThemeFromCookie() || "mint")}`
        : `./index.html?theme=${encodeURIComponent(getThemeFromCookie() || "mint")}`;
    });

    const editor = document.getElementById("content");
    const insertPhotoButton = document.getElementById("insertPhoto");
    const photoInput = document.getElementById("photo");

    let savedSelection = null;
    const pendingImages = new Map();

    function saveEditorSelection() {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      if (editor.contains(range.commonAncestorContainer)) {
        savedSelection = range.cloneRange();
      }
    }

    editor.addEventListener("keyup", saveEditorSelection);
    editor.addEventListener("mouseup", saveEditorSelection);
    editor.addEventListener("input", saveEditorSelection);
    editor.addEventListener("blur", saveEditorSelection);

    insertPhotoButton.addEventListener("mousedown", event => {
      event.preventDefault();
      saveEditorSelection();
      photoInput.click();
    });

    photoInput.addEventListener("change", () => {
      const file = photoInput.files && photoInput.files[0];
      if (!file) return;

      const localUrl = URL.createObjectURL(file);
      const imageId = crypto.randomUUID();
      pendingImages.set(imageId, { file, localUrl });

      editor.focus();

      const selection = window.getSelection();
      if (savedSelection) {
        selection.removeAllRanges();
        selection.addRange(savedSelection);
      } else {
        const range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
      }

      const img = document.createElement("img");
      img.src = localUrl;
      img.alt = "첨부 사진";
      img.contentEditable = "false";
      img.dataset.pendingImageId = imageId;

      const range = selection.getRangeAt(0);
      range.deleteContents();
      range.insertNode(img);

      const spacer = document.createTextNode("\n");
      img.after(spacer);

      const nextRange = document.createRange();
      nextRange.setStartAfter(spacer);
      nextRange.collapse(true);
      selection.removeAllRanges();
      selection.addRange(nextRange);

      saveEditorSelection();
      photoInput.value = "";
      updateSaveButtonState();
    });

    const STORAGE_BUCKET = "diary-images";

    async function resizeDiaryImage(file) {
      // 블로그용: 긴 변 최대 1600px, JPEG 품질 0.82
      // GIF는 애니메이션 보존을 위해 원본 그대로 업로드합니다.
      if (file.type === "image/gif") return { file, extension: "gif" };

      const bitmap = await createImageBitmap(file);
      const maxSize = 1600;
      const scale = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height));
      const width = Math.max(1, Math.round(bitmap.width * scale));
      const height = Math.max(1, Math.round(bitmap.height * scale));

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(bitmap, 0, 0, width, height);
      bitmap.close();

      const blob = await new Promise(resolve =>
        canvas.toBlob(resolve, "image/jpeg", 0.82)
      );

      if (!blob) throw new Error("사진을 압축하지 못했습니다.");

      return {
        file: new File(
          [blob],
          `${file.name.replace(/\.[^.]+$/, "")}.jpg`,
          { type: "image/jpeg" }
        ),
        extension: "jpg"
      };
    }

    async function uploadPendingImages() {
      const images = [...editor.querySelectorAll("img[data-pending-image-id]")];

      for (const img of images) {
        const imageId = img.dataset.pendingImageId;
        const item = pendingImages.get(imageId);
        if (!item) continue;

        const processed = await resizeDiaryImage(item.file);
        const filePath = `${crypto.randomUUID()}.${processed.extension}`;

        const { error: uploadError } = await supabase.storage
          .from(STORAGE_BUCKET)
          .upload(filePath, processed.file, {
            cacheControl: "3600",
            upsert: false,
            contentType: processed.file.type
          });

        if (uploadError) throw uploadError;

        const { data: publicData } = supabase.storage
          .from(STORAGE_BUCKET)
          .getPublicUrl(filePath);

        img.src = publicData.publicUrl;
        img.removeAttribute("data-pending-image-id");
        pendingImages.delete(imageId);
        URL.revokeObjectURL(item.localUrl);
      }
    }

    function updateSaveButtonState() {
      const date = document.getElementById("date").value;
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").innerText.trim();
      saveButton.disabled = !(date && title && content);
    }

    ["date", "title", "content"].forEach(id => {
      document.getElementById(id).addEventListener("input", updateSaveButtonState);
      document.getElementById(id).addEventListener("change", updateSaveButtonState);
    });

    saveButton.addEventListener("click", async () => {
      const date = document.getElementById("date").value;
      const title = document.getElementById("title").value.trim();
      const contentText = document.getElementById("content").innerText.trim();
      const contentHtml = document.getElementById("content").innerHTML.trim();

      if (!date || !title || !contentText) {
        alert("날짜, 제목, 내용을 입력해주세요.");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = editId ? "UPDATING..." : "SAVING...";

      try {
        saveButton.textContent = editId ? "UPLOADING..." : "UPLOADING...";
        await uploadPendingImages();

        const content = document.getElementById("content").innerHTML.trim();

        if (editId) {
          const { error } = await supabase
            .from("diary")
            .update({ date, title, content })
            .eq("id", editId);

          if (error) throw error;

          location.href = `./diary-detail.html?id=${encodeURIComponent(editId)}&theme=${encodeURIComponent(getThemeFromCookie() || "mint")}`;
        } else {
          // 새 DIARY는 현재 로그인한 사용자의 user_id를 함께 저장합니다.
          const { data: { user }, error: userError } = await supabase.auth.getUser();
          if (userError) throw userError;
          if (!user) {
            alert("로그인이 필요합니다.");
            saveButton.disabled = false;
            saveButton.textContent = "SAVE";
            return;
          }

          const { data, error } = await supabase
            .from("diary")
            .insert([{
              user_id: user.id,
              date,
              title,
              content
            }])
            .select("id")
            .single();

          if (error) throw error;

          location.href = `./diary-detail.html?id=${encodeURIComponent(data.id)}&theme=${encodeURIComponent(getThemeFromCookie() || "mint")}`;
        }
      } catch (error) {
        console.error("DIARY SAVE", error);
        alert("저장에 실패했습니다.\n" + error.message);
        saveButton.textContent = editId ? "UPDATE" : "SAVE";
        updateSaveButtonState();
      }
    });

    updateSaveButtonState();
  </script>
</body>
</html>
