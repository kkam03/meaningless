<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meaningless — new diary</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --background: #fff;
      --text: #29262a;
      --muted: #8a8588;
      --line: #e5eeee;
      --point: #62b9aa;
      --point-soft: #dff2ee;
      --theme-bg: #f7fbfa;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }
    input, textarea, button { font: inherit; }

    .container {
      width: min(680px, calc(100% - 40px));
      margin: 0 auto;
    }

    .theme-wrap {
      position: fixed;
      top: 28px;
      right: 28px;
      z-index: 10;
    }

    .theme-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .08em;
      cursor: pointer;
      padding: 6px 0;
    }

    .theme-button:hover { color: var(--point); }

    .theme-menu {
      display: none;
      width: 145px;
      margin-top: 6px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 8px 25px rgba(50,100,95,.08);
    }

    .theme-wrap.open .theme-menu { display: block; }

    .theme-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font-size: 11px;
      text-align: left;
      cursor: pointer;
    }

    .theme-option:hover { background: var(--point-soft); }

    .theme-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--theme-color);
    }

    header {
      padding: 45px 0 48px;
    }

    .back {
      display: inline-block;
      margin-bottom: 48px;
      color: var(--muted);
      font-size: 11px;
    }

    .back:hover { color: var(--point); }

    .heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-left: 3px;
    }

    .label {
      color: var(--point);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 11px;
    }

    main {
      padding-bottom: 70px;
    }

    .field {
      margin-bottom: 30px;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      color: var(--point);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: var(--text);
      font-size: 13px;
    }

    input {
      height: 42px;
      padding: 0 12px;
    }

    textarea {
      min-height: 260px;
      padding: 13px 12px;
      resize: vertical;
      line-height: 1.9;
    }

    input:focus,
    textarea:focus {
      border-color: var(--point);
      box-shadow: 0 0 0 3px var(--point-soft);
    }

    .title-field input {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -.025em;
    }

    .date-field input {
      width: 180px;
      color: var(--text);
    }

    .photo-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 105px;
      border: 1px dashed #cfe5e1;
      border-radius: 10px;
      background: var(--theme-bg);
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
    }

    .photo-placeholder input {
      display: none;
    }

    .photo-note {
      margin-top: 7px;
      color: var(--muted);
      font-size: 9px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 48px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .actions button,
    .actions a {
      border-radius: 8px;
      padding: 8px 15px;
      font-size: 11px;
      cursor: pointer;
    }

    .cancel {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
    }

    .save {
      border: 1px solid var(--point);
      background: var(--point);
      color: #fff;
    }

    .save:hover { opacity: .82; }

    footer {
      padding: 0 0 50px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .container { width: min(100% - 30px, 680px); }

      .theme-wrap {
        top: 18px;
        right: 18px;
      }

      header {
        padding-top: 32px;
        padding-bottom: 40px;
      }

      .back { margin-bottom: 40px; }

      .heading {
        gap: 10px;
      }

      .date-field input {
        width: 100%;
      }

      textarea {
        min-height: 230px;
      }

      .actions {
        margin-top: 38px;
      }
    }
  </style>
</head>

<body>
  <div class="theme-wrap" id="themeWrap">
    <button class="theme-button" id="themeButton" type="button">THEME</button>
    <div class="theme-menu">
      <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint</button>
      <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d8799a"></span> Pink</button>
      <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender</button>
      <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue</button>
    </div>
  </div>

  <div class="container">
    <header>
      <a href="index.html" class="back">← DIARY</a>

      <div class="heading">
        <div class="label">♡ NEW DIARY</div>
        <div class="subtitle">하루 한 줄</div>
      </div>
    </header>

    <main>
      <section class="field date-field">
        <label class="field-label" for="date">DATE</label>
        <input id="date" type="date">
      </section>

      <section class="field title-field">
        <label class="field-label" for="title">TITLE</label>
        <input id="title" type="text" placeholder="오늘의 제목">
      </section>

      <section class="field">
        <label class="field-label" for="content">CONTENT</label>
        <textarea id="content" placeholder="오늘을 기록해두기."></textarea>
      </section>

      <section class="field">
        <label class="field-label">PHOTO <span style="font-weight:400; letter-spacing:0">(optional)</span></label>
        <label class="photo-placeholder">
          <input id="photo" type="file" accept="image/*">
          + 사진 추가
        </label>
        <div class="photo-note">사진 기능은 다음 단계에서 실제 저장과 연결합니다.</div>
      </section>

      <div class="actions">
        <a href="index.html" class="cancel">CANCEL</a>
        <button class="save" id="save" type="button">SAVE</button>
      </div>
    </main>

    <footer>
      <a href="index.html">♡ back to meaningless</a>
    </footer>
  </div>

  <script>
    const themes = {
      mint: { point:"#62b9aa", pointSoft:"#dff2ee", line:"#e5eeee", themeBg:"#f7fbfa" },
      pink: { point:"#d8799a", pointSoft:"#f6dfe8", line:"#eee3e7", themeBg:"#fff8fa" },
      lavender: { point:"#9a8bc2", pointSoft:"#e9e4f4", line:"#e8e5ee", themeBg:"#faf8fd" },
      blue: { point:"#70a9c2", pointSoft:"#e0eef3", line:"#e3ebee", themeBg:"#f7fbfd" }
    };

    function getThemeFromCookie() {
      const match = document.cookie.match(/(?:^|;\s*)meaningless-theme=([^;]+)/);
      const name = match ? decodeURIComponent(match[1]) : null;
      return themes[name] ? name : null;
    }

    function saveThemeCookie(name) {
      document.cookie = "meaningless-theme=" + encodeURIComponent(name) +
        "; path=/; max-age=31536000; SameSite=Lax";
    }

    function applyTheme(name, save = true) {
      const theme = themes[name] || themes.mint;
      document.documentElement.style.setProperty("--point", theme.point);
      document.documentElement.style.setProperty("--point-soft", theme.pointSoft);
      document.documentElement.style.setProperty("--line", theme.line);
      document.documentElement.style.setProperty("--theme-bg", theme.themeBg);
      if (save) saveThemeCookie(name);
    }

    const params = new URLSearchParams(location.search);
    const savedTheme = themes[params.get("theme")]
      ? params.get("theme")
      : (getThemeFromCookie() || "mint");

    applyTheme(savedTheme, false);

    const themeWrap = document.getElementById("themeWrap");
    document.getElementById("themeButton").addEventListener("click", () => {
      themeWrap.classList.toggle("open");
    });

    document.querySelectorAll(".theme-option").forEach(button => {
      button.addEventListener("click", () => {
        applyTheme(button.dataset.theme);
        themeWrap.classList.remove("open");
      });
    });

    document.addEventListener("click", event => {
      if (!themeWrap.contains(event.target)) themeWrap.classList.remove("open");
    });

    const dateInput = document.getElementById("date");
    const today = new Date();
    dateInput.value = [
      today.getFullYear(),
      String(today.getMonth() + 1).padStart(2, "0"),
      String(today.getDate()).padStart(2, "0")
    ].join("-");

    document.getElementById("save").addEventListener("click", () => {
      const title = document.getElementById("title").value.trim();
      const content = document.getElementById("content").value.trim();

      if (!title || !content) {
        alert("제목과 내용을 입력해주세요.");
        return;
      }

      alert("작성창 디자인 테스트용입니다. 다음 단계에서 실제 저장 기능을 연결합니다!");
    });
  </script>
</body>
</html>
