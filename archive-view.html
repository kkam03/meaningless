<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meaningless — archive</title>
<style>
*{box-sizing:border-box}
:root{
  --background:#fff;
  --text:#29262a;
  --muted:#8a8588;
  --line:#e5eeee;
  --point:#62b9aa;
  --point-soft:#dff2ee;
  --theme-bg:#f7fbfa;
}
body{
  margin:0;
  background:var(--background);
  color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.7;
}
a{color:inherit;text-decoration:none}
.container{width:min(680px,calc(100% - 40px));margin:0 auto}

.theme-wrap{position:fixed;top:28px;right:28px;z-index:20}
.theme-button{
  border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:10px;letter-spacing:.08em;
  cursor:pointer;padding:6px 0
}
.theme-button:hover{color:var(--point)}
.theme-menu{
  display:none;width:145px;margin-top:6px;padding:8px;
  border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.97);
  box-shadow:0 8px 25px rgba(50,100,95,.08)
}
.theme-wrap.open .theme-menu{display:block}
.theme-option{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 7px;border:0;border-radius:7px;
  background:transparent;color:var(--text);
  font:inherit;font-size:11px;text-align:left;cursor:pointer
}
.theme-option:hover{background:var(--point-soft)}
.theme-dot{width:9px;height:9px;border-radius:50%;background:var(--theme-color)}

header{padding:45px 0 38px}
.back{display:inline-block;margin-bottom:50px;color:var(--muted);font-size:11px}
.back:hover{color:var(--point)}

.archive-label{
  color:var(--point);
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em
}
.archive-type{
  margin-top:7px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.08em
}
.archive-title{
  margin:10px 0 0;
  font-size:30px;
  font-weight:700;
  letter-spacing:-.05em
}

main{padding:0 0 70px}
.hero-photo{
  width:100%;
  max-height:430px;
  object-fit:cover;
  display:block;
  margin:2px 0 34px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--theme-bg)
}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  margin-bottom:28px;
  color:var(--muted);
  font-size:10px
}
.meta span + span::before{
  content:"·";
  margin-right:18px;
  color:var(--line)
}

.details{
  display:grid;
  gap:12px;
  margin-top:4px
}
.detail-row{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:18px;
  padding:12px 0;
  border-top:1px solid var(--line);
  font-size:12px
}
.detail-key{
  color:var(--muted);
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase
}
.detail-value{
  white-space:pre-wrap;
  word-break:break-word
}
.record-divider{
  margin:52px 0 22px;
  border-top:1px solid var(--line)
}
.records-label{
  color:var(--point);
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  margin-bottom:18px
}
.record{
  padding:16px 0 28px;
  border-bottom:1px solid var(--line)
}
.record-date{
  color:var(--muted);
  font-size:10px;
  margin-bottom:6px
}
.record-title{
  font-size:16px;
  font-weight:600;
  letter-spacing:-.02em
}
.record-content{
  margin-top:13px;
  white-space:pre-wrap;
  font-size:12px;
  line-height:1.9
}
.record-image{
  display:block;
  width:100%;
  max-height:420px;
  object-fit:cover;
  margin-top:16px;
  border-radius:12px;
  border:1px solid var(--line)
}
.empty{
  padding:24px 0;
  color:var(--muted);
  font-size:11px
}
footer{
  padding:0 0 50px;
  color:var(--muted);
  font-size:11px
}

@media(max-width:600px){
  .container{width:min(100% - 30px,680px)}
  .theme-wrap{top:18px;right:18px}
  header{padding-top:32px;padding-bottom:30px}
  .back{margin-bottom:42px}
  .archive-title{font-size:24px}
  .detail-row{grid-template-columns:88px 1fr;gap:12px}
  .hero-photo{max-height:320px}
}
</style>
</head>
<body>

<div class="theme-wrap" id="themeWrap">
  <button class="theme-button" id="themeButton" type="button">THEME</button>
  <div class="theme-menu">
    <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint</button>
    <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d8799a"></span> Pink</button>
    <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender</button>
    <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue</button>
  </div>
</div>

<div class="container">
  <header>
    <a href="index.html" class="back" id="backLink">← ARCHIVE</a>
    <div class="archive-label">♡ ARCHIVE</div>
    <div class="archive-type" id="archiveType"></div>
    <h1 class="archive-title" id="archiveTitle">불러오는 중…</h1>
  </header>

  <main>
    <div id="hero"></div>
    <div class="meta" id="meta"></div>
    <div class="details" id="details"></div>

    <div class="record-divider"></div>
    <div class="records-label">RECORDS</div>
    <div id="records"></div>
  </main>

  <footer>
    <a href="index.html">♡ back to meaningless</a>
  </footer>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const themes={
  mint:{point:"#62b9aa",pointSoft:"#dff2ee",line:"#e5eeee",themeBg:"#f7fbfa"},
  pink:{point:"#d8799a",pointSoft:"#f6dfe8",line:"#eee3e7",themeBg:"#fff8fa"},
  lavender:{point:"#9a8bc2",pointSoft:"#e9e4f4",line:"#e8e5ee",themeBg:"#faf8fd"},
  blue:{point:"#70a9c2",pointSoft:"#e0eef3",line:"#e3ebee",themeBg:"#f7fbfd"}
};

function getTheme(){
  const params=new URLSearchParams(location.search);
  if(themes[params.get("theme")])return params.get("theme");
  const m=document.cookie.match(/(?:^|;\s*)meaningless-theme=([^;]+)/);
  const n=m?decodeURIComponent(m[1]):null;
  return themes[n]?n:"mint";
}
function saveTheme(n){
  document.cookie="meaningless-theme="+encodeURIComponent(n)+"; path=/; max-age=31536000; SameSite=Lax";
}
function applyTheme(n,save=true){
  const t=themes[n]||themes.mint;
  document.documentElement.style.setProperty("--point",t.point);
  document.documentElement.style.setProperty("--point-soft",t.pointSoft);
  document.documentElement.style.setProperty("--line",t.line);
  document.documentElement.style.setProperty("--theme-bg",t.themeBg);
  if(save)saveTheme(n);
}

let currentTheme=getTheme();
applyTheme(currentTheme,false);

const wrap=document.getElementById("themeWrap");
document.getElementById("themeButton").addEventListener("click",e=>{
  e.stopPropagation();
  wrap.classList.toggle("open");
});
document.querySelectorAll(".theme-option").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentTheme=btn.dataset.theme;
    applyTheme(currentTheme);
    wrap.classList.remove("open");
  });
});
document.addEventListener("click",e=>{
  if(!wrap.contains(e.target))wrap.classList.remove("open");
});

const params=new URLSearchParams(location.search);
const archiveId=params.get("id");

document.getElementById("backLink").href="./index.html?theme="+encodeURIComponent(currentTheme);

const typeLabels={
  basic:"BASIC",
  concert:"CONCERT",
  travel:"TRAVEL",
  movie:"MOVIE",
  custom:"ARCHIVE"
};
const typeNames={
  basic:"기본 기록",
  concert:"공연 / 콘서트",
  travel:"여행",
  movie:"영화",
  custom:"직접 설정"
};

function esc(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatDate(date){
  if(!date)return "";
  const d=new Date(`${date}T00:00:00`);
  if(Number.isNaN(d.getTime()))return String(date);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}

const keyLabels={
  field_1:"FIELD 01",
  field_2:"FIELD 02",
  field_3:"FIELD 03",
  field_4:"FIELD 04",
  field_5:"FIELD 05"
};

const semanticLabels={
  concert:["공연장","회차","셋리스트","앵콜"],
  travel:["장소","숙소","여행 메모"],
  movie:["감독","별점","감상 메모"],
  basic:["기록"],
  custom:[]
};

function renderDetails(type, details){
  const container=document.getElementById("details");
  const entries=Object.entries(details||{}).filter(([,v])=>String(v||"").trim()!=="");
  if(!entries.length){
    container.innerHTML="";
    return;
  }

  const labels=semanticLabels[type]||[];
  container.innerHTML=entries.map(([key,value],index)=>{
    const label=labels[index] || keyLabels[key] || key.replaceAll("_"," ").toUpperCase();
    return `
      <div class="detail-row">
        <div class="detail-key">${esc(label)}</div>
        <div class="detail-value">${esc(value)}</div>
      </div>
    `;
  }).join("");
}

async function loadArchive(){
  if(!archiveId){
    document.getElementById("archiveTitle").textContent="ARCHIVE를 찾을 수 없습니다.";
    return;
  }

  const {data:archive,error:archiveError}=await supabase
    .from("archives")
    .select("id,name,type,created_at")
    .eq("id",archiveId)
    .single();

  if(archiveError){
    console.error(archiveError);
    document.getElementById("archiveTitle").textContent="ARCHIVE를 불러오지 못했습니다.";
    return;
  }

  const type=archive.type||"basic";
  document.getElementById("archiveTitle").textContent=archive.name;
  document.getElementById("archiveType").textContent=typeNames[type]||"";
  document.getElementById("meta").innerHTML=`
    <span>${esc(typeLabels[type]||"ARCHIVE")}</span>
    <span>${esc(new Date(archive.created_at).getFullYear())}</span>
  `;

  const {data:records,error:recordsError}=await supabase
    .from("archive_records")
    .select("id,date,title,content,image_url,extra_data,created_at")
    .eq("archive_id",archiveId)
    .order("date",{ascending:true})
    .order("created_at",{ascending:true});

  if(recordsError){
    console.error(recordsError);
    document.getElementById("records").innerHTML='<div class="empty">기록을 불러오지 못했습니다.</div>';
    return;
  }

  const list=records||[];

  // The most recently/earliest saved record with an image becomes the hero image.
  const heroRecord=[...list].reverse().find(record=>record.image_url);
  if(heroRecord){
    document.getElementById("hero").innerHTML=`
      <img class="hero-photo" src="${esc(heroRecord.image_url)}" alt="">
    `;
  }

  // Show archive-level details from the first record that contains extra_data.
  const detailRecord=list.find(record=>record.extra_data && Object.keys(record.extra_data).length);
  renderDetails(type,detailRecord?.extra_data||{});

  const recordsEl=document.getElementById("records");
  if(!list.length){
    recordsEl.innerHTML='<div class="empty">아직 기록이 없습니다.</div>';
    return;
  }

  // Do not duplicate the hero image inside the record list.
  recordsEl.innerHTML=list.map(record=>`
    <article class="record">
      <div class="record-date">${esc(formatDate(record.date))}</div>
      <div class="record-title">${esc(record.title||"기록")}</div>
      ${record.content?`<div class="record-content">${esc(record.content)}</div>`:""}
      ${record.image_url?`<img class="record-image" src="${esc(record.image_url)}" alt="">`:""}
    </article>
  `).join("");
}

loadArchive();
</script>
</body>
</html>
