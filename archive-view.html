<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meaningless — archive</title>
<style>
*{box-sizing:border-box}
:root{
  --background:#fff;
  --text:#29262a;
  --muted:#8a8588;
  --line:#e5eeee;
  --point:#62b9aa;
  --point-soft:#dff2ee;
  --theme-bg:#f7fbfa;
}
body{
  margin:0;
  background:var(--background);
  color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.7;
}
a{color:inherit;text-decoration:none}
.container{width:min(680px,calc(100% - 40px));margin:0 auto}

.theme-wrap{position:fixed;top:28px;right:28px;z-index:20}
.theme-button{
  border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:10px;letter-spacing:.08em;
  cursor:pointer;padding:6px 0
}
.theme-button:hover{color:var(--point)}
.theme-menu{
  display:none;width:145px;margin-top:6px;padding:8px;
  border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.97);
  box-shadow:0 8px 25px rgba(50,100,95,.08)
}
.theme-wrap.open .theme-menu{display:block}
.theme-option{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 7px;border:0;border-radius:7px;
  background:transparent;color:var(--text);
  font:inherit;font-size:11px;text-align:left;cursor:pointer
}
.theme-option:hover{background:var(--point-soft)}
.theme-dot{width:9px;height:9px;border-radius:50%;background:var(--theme-color)}

header{padding:45px 0 38px}
.back{display:inline-block;margin-bottom:50px;color:var(--muted);font-size:11px}
.back:hover{color:var(--point)}

.archive-label{
  color:var(--point);
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em
}
.archive-type{
  margin-top:7px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.08em
}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.archive-title{
  margin:10px 0 0;
  font-size:30px;
  font-weight:700;
  letter-spacing:-.05em
}
.edit-button{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:#fff;
  color:var(--muted);
  border-radius:8px;
  padding:7px 12px;
  font:inherit;
  font-size:9px;
  letter-spacing:.08em;
  cursor:pointer
}
.edit-button:hover{color:var(--point);border-color:var(--point)}
.edit-panel{
  margin:0 0 30px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--theme-bg)
}
.edit-field{margin-bottom:13px}
.edit-field label{
  display:block;margin-bottom:6px;
  color:var(--point);font-size:9px;font-weight:700;letter-spacing:.08em
}
.edit-field input,.edit-detail-input,.edit-detail-textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--text);font:inherit;font-size:12px;
  padding:9px 10px;outline:none
}
.edit-detail{margin-top:9px}
.edit-detail label{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}
.edit-detail-textarea{min-height:90px;resize:vertical}
.edit-record{
  padding:12px;
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff
}
.edit-record-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.edit-record-label{color:var(--point);font-size:9px;font-weight:700;letter-spacing:.08em}
.edit-record-delete{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.edit-record-input,.edit-record-textarea{
  width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;
  color:var(--text);font:inherit;font-size:11px;padding:8px 9px;outline:none;margin-top:7px
}
.edit-record-textarea{min-height:100px;resize:vertical;line-height:1.8}
.edit-record-blocks{display:grid;gap:8px;margin-top:7px}
.edit-block{
  position:relative;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--theme-bg)
}
.edit-block-remove{
  position:absolute;right:5px;top:4px;border:0;background:transparent;color:var(--muted);cursor:pointer
}
.edit-block textarea{width:100%;min-height:75px;border:0;background:transparent;outline:none;font:inherit;font-size:11px;resize:vertical}
.edit-existing-image{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:6px}
.edit-new-photo{
  display:flex;align-items:center;gap:7px;margin-top:7px;
  border:1px dashed var(--line);border-radius:7px;padding:7px;color:var(--muted);font-size:9px
}
.edit-add-blocks{display:flex;gap:6px;margin-top:7px}
.edit-add-block{
  border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;padding:6px 8px;font:inherit;font-size:9px;cursor:pointer
}
.edit-add-record{
  margin-top:9px;border:1px solid var(--line);background:#fff;color:var(--point);
  border-radius:7px;padding:7px 9px;font:inherit;font-size:9px;cursor:pointer
}
.edit-add-record:hover,.edit-add-block:hover{border-color:var(--point)}
.edit-actions{display:flex;justify-content:flex-end;gap:7px}
.edit-cancel,.edit-save{
  border-radius:7px;padding:7px 12px;font:inherit;font-size:9px;cursor:pointer
}
.edit-cancel{border:1px solid var(--line);background:#fff;color:var(--muted)}
.edit-save{border:1px solid var(--point);background:var(--point);color:#fff}


main{padding:0 0 70px}
.hero-photo{
  width:100%;
  max-height:430px;
  object-fit:cover;
  display:block;
  margin:2px 0 34px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--theme-bg)
}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  margin-bottom:28px;
  color:var(--muted);
  font-size:10px
}
.meta span + span::before{
  content:"·";
  margin-right:18px;
  color:var(--line)
}

.details{
  display:grid;
  gap:12px;
  margin-top:4px
}
.detail-row{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:18px;
  padding:12px 0;
  border-top:1px solid var(--line);
  font-size:12px
}
.detail-key{
  color:var(--muted);
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase
}
.detail-value{
  white-space:pre-wrap;
  word-break:break-word
}
.record-divider{
  margin:52px 0 22px;
  border-top:1px solid var(--line)
}
.records-label{
  color:var(--point);
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  margin-bottom:18px
}
.record{
  padding:16px 0 28px;
  border-bottom:1px solid var(--line)
}
.record-date{
  color:var(--muted);
  font-size:10px;
  margin-bottom:6px
}
.record-title{
  font-size:16px;
  font-weight:600;
  letter-spacing:-.02em
}
.record-content{
  margin-top:13px;
  white-space:pre-wrap;
  font-size:12px;
  line-height:1.9
}
.record-image{
  display:block;
  width:100%;
  max-height:420px;
  object-fit:cover;
  margin-top:16px;
  border-radius:12px;
  border:1px solid var(--line)
}
.empty{
  padding:24px 0;
  color:var(--muted);
  font-size:11px
}
footer{
  padding:0 0 50px;
  color:var(--muted);
  font-size:11px
}

@media(max-width:600px){
  .container{width:min(100% - 30px,680px)}
  .theme-wrap{top:18px;right:18px}
  header{padding-top:32px;padding-bottom:30px}
  .back{margin-bottom:42px}
  .archive-title{font-size:24px}
  .detail-row{grid-template-columns:88px 1fr;gap:12px}
  .hero-photo{max-height:320px}
}

.child-section{padding:4px 0 70px}
.child-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.child-heading .records-label{margin:0}
.add-button{
  display:flex;align-items:center;justify-content:center;
  width:28px;height:28px;border:1px solid var(--line);border-radius:8px;
  color:var(--point);background:#fff;font-size:17px;line-height:1;
}
.add-button:hover{border-color:var(--point);background:var(--point-soft)}
.child-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.child-card{
  overflow:hidden;display:flex;flex-direction:column;min-height:170px;
  border:1px solid var(--line);border-radius:14px;background:#fff;
  transition:.15s ease;
}
.child-card:hover{border-color:var(--point);transform:translateY(-1px)}
.child-card-image{
  width:100%;height:150px;object-fit:cover;display:block;
  border-bottom:1px solid var(--line);background:var(--theme-bg)
}
.child-card-body{padding:14px 15px 15px}
.child-card-type{color:var(--point);font-size:9px;font-weight:700;letter-spacing:.08em}
.child-card-title{margin-top:6px;font-size:15px;font-weight:600;letter-spacing:-.02em;word-break:break-word}
.child-card-date{margin-top:7px;color:var(--muted);font-size:9px}
.child-card.no-image{justify-content:flex-end}
.child-card.no-image .child-card-body{
  min-height:170px;display:flex;flex-direction:column;justify-content:flex-end
}
@media(max-width:600px){.child-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="theme-wrap" id="themeWrap">
  <button class="theme-button" id="themeButton" type="button">THEME</button>
  <div class="theme-menu">
    <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint</button>
    <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d8799a"></span> Pink</button>
    <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender</button>
    <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue</button>
  </div>
</div>

<div class="container">
  <header>
    <a href="index.html" class="back" id="backLink">← ARCHIVE</a>
    <div class="archive-label">♡ ARCHIVE</div>
    <div class="title-row">
      <h1 class="archive-title" id="archiveTitle">불러오는 중…</h1>
      <button class="edit-button" id="editButton" type="button" hidden>EDIT</button>
    </div>
  </header>

  

  <main>
    <section class="child-section">
      <div class="child-heading">
        <div class="records-label">RECORDS</div>
        <a class="add-button" id="addChildButton" href="#">＋</a>
      </div>
      <div class="child-grid" id="childGrid"></div>
    </section>
  </main>

  <footer>
    <a href="index.html">♡ back to meaningless</a>
  </footer>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const themes={
  mint:{point:"#62b9aa",pointSoft:"#dff2ee",line:"#e5eeee",themeBg:"#f7fbfa"},
  pink:{point:"#d8799a",pointSoft:"#f6dfe8",line:"#eee3e7",themeBg:"#fff8fa"},
  lavender:{point:"#9a8bc2",pointSoft:"#e9e4f4",line:"#e8e5ee",themeBg:"#faf8fd"},
  blue:{point:"#70a9c2",pointSoft:"#e0eef3",line:"#e3ebee",themeBg:"#f7fbfd"}
};

const typeLabel=t=>({
  basic:"BASIC",concert:"CONCERT",travel:"TRAVEL",movie:"MOVIE",custom:"ARCHIVE"
})[t]||"ARCHIVE";

const esc=v=>String(v??"")
  .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
  .replaceAll('"',"&quot;").replaceAll("'","&#039;");

function getTheme(){
  const p=new URLSearchParams(location.search);
  if(themes[p.get("theme")])return p.get("theme");
  const m=document.cookie.match(/(?:^|;\s*)meaningless-theme=([^;]+)/);
  const n=m?decodeURIComponent(m[1]):null;
  return themes[n]?n:"mint";
}

function applyTheme(n,save=true){
  const t=themes[n]||themes.mint;
  document.documentElement.style.setProperty("--point",t.point);
  document.documentElement.style.setProperty("--point-soft",t.pointSoft);
  document.documentElement.style.setProperty("--line",t.line);
  document.documentElement.style.setProperty("--theme-bg",t.themeBg);
  if(save)document.cookie="meaningless-theme="+encodeURIComponent(n)+"; path=/; max-age=31536000; SameSite=Lax";
}

let currentTheme=getTheme();
applyTheme(currentTheme,false);

const themeWrap=document.getElementById("themeWrap");
document.getElementById("themeButton").addEventListener("click",e=>{
  e.stopPropagation();
  themeWrap.classList.toggle("open");
});

document.querySelectorAll(".theme-option").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentTheme=btn.dataset.theme;
    applyTheme(currentTheme);
    themeWrap.classList.remove("open");
    updateLinks();
  });
});

document.addEventListener("click",e=>{
  if(!themeWrap.contains(e.target))themeWrap.classList.remove("open");
});

const params=new URLSearchParams(location.search);
const archiveId=params.get("id");
const archiveTitle=document.getElementById("archiveTitle");
const childGrid=document.getElementById("childGrid");
const addChildButton=document.getElementById("addChildButton");
const backLink=document.getElementById("backLink");

function updateLinks(){
  backLink.href="./index.html?theme="+encodeURIComponent(currentTheme);
  addChildButton.href="./archive-write_buttons_v2.html?parent="+encodeURIComponent(archiveId||"")
    +"&theme="+encodeURIComponent(currentTheme);
}

async function loadArchive(){
  if(!archiveId){
    archiveTitle.textContent="ARCHIVE를 찾을 수 없습니다.";
    childGrid.innerHTML='<div class="empty">ARCHIVE ID가 없습니다.</div>';
    return;
  }

  const {data:archive,error:archiveError}=await supabase
    .from("archives")
    .select("id,name,type,created_at,image_url")
    .eq("id",archiveId)
    .single();

  if(archiveError){
    console.error("ARCHIVE LOAD",archiveError);
    archiveTitle.textContent="ARCHIVE를 불러오지 못했습니다.";
    childGrid.innerHTML='<div class="empty">ARCHIVE를 불러오지 못했습니다.</div>';
    return;
  }

  archiveTitle.textContent=archive.name;

  const {data:children,error:childError}=await supabase
    .from("archives")
    .select("id,name,type,created_at,image_url")
    .eq("parent_id",archiveId)
    .order("created_at",{ascending:true});

  if(childError){
    console.error("CHILD ARCHIVE LOAD",childError);
    childGrid.innerHTML='<div class="empty">RECORD를 불러오지 못했습니다.</div>';
    return;
  }

  if(!children?.length){
    childGrid.innerHTML='<div class="empty">아직 기록이 없습니다.</div>';
    return;
  }

  childGrid.innerHTML=children.map(child=>{
    const image=child.image_url
      ? '<img class="child-card-image" src="'+esc(child.image_url)+'" alt="">'
      : "";
    const cls=child.image_url?"child-card":"child-card no-image";

    return '<a class="'+cls+'" href="./archive-view.html?id='
      +encodeURIComponent(child.id)+'&theme='+encodeURIComponent(currentTheme)+'">'
      +image
      +'<div class="child-card-body">'
      +'<div class="child-card-type">'+esc(typeLabel(child.type))+'</div>'
      +'<div class="child-card-title">'+esc(child.name)+'</div>'
      +'<div class="child-card-date">'+esc(new Date(child.created_at).getFullYear())+'</div>'
      +'</div></a>';
  }).join("");
}

updateLinks();
loadArchive().catch(error=>console.error("ARCHIVE VIEW ERROR",error));
</script>
</body>
</html>
