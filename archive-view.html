<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meaningless — archive</title>
<style>
*{box-sizing:border-box}
:root{
  --background:#fff;
  --text:#29262a;
  --muted:#8a8588;
  --line:#e0ecea;
  --point:#4fae9f;
  --point-soft:#d6efea;
  --theme-bg:#f7fbfa;
}
body{
  margin:0;
  background:var(--background);
  color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.7;
}
a{color:inherit;text-decoration:none}
.container{width:min(680px,calc(100% - 40px));margin:0 auto}

.theme-wrap{position:fixed;top:28px;right:28px;z-index:20}
.theme-button{
  border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:10px;letter-spacing:.08em;
  cursor:pointer;padding:6px 0
}
.theme-button:hover{color:var(--point)}
.theme-menu{
  display:none;width:145px;margin-top:6px;padding:8px;
  border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.97);
  box-shadow:0 8px 25px rgba(50,100,95,.08)
}
.theme-wrap.open .theme-menu{display:block}
.theme-option{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 7px;border:0;border-radius:7px;
  background:transparent;color:var(--text);
  font:inherit;font-size:11px;text-align:left;cursor:pointer
}
.theme-option:hover{background:var(--point-soft)}
.theme-dot{width:9px;height:9px;border-radius:50%;background:var(--theme-color)}

header{padding:28px 0 18px}
.back{display:inline-block;margin-bottom:30px;color:var(--muted);font-size:11px}
.back:hover{color:var(--point)}

.archive-label{
  color:var(--point);
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em
}
.archive-type{
  margin-top:7px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.08em
}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.archive-title{
  margin:7px 0 0;
  font-size:30px;
  font-weight:700;
  letter-spacing:-.05em;
  color:var(--point)
}
.edit-button{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:#fff;
  color:var(--muted);
  border-radius:8px;
  padding:7px 12px;
  font:inherit;
  font-size:9px;
  letter-spacing:.08em;
  cursor:pointer
}
.edit-button:hover{color:var(--point);border-color:var(--point)}
.edit-panel{
  margin:0 0 30px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--theme-bg)
}
.edit-field{margin-bottom:18px}
.edit-field:last-of-type{margin-bottom:0}
.edit-record-date-label{display:block;margin-top:0;margin-bottom:5px;color:var(--point);font-size:9px;font-weight:700;letter-spacing:.08em}
.edit-field label{
  display:block;margin-bottom:6px;
  color:var(--point);font-size:9px;font-weight:700;letter-spacing:.08em
}
.edit-field input,.edit-detail-input,.edit-detail-textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--text);font:inherit;font-size:12px;
  padding:9px 10px;outline:none
}
.edit-text-color-options{display:flex;gap:7px;margin-top:8px}
.edit-text-color-option{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;padding:7px 12px;font:inherit;font-size:9px;letter-spacing:.05em;cursor:pointer}
.edit-text-color-option.active{border-color:var(--point);color:var(--point);background:var(--point-soft)}
.edit-record-editor-wrap{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;margin-top:7px}
.edit-record-editor{min-height:180px;padding:12px;outline:none;font:inherit;font-size:11px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.edit-record-editor:empty:before{content:attr(data-placeholder);color:var(--muted)}
.edit-record-editor:focus{box-shadow:0 0 0 3px var(--point-soft)}
.edit-record-editor img{display:block;max-width:100%;width:auto;height:auto;margin:14px 0;border-radius:7px}
.edit-record-toolbar{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:var(--theme-bg)}
.edit-record-photo{border:1px solid var(--line);background:#fff;color:var(--point);border-radius:7px;padding:6px 9px;font:inherit;font-size:9px;font-weight:600;cursor:pointer}
.edit-record-photo-input{display:none}
.edit-detail{margin-top:9px}
.edit-detail label{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}
.edit-detail-textarea{min-height:90px;resize:vertical}
.edit-record{
  padding:14px;
  margin-top:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff
}
.edit-record-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.edit-record-label{color:var(--point);font-size:9px;font-weight:700;letter-spacing:.08em}
.edit-record-delete{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.edit-record-input,.edit-record-textarea{
  width:100%;
  min-width:0;
  box-sizing:border-box;
  border:1px solid var(--line);border-radius:8px;background:#fff;
  color:var(--text);font:inherit;font-size:11px;padding:9px 10px;outline:none;margin-top:0
}
.edit-record-input:focus,.edit-detail-input:focus,.edit-detail-textarea:focus{border-color:var(--point);box-shadow:0 0 0 3px var(--point-soft)}
.edit-record-textarea{min-height:100px;resize:vertical;line-height:1.8}
.edit-record-blocks{display:grid;gap:8px;margin-top:7px}
.edit-block{
  position:relative;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--theme-bg)
}
.edit-block-remove{
  position:absolute;right:5px;top:4px;border:0;background:transparent;color:var(--muted);cursor:pointer
}
.edit-block textarea{width:100%;min-height:75px;border:0;background:transparent;outline:none;font:inherit;font-size:11px;resize:vertical}
.edit-existing-image{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:6px}
.edit-new-photo{
  display:flex;align-items:center;gap:7px;margin-top:7px;
  border:1px dashed var(--line);border-radius:7px;padding:7px;color:var(--muted);font-size:9px
}
.edit-add-blocks{display:flex;gap:6px;margin-top:7px}
.edit-add-block{
  border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;padding:6px 8px;font:inherit;font-size:9px;cursor:pointer
}
.edit-add-record{
  margin-top:9px;border:1px solid var(--line);background:#fff;color:var(--point);
  border-radius:7px;padding:7px 9px;font:inherit;font-size:9px;cursor:pointer
}
.edit-add-record:hover,.edit-add-block:hover{border-color:var(--point)}
.edit-actions{display:flex;justify-content:flex-end;gap:7px}
.edit-cancel,.edit-save{
  border-radius:7px;padding:7px 12px;font:inherit;font-size:9px;cursor:pointer
}
.edit-cancel{border:1px solid var(--line);background:#fff;color:var(--muted)}
.edit-save{border:1px solid var(--point);background:var(--point);color:#fff}



.category-view-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.category-add{
  flex:0 0 auto;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;
  background:#fff;color:var(--point);font:inherit;font-size:22px;line-height:1;cursor:pointer
}
.category-add:hover{border-color:var(--point);background:var(--theme-bg)}
.archive-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.archive-card{
  position:relative;display:flex;flex-direction:column;min-height:200px;padding:18px;
  border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;
  transition:border-color .15s ease,transform .15s ease
}
.archive-card:hover{border-color:var(--point);transform:translateY(-1px)}
.archive-card-image{width:100%;height:100%;position:absolute;inset:0;object-fit:cover;z-index:0}
.archive-card.has-image::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(to bottom,rgba(255,255,255,.08),rgba(255,255,255,.84));pointer-events:none}
.archive-card.text-white .archive-card-top,.archive-card.text-white .archive-card-title,.archive-card.text-white .archive-card-subtitle,.archive-card.text-white .archive-card-bottom{color:#fff}
.archive-card.text-white .archive-card-subtitle,.archive-card.text-white .archive-card-bottom{opacity:.9}
.archive-card.text-white.has-image::after{background:linear-gradient(to bottom,rgba(0,0,0,.06),rgba(0,0,0,.5))}
.archive-card-content{position:relative;z-index:1;display:flex;flex-direction:column;min-height:164px;height:100%}
.archive-card-top{display:flex;justify-content:space-between;color:var(--point);font-size:9px;font-weight:700;letter-spacing:.08em}
.archive-card-title{margin-top:auto;padding-top:22px;font-size:18px;font-weight:600;letter-spacing:-.04em;word-break:break-word;color:var(--point)}
.archive-card-subtitle{margin-top:5px;color:var(--muted);font-size:10px;line-height:1.6;min-height:1.6em;white-space:pre-wrap;word-break:break-word}
.archive-card-bottom{display:flex;justify-content:space-between;gap:8px;margin-top:18px;color:var(--muted);font-size:9px;letter-spacing:.05em}
.category-description{
  margin:8px 0 0;
  padding:0;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
  white-space:pre-wrap;
}
.category-divider{
  margin:28px 0 22px;
  border-top:1px solid var(--line);
}
.empty{padding:24px 0;color:var(--muted);font-size:11px}
@media(max-width:600px){.archive-grid{grid-template-columns:1fr}.archive-card{min-height:175px}.archive-card-content{min-height:139px}}

main{padding:0 0 70px}
.hero-photo{
  width:100%;
  max-height:430px;
  object-fit:cover;
  display:block;
  margin:2px 0 34px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--theme-bg)
}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;
  margin-bottom:28px;
  color:var(--muted);
  font-size:10px
}
.meta span + span::before{
  content:"·";
  margin-right:18px;
  color:var(--line)
}

.details{
  display:grid;
  gap:12px;
  margin-top:4px
}
.detail-row{
  display:grid;
  grid-template-columns:120px 1fr;
  gap:18px;
  padding:12px 0;
  border-top:1px solid var(--line);
  font-size:12px
}
.detail-key{
  color:var(--muted);
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase
}
.detail-value{
  white-space:pre-wrap;
  word-break:break-word
}
.record-divider{
  margin:28px 0 22px;
  border-top:1px solid var(--line)
}
.records-label{
  margin-top:0;
  color:var(--point);
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  margin-bottom:18px
}
.record{
  padding:16px 0 30px;
  border-bottom:1px solid var(--line)
}
.record-date{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
  color:var(--muted);
  font-size:10px
}
.record-date-label{
  font-size:9px;
  font-weight:700;
  letter-spacing:.08em;
  color:var(--point)
}
.record-date-value{
  white-space:nowrap
}
.record-title{
  font-size:16px;
  font-weight:600;
  letter-spacing:-.02em
}
.record-content{
  margin-top:13px;
  white-space:pre-wrap;
  font-size:12px;
  line-height:1.9
}
.record-image{
  display:block;
  width:100%;
  max-height:520px;
  object-fit:contain;
  margin:18px 0 0;
  border-radius:12px;
  border:1px solid var(--line)
}
.empty{
  padding:24px 0;
  color:var(--muted);
  font-size:11px
}
footer{
  padding:0 0 50px;
  color:var(--muted);
  font-size:11px
}

@media(max-width:600px){
  .container{width:min(100% - 30px,680px)}
  .theme-wrap{top:18px;right:18px}
  header{padding-top:24px;padding-bottom:24px}
  .back{margin-bottom:26px}
  .archive-title{font-size:24px}
  .detail-row{grid-template-columns:88px 1fr;gap:12px}
  .hero-photo{max-height:360px}
}
</style>
</head>
<body>

<div class="theme-wrap" id="themeWrap">
  <button class="theme-button" id="themeButton" type="button">THEME</button>
  <div class="theme-menu">
    <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#4fae9f"></span> Mint</button>
    <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d3638b"></span> Pink</button>
    <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#8d78bb"></span> Lavender</button>
    <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#5f9fbc"></span> Blue</button>
  </div>
</div>

<div class="container">
  <header>
    <a href="index.html" class="back" id="backLink">← ARCHIVE</a>
    <div class="archive-label">♡ ARCHIVE</div>
    <div class="title-row">
      <h1 class="archive-title" id="archiveTitle">불러오는 중…</h1>
      <div style="display:flex;align-items:center;gap:8px">
        <button class="category-add" id="categoryAddButton" type="button" hidden aria-label="ARCHIVE 추가">＋</button>
        <button class="edit-button" id="editButton" type="button" hidden>EDIT</button>
      </div>
    </div>
  </header>

  <section class="edit-panel" id="editPanel" hidden aria-label="ARCHIVE EDIT">
    <div class="edit-field">
      <label>ARCHIVE NAME</label>
      <input id="editArchiveName" type="text">
    </div>

    <div class="edit-field">
      <label>TYPE DETAILS</label>
      <div id="editDetails"></div>
    </div>

    <div class="edit-field">
      <label>TEXT COLOR</label>
      <div class="edit-text-color-options" role="group" aria-label="사진 위 텍스트 색상">
        <button class="edit-text-color-option active" type="button" data-edit-text-color="black">BLACK</button>
        <button class="edit-text-color-option" type="button" data-edit-text-color="white">WHITE</button>
      </div>
    </div>

    <div class="edit-field">
      <label>RECORDS</label>
      <div id="editRecords"></div>
      <button class="edit-add-record" id="editAddRecord" type="button">＋ 기록 추가</button>
    </div>

    <div class="edit-actions">
      <button class="edit-cancel" id="editCancel" type="button">CANCEL</button>
      <button class="edit-save" id="editSave" type="button">SAVE</button>
    </div>
  </section>

  <main>
    <div id="hero"></div>
    <div class="details" id="details"></div>

    <div class="record-divider"></div>
    <div class="category-divider" id="categoryDivider" hidden></div>
    <div class="records-label">RECORDS</div>
    <div id="records"></div>
  </main>

  <footer>
    <a href="index.html">♡ back to meaningless</a>
  </footer>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const themes={
  mint:{point:"#4fae9f",pointSoft:"#d6efea",line:"#e0ecea",themeBg:"#f7fbfa"},
  pink:{point:"#d3638b",pointSoft:"#f3d6e1",line:"#eadde2",themeBg:"#fff8fa"},
  lavender:{point:"#8d78bb",pointSoft:"#e5dff2",line:"#e4e1ea",themeBg:"#faf8fd"},
  blue:{point:"#5f9fbc",pointSoft:"#dbeaf0",line:"#dfe8eb",themeBg:"#f7fbfd"}
};
const typeNames={concert:"공연 / 콘서트",travel:"여행",movie:"영화",custom:"직접 설정"};

function esc(v){
  return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function getTheme(){
  const p=new URLSearchParams(location.search);
  if(themes[p.get("theme")])return p.get("theme");
  const m=document.cookie.match(/(?:^|;\s*)meaningless-theme=([^;]+)/);
  const n=m?decodeURIComponent(m[1]):null;
  return themes[n]?n:"mint";
}
function saveTheme(n){document.cookie="meaningless-theme="+encodeURIComponent(n)+"; path=/; max-age=31536000; SameSite=Lax"}
function applyTheme(n,save=true){
  const t=themes[n]||themes.mint;
  document.documentElement.style.setProperty("--point",t.point);
  document.documentElement.style.setProperty("--point-soft",t.pointSoft);
  document.documentElement.style.setProperty("--line",t.line);
  document.documentElement.style.setProperty("--theme-bg",t.themeBg);
  if(save)saveTheme(n);
}

let currentTheme=getTheme();
applyTheme(currentTheme,false);

const themeWrap=document.getElementById("themeWrap");
document.getElementById("themeButton").addEventListener("click",e=>{
  e.stopPropagation();themeWrap.classList.toggle("open");
});
function themedArchiveUrl(theme){
  const url=new URL(location.href);
  url.searchParams.set("theme",theme);
  return url.pathname.split("/").pop()+"?"+url.searchParams.toString();
}
document.querySelectorAll(".theme-option").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentTheme=btn.dataset.theme;
    applyTheme(currentTheme);
    const url=new URL(location.href);
    url.searchParams.set("theme",currentTheme);
    history.replaceState(null,"",url.pathname+"?"+url.searchParams.toString());
    themeWrap.classList.remove("open");
  });
});
document.addEventListener("click",e=>{if(!themeWrap.contains(e.target))themeWrap.classList.remove("open")});

const params=new URLSearchParams(location.search);
const archiveId=params.get("id");
const categoryId=params.get("category");
const fromCategoryId=params.get("fromCategory");
document.getElementById("backLink").href = (archiveId && fromCategoryId)
  ? "./archive-view.html?category="+encodeURIComponent(fromCategoryId)+"&theme="+encodeURIComponent(currentTheme)
  : "./index.html?theme="+encodeURIComponent(currentTheme);

let loadedArchive=null;
let loadedRecords=[];

const semanticLabels={
  concert:["공연장","회차","셋리스트","앵콜"],
  travel:["지역","기간","동행"],
  movie:["감독","별점","감상 메모"],
  custom:[]
};

function formatDate(date){
  if(!date)return "";
  const d=new Date(`${date}T00:00:00`);
  if(Number.isNaN(d.getTime()))return String(date);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
}

function detailEntries(type,record){
  if(type==="basic"||!record?.extra_data)return [];
  return Object.entries(record.extra_data).filter(([key,value])=>
    key!=="content_blocks" && String(value??"").trim()!==""
  );
}

function renderDetails(type,record){
  const box=document.getElementById("details");
  const entries=detailEntries(type,record);
  box.innerHTML=entries.map(([key,value],i)=>{
    const label=semanticLabels[type]?.[i] || key.replaceAll("_"," ").toUpperCase();
    return `<div class="detail-row"><div class="detail-key">${esc(label)}</div><div class="detail-value">${esc(value)}</div></div>`;
  }).join("");
}

function renderRecordBody(record, skipImageUrl=""){
  const blocks=Array.isArray(record.extra_data?.content_blocks)?record.extra_data.content_blocks:null;
  if(blocks && blocks.length){
    return blocks.map(block=>{
      if(block.type==="image"&&block.url){
        if(skipImageUrl && block.url===skipImageUrl)return "";
        return `<img class="record-image" src="${esc(block.url)}" alt="">`;
      }
      if(block.type==="text"&&block.value)return `<div class="record-content">${esc(block.value)}</div>`;
      return "";
    }).join("");
  }
  return record.content?`<div class="record-content">${esc(record.content)}</div>`:"";
}

function renderRecords(type, skipImageUrl=""){
  const box=document.getElementById("records");
  if(!loadedRecords.length){
    box.innerHTML='<div class="empty">아직 기록이 없습니다.</div>';return;
  }
  box.innerHTML=loadedRecords.map(record=>`
    <article class="record">
      <div class="record-date"><span class="record-date-label">DATE</span><span class="record-date-value">${esc(formatDate(record.date))}</span></div>
      ${renderRecordBody(record, skipImageUrl)}
    </article>
  `).join("");
}

function makeEditFields(type,record){
  const box=document.getElementById("editDetails");
  if(type==="basic"){box.innerHTML="";return;}
  const vals=record?.extra_data||{};
  const labels=semanticLabels[type]||[];
  const keys=["field_1","field_2","field_3","field_4"];
  box.innerHTML=labels.map((label,i)=>{
    const key=keys[i];
    const multi=label==="셋리스트"||label==="여행 메모"||label==="감상 메모";
    return `<div class="edit-detail"><label>${esc(label)}</label>
      ${multi
        ? `<textarea class="edit-detail-textarea" data-key="${key}">${esc(vals[key]||"")}</textarea>`
        : `<input class="edit-detail-input" data-key="${key}" value="${esc(vals[key]||"")}" type="text">`}
    </div>`;
  }).join("");
}

function collectDetails(type){
  const out={};
  if(type==="basic")return out;
  document.querySelectorAll("#editDetails [data-key]").forEach(el=>{
    const value=el.value.trim();if(value)out[el.dataset.key]=value;
  });
  return out;
}

const editRecordsEl=document.getElementById("editRecords");
const editNewFiles=new Map();
const editRanges=new Map();
let editTextColor="black";

document.querySelectorAll(".edit-text-color-option").forEach(btn=>btn.addEventListener("click",()=>{
  editTextColor=btn.dataset.editTextColor||"black";
  document.querySelectorAll(".edit-text-color-option").forEach(b=>b.classList.toggle("active",b===btn));
}));

function rememberEditSelection(editor){
  const sel=window.getSelection();
  if(!sel||!sel.rangeCount)return;
  const range=sel.getRangeAt(0);
  if(editor.contains(range.commonAncestorContainer))editRanges.set(editor,range.cloneRange());
}

function insertEditImage(editor,file){
  const url=URL.createObjectURL(file);
  editNewFiles.set(url,file);
  editor.focus();
  const sel=window.getSelection();
  let range=editRanges.get(editor);
  if(!range){range=document.createRange();range.selectNodeContents(editor);range.collapse(false);}
  range.deleteContents();
  const img=document.createElement("img");
  img.src=url;img.alt=file.name||"첨부 사진";img.dataset.localImage="true";img.dataset.fileName=file.name||"";
  range.insertNode(img);
  const spacer=document.createTextNode("\n");img.after(spacer);
  range.setStartAfter(spacer);range.collapse(true);
  sel.removeAllRanges();sel.addRange(range);editRanges.set(editor,range.cloneRange());
}

function blockDataToEditorHtml(record){
  const blocks=Array.isArray(record?.extra_data?.content_blocks)?record.extra_data.content_blocks:null;
  if(blocks&&blocks.length){
    return blocks.map(b=>{
      if(b.type==="image"&&b.url)return `<img src="${esc(b.url)}" alt="">`;
      if(b.type==="text"&&b.value)return `<div>${esc(b.value).replaceAll("\n","<br>")}</div>`;
      return "";
    }).join("");
  }
  return record?.content ? `<div>${esc(record.content).replaceAll("\n","<br>")}</div>` : "";
}

function addEditRecord(record={}){
  const el=document.createElement("div");
  el.className="edit-record";el.dataset.recordId=record.id||"";
  el.innerHTML=`
    <div class="edit-record-head">
      <div class="edit-record-label">RECORD</div>
      <button class="edit-record-delete" type="button">×</button>
    </div>
    <label class="edit-record-date-label">DATE</label>
    <input class="edit-record-input edit-record-date" type="date" value="${esc(record.date||new Date().toISOString().slice(0,10))}">
    <div class="edit-record-editor-wrap">
      <div class="edit-record-editor" contenteditable="true" data-placeholder="기록해두기.">${blockDataToEditorHtml(record)}</div>
      <div class="edit-record-toolbar">
        <button class="edit-record-photo" type="button">＋ PHOTO</button>
        <input class="edit-record-photo-input" type="file" accept="image/*">
      </div>
    </div>`;

  const editor=el.querySelector(".edit-record-editor");
  const photoBtn=el.querySelector(".edit-record-photo");
  const photoInput=el.querySelector(".edit-record-photo-input");
  editor.addEventListener("keyup",()=>rememberEditSelection(editor));
  editor.addEventListener("mouseup",()=>rememberEditSelection(editor));
  editor.addEventListener("input",()=>rememberEditSelection(editor));
  editor.addEventListener("focus",()=>rememberEditSelection(editor));
  photoBtn.addEventListener("mousedown",e=>e.preventDefault());
  photoBtn.addEventListener("click",()=>{rememberEditSelection(editor);photoInput.click()});
  photoInput.addEventListener("change",()=>{const f=photoInput.files?.[0];if(f)insertEditImage(editor,f);photoInput.value=""});
  el.querySelector(".edit-record-delete").onclick=()=>{el.dataset.removed="true";el.style.display="none"};
  editRecordsEl.appendChild(el);
}

function htmlToBlocks(editor){
  const result=[];let textBuffer="";
  const flush=()=>{const v=textBuffer.replace(/\u00a0/g," ").replace(/^[\n\r]+|[\n\r]+$/g,"");if(v.trim())result.push({type:"text",value:v});textBuffer=""};
  const walk=node=>{
    if(node.nodeType===Node.TEXT_NODE){textBuffer+=node.nodeValue||"";return;}
    if(node.nodeType!==Node.ELEMENT_NODE)return;
    if(node.tagName==="IMG"){
      flush();const src=node.getAttribute("src")||"";if(src)result.push({type:"image",url:src});textBuffer+="\n";return;
    }
    if(node.tagName==="BR"){textBuffer+="\n";return;}
    [...node.childNodes].forEach(walk);
    if(["DIV","P","LI"].includes(node.tagName))textBuffer+="\n";
  };
  [...editor.childNodes].forEach(walk);flush();return result;
}

async function uploadEditImage(file,userId){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/gi,"")||"jpg";
  const path=`${userId}/archive/${crypto.randomUUID()}.${ext}`;
  const {error}=await supabase.storage.from("archive-images").upload(path,file,{
    cacheControl:"3600",upsert:false,contentType:file.type
  });
  if(error)throw error;
  return supabase.storage.from("archive-images").getPublicUrl(path).data.publicUrl;
}

document.getElementById("editAddRecord").addEventListener("click",()=>addEditRecord());

async function getUser(){
  const {data:{user},error}=await supabase.auth.getUser();
  if(error)throw error;
  return user;
}

function openEdit(){
  if(!loadedArchive)return;
  document.getElementById("editArchiveName").value=loadedArchive.name||"";
  const type=loadedArchive.type||"basic";
  makeEditFields(type,loadedRecords[0]);
  editTextColor=loadedArchive.text_color||"black";
  document.querySelectorAll(".edit-text-color-option").forEach(b=>b.classList.toggle("active",b.dataset.editTextColor===editTextColor));
  editRecordsEl.innerHTML="";
  loadedRecords.forEach(record=>addEditRecord(record));
  document.querySelector(".archive-label").textContent="♡ EDIT ARCHIVE";
  document.getElementById("editPanel").hidden=false;
  document.getElementById("editButton").hidden=true;
  document.querySelector("main").hidden=true;
  document.querySelector("footer").hidden=true;
  window.scrollTo({top:0,behavior:"smooth"});
}

document.getElementById("editCancel").addEventListener("click",()=>{
  document.getElementById("editPanel").hidden=true;
  document.querySelector("main").hidden=false;
  document.querySelector("footer").hidden=false;
  document.getElementById("editButton").hidden=false;
  if(loadedArchive){
    document.querySelector(".archive-label").textContent="♡ ARCHIVE";
  }
});
document.getElementById("editButton").addEventListener("click",openEdit);

supabase.auth.onAuthStateChange((_event,session)=>{
  document.getElementById("editButton").hidden=!session;
});

document.getElementById("editSave").addEventListener("click",async()=>{
  const user=await getUser();
  if(!user){alert("로그인이 필요합니다.");return;}

  const name=document.getElementById("editArchiveName").value.trim();
  if(!name){alert("아카이브 이름을 입력해주세요.");return;}

  const type=loadedArchive.type||"basic";
  const save=document.getElementById("editSave");
  save.disabled=true;save.textContent="SAVING…";

  try{
    const {error:archiveError}=await supabase.from("archives")
      .update({name,text_color:editTextColor}).eq("id",loadedArchive.id).eq("user_id",user.id);
    if(archiveError)throw archiveError;

    const details=collectDetails(type);
    const detailSource=loadedRecords[0];

    const editors=[...editRecordsEl.querySelectorAll(".edit-record")];

    for(const editor of editors){
      const recordId=editor.dataset.recordId||"";
      const removed=editor.dataset.removed==="true";
      if(removed){
        if(recordId){
          const {error}=await supabase.from("archive_records").delete().eq("id",recordId).eq("user_id",user.id);
          if(error)throw error;
        }
        continue;
      }

      const contentBlocks=htmlToBlocks(editor.querySelector(".edit-record-editor"));
      const resolved=[];
      for(const block of contentBlocks){
        if(block.type==="image"&&block.url.startsWith("blob:")){
          const file=editNewFiles.get(block.url);
          if(file)resolved.push({type:"image",url:await uploadEditImage(file,user.id)});
        }else resolved.push(block);
      }
      const content=resolved.filter(b=>b.type==="text").map(b=>b.value).join("\n");
      const imageUrl=resolved.find(b=>b.type==="image")?.url||null;
      const date=editor.querySelector(".edit-record-date")?.value||new Date().toISOString().slice(0,10);
      const title=loadedRecords.find(r=>r.id===recordId)?.title||loadedArchive.name||"후기";

      if(recordId){
        const existing=loadedRecords.find(r=>r.id===recordId);
        const extra={...(existing?.extra_data||{}),...details,content_blocks:resolved};
        const {error}=await supabase.from("archive_records").update({date,title,content,image_url:imageUrl,extra_data:extra}).eq("id",recordId).eq("user_id",user.id);
        if(error)throw error;
      }else{
        const {error}=await supabase.from("archive_records").insert({archive_id:loadedArchive.id,user_id:user.id,date,title,content,image_url:imageUrl,extra_data:{content_blocks:resolved}});
        if(error)throw error;
      }
    }

    alert("수정되었습니다.");
    location.reload();
  }catch(error){
    console.error("ARCHIVE EDIT",error);
    alert("수정에 실패했습니다.\n"+(error?.message||"알 수 없는 오류"));
  }finally{
    save.disabled=false;save.textContent="SAVE";
  }
});

function renderCategoryArchives(category, archives){
  const hero=document.getElementById("hero");
  const details=document.getElementById("details");
  const records=document.getElementById("records");
  const editButton=document.getElementById("editButton");
  const addButton=document.getElementById("categoryAddButton");

  document.getElementById("archiveTitle").textContent=category.name||"ARCHIVE";
  document.querySelector(".archive-label").textContent="♡ "+(category.name||"ARCHIVE").toUpperCase();
  hero.innerHTML="";
  details.innerHTML=category.description?`<div class="category-description">${esc(category.description)}</div>`:"";
  document.querySelector(".record-divider").style.display="none";
  document.getElementById("categoryDivider").hidden=false;
  document.querySelector(".records-label").style.marginTop="0";
  editButton.hidden=true;
  addButton.hidden=false;
  addButton.onclick=()=>{
    location.href="./archive-write_buttons_v2.html?category="+encodeURIComponent(category.id)+"&theme="+encodeURIComponent(currentTheme);
  };

  if(!archives.length){
    records.innerHTML='<div class="empty">아직 ARCHIVE가 없습니다.</div>';
    return;
  }

  records.innerHTML=`<div class="archive-grid">${archives.map(archive=>{
    const image=archive.image_url||archive._image_url||"";
    const textClass=archive.text_color==="white"?" text-white":"";
    return `<a class="archive-card${image?" has-image":""}${textClass}" href="./archive-view.html?id=${encodeURIComponent(archive.id)}&fromCategory=${encodeURIComponent(category.id)}&theme=${encodeURIComponent(currentTheme)}">
      ${image?`<img class="archive-card-image" src="${esc(image)}" alt="">`:""}
      <div class="archive-card-content">
        <div class="archive-card-top"><span>${esc((archive.type||"ARCHIVE").toUpperCase())}</span><span>↗</span></div>
        <div class="archive-card-title">${esc(archive.name)}</div>
        <div class="archive-card-subtitle">${esc(archive._dateLabel||"")}</div>
        <div class="archive-card-bottom"><span>${archive._recordCount||0} ${archive._recordCount===1?"RECORD":"RECORDS"}</span><span>VIEW →</span></div>
      </div>
    </a>`;
  }).join("")}</div>`;
}

async function loadCategory(){
  if(!categoryId)return false;

  const {data:category,error:categoryError}=await supabase.from("archive_categories")
    .select("id,name,description")
    .eq("id",categoryId).maybeSingle();

  if(categoryError||!category){
    console.error(categoryError);
    document.getElementById("archiveTitle").textContent="ARCHIVE를 찾을 수 없습니다.";
    document.getElementById("records").innerHTML='<div class="empty">CATEGORY를 불러오지 못했습니다.<br><small>'+esc(categoryError?.message||"알 수 없는 오류")+'</small></div>';
    return true;
  }

  // category_id가 실제로 연결된 ARCHIVE만 가져옵니다.
  // 기존 상세 보기 코드는 그대로 두고, CATEGORY 화면에서만 이 분기를 사용합니다.
  const {data:archives,error:archivesError}=await supabase.from("archives")
    .select("id,name,type,image_url,category_id,text_color,created_at")
    .eq("category_id",categoryId)
    .order("created_at",{ascending:false});

  if(archivesError){
    console.error(archivesError);
    document.getElementById("archiveTitle").textContent=category.name||"ARCHIVE";
    document.getElementById("records").innerHTML='<div class="empty">ARCHIVE를 불러오지 못했습니다.<br><small>'+esc(archivesError?.message||"알 수 없는 오류")+'</small></div>';
    return true;
  }

  const list=archives||[];
  if(list.length){
    const ids=list.map(a=>a.id);
    const {data:records,error:recordsError}=await supabase.from("archive_records")
      .select("id,archive_id,date,image_url,extra_data,created_at")
      .in("archive_id",ids)
      .order("created_at",{ascending:true});
    if(!recordsError){
      const byArchive={};
      (records||[]).forEach(r=>{
        if(!byArchive[r.archive_id])byArchive[r.archive_id]=[];
        byArchive[r.archive_id].push(r);
      });
      list.forEach(a=>{
        const rs=byArchive[a.id]||[];
        a._recordCount=rs.length;
        a._image_url=a.image_url||rs.find(r=>r.image_url)?.image_url||rs.flatMap(r=>Array.isArray(r.extra_data?.content_blocks)?r.extra_data.content_blocks:[]).find(b=>b?.type==="image"&&b.url)?.url||"";
        a._dateLabel=rs.length?formatDate(rs[rs.length-1].date):"";
      });
    }else{
      console.warn("CATEGORY RECORDS:",recordsError);
      list.forEach(a=>{a._recordCount=0;a._dateLabel="";});
    }
  }

  renderCategoryArchives(category,list);
  return true;
}

async function loadArchive(){
  if(categoryId){
    await loadCategory();
    return;
  }
  if(!archiveId){
    document.getElementById("archiveTitle").textContent="ARCHIVE를 찾을 수 없습니다.";return;
  }
  const {data:archive,error:archiveError}=await supabase.from("archives")
    .select("id,name,type,image_url,created_at,user_id").eq("id",archiveId).single();
  if(archiveError){
    console.error(archiveError);
    document.getElementById("archiveTitle").textContent="ARCHIVE를 불러오지 못했습니다.";return;
  }

  loadedArchive=archive;
  document.querySelector(".record-divider").style.display="block";
  document.getElementById("categoryDivider").hidden=true;
  document.querySelector(".records-label").style.marginTop="0";
  const type=archive.type||"basic";
  document.getElementById("archiveTitle").textContent=archive.name;

  const {data:records,error:recordsError}=await supabase.from("archive_records")
    .select("id,date,title,content,image_url,extra_data,created_at")
    .eq("archive_id",archiveId).order("date",{ascending:true}).order("created_at",{ascending:true});

  if(recordsError){
    console.error(recordsError);
    document.getElementById("records").innerHTML='<div class="empty">기록을 불러오지 못했습니다.</div>';return;
  }
  loadedRecords=records||[];

  // 대표사진은 ARCHIVE 자체의 image_url을 우선 사용합니다.
  // 기존 데이터처럼 대표사진이 없으면 RECORD의 첫 사진을 대표사진으로 사용합니다.
  let heroUrl=archive.image_url||null;
  if(!heroUrl){
    for(const record of loadedRecords){
      const img=Array.isArray(record.extra_data?.content_blocks)
        ? record.extra_data.content_blocks.find(b=>b.type==="image"&&b.url)
        : null;
      if(img){heroUrl=img.url;break;}
      if(record.image_url){heroUrl=record.image_url;break;}
    }
  }
  if(heroUrl)document.getElementById("hero").innerHTML=`<img class="hero-photo" src="${esc(heroUrl)}" alt="">`;

  const infoRecord=loadedRecords.find(r=>detailEntries(type,r).length);
  renderDetails(type,infoRecord);
  // 대표사진이 RECORD 본문에도 들어있는 경우에는 한 번 더 보여주지 않습니다.
  renderRecords(type,heroUrl||"");

  try{
    const user=await getUser();
    // VIEW 페이지에서는 로그인한 사용자에게 EDIT를 보여주고,
    // 실제 저장 시 Supabase RLS가 본인 소유 데이터인지 검사합니다.
    document.getElementById("editButton").hidden=!user;
  }catch(error){
    console.warn("AUTH CHECK:",error);
    document.getElementById("editButton").hidden=true;
  }
}

loadArchive();
</script>
