<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meaningless — diary</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --background: #fff;
      --text: #29262a;
      --muted: #8a8588;
      --line: #e5eeee;
      --point: #62b9aa;
      --point-soft: #dff2ee;
      --theme-bg: #f7fbfa;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(680px, calc(100% - 40px));
      margin: 0 auto;
    }

    .theme-wrap {
      position: fixed;
      top: 28px;
      right: 28px;
      z-index: 10;
    }

    .theme-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 10px;
      letter-spacing: .08em;
      cursor: pointer;
      padding: 6px 0;
    }

    .theme-button:hover { color: var(--point); }

    .theme-menu {
      display: none;
      width: 145px;
      margin-top: 6px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 8px 25px rgba(50,100,95,.08);
    }

    .theme-wrap.open .theme-menu { display: block; }

    .theme-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 11px;
      text-align: left;
      cursor: pointer;
    }

    .theme-option:hover { background: var(--point-soft); }

    .theme-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--theme-color);
    }

    header {
      padding: 45px 0 35px;
    }

    .back {
      display: inline-block;
      margin-bottom: 52px;
      color: var(--muted);
      font-size: 11px;
    }

    .back:hover { color: var(--point); }

    .label {
      color: var(--point);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .date {
      margin-top: 9px;
      color: var(--point);
      font-size: 10px;
    }

    .content {
      padding: 20px 0 70px;
    }

    .content h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -.045em;
    }

    .title-grid {
      width: 100%;
      height: 1px;
      margin: 25px 0 34px;
      background: var(--line);
    }

    .content p {
      margin: 0;
      font-size: 14px;
      line-height: 2;
      letter-spacing: -.025em;
      white-space: pre-line;
    }

    .diary-image {
      display: block;
      width: 100%;
      max-height: 680px;
      margin: 36px 0 0;
      object-fit: contain;
      background: var(--theme-bg);
    }

    .post-actions {
      display: none;
      gap: 8px;
      margin-top: 26px;
    }

    .is-authenticated .post-actions { display: flex; }

    .action-button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
      border-radius: 7px;
      font: inherit;
      font-size: 9px;
      letter-spacing: .08em;
      cursor: pointer;
    }

    .action-button:hover {
      color: var(--point);
      border-color: var(--point);
    }

    .action-button.delete:hover { color: #c96f7e; border-color: #c96f7e; }

    .status { color: var(--muted); font-size: 12px; }

    .post-divider {
      margin-top: 78px;
      border-top: 1px solid var(--line);
    }

    .post-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 20px 2px 0;
    }

    .post-nav a {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
    }

    .post-nav a:hover { color: var(--point); }

    .post-nav .next {
      text-align: right;
    }

    footer {
      padding: 0 0 50px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .container { width: min(100% - 30px, 680px); }

      .theme-wrap {
        top: 18px;
        right: 18px;
      }

      header {
        padding-top: 32px;
        padding-bottom: 28px;
      }

      .back { margin-bottom: 42px; }

      .content {
        padding-top: 16px;
        padding-bottom: 55px;
      }

      .content h1 {
        font-size: 19px;
      }

      .title-grid {
        margin: 21px 0 29px;
      }

      .content p {
        font-size: 13px;
        line-height: 1.9;
      }

      .post-divider {
        margin-top: 60px;
      }
    }
  </style>
</head>

<body>
  <div class="theme-wrap" id="themeWrap">
    <button class="theme-button" id="themeButton" type="button">THEME</button>
    <div class="theme-menu">
      <button class="theme-option" type="button" data-theme="mint">
        <span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint
      </button>
      <button class="theme-option" type="button" data-theme="pink">
        <span class="theme-dot" style="--theme-color:#d8799a"></span> Pink
      </button>
      <button class="theme-option" type="button" data-theme="lavender">
        <span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender
      </button>
      <button class="theme-option" type="button" data-theme="blue">
        <span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue
      </button>
    </div>
  </div>

  <div class="container">
    <header>
      <a id="backDiary" href="index.html" class="back">← DIARY</a>
      <div class="label">♡ DIARY</div>
    </header>

    <main class="content">
      <div id="loading" class="status">LOADING...</div>
      <div id="post" style="display:none">
        <h1 id="postTitle"></h1>
        <div class="date" id="postDate"></div>
        <div class="title-grid" aria-hidden="true"></div>
        <p id="postContent"></p>
        <img id="postImage" class="diary-image" alt="" style="display:none">
        <div class="post-actions" id="postActions">
          <button class="action-button" id="editButton" type="button">EDIT</button>
          <button class="action-button delete" id="deleteButton" type="button">DELETE</button>
        </div>
        <div class="post-divider"></div>
        <nav class="post-nav">
          <a id="prevPost" href="#" style="visibility:hidden"></a>
          <a id="nextPost" class="next" href="#" style="visibility:hidden"></a>
        </nav>
      </div>
    </main>

    <footer>
      <a id="backHome" href="index.html">♡ back to meaningless</a>
    </footer>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const themes = {
      mint: { point:"#62b9aa", pointSoft:"#dff2ee", line:"#e5eeee", themeBg:"#f7fbfa" },
      pink: { point:"#d8799a", pointSoft:"#f6dfe8", line:"#eee3e7", themeBg:"#fff8fa" },
      lavender: { point:"#9a8bc2", pointSoft:"#e9e4f4", line:"#e8e5ee", themeBg:"#faf8fd" },
      blue: { point:"#70a9c2", pointSoft:"#e0eef3", line:"#e3ebee", themeBg:"#f7fbfd" }
    };
    const $ = id => document.getElementById(id);
    const esc = v => String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    const formatDate = d => {
      if (!d) return "";
      const x = new Date(`${d}T00:00:00`);
      return Number.isNaN(x.getTime()) ? String(d) : `${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,"0")}.${String(x.getDate()).padStart(2,"0")}`;
    };

    function applyTheme(name) {
      const t = themes[name] || themes.mint;
      document.documentElement.style.setProperty("--point",t.point);
      document.documentElement.style.setProperty("--point-soft",t.pointSoft);
      document.documentElement.style.setProperty("--line",t.line);
      document.documentElement.style.setProperty("--theme-bg",t.themeBg);
      localStorage.setItem("meaningless-theme", name);
    }
    applyTheme(localStorage.getItem("meaningless-theme") || "mint");
    const themeWrap = $("themeWrap");
    $("themeButton").addEventListener("click", e => { e.stopPropagation(); themeWrap.classList.toggle("open"); });
    document.querySelectorAll(".theme-option").forEach(button => button.addEventListener("click", () => {
      const selectedTheme = button.dataset.theme;
      applyTheme(selectedTheme);
      const url = new URL(window.location.href);
      url.searchParams.set("theme", selectedTheme);
      history.replaceState(null, "", url.pathname + "?" + url.searchParams.toString());
      themeWrap.classList.remove("open");
    }));
    document.addEventListener("click", e => { if (!themeWrap.contains(e.target)) themeWrap.classList.remove("open"); });

    const params = new URLSearchParams(window.location.search);
    const diaryId = params.get("id");
    const theme = params.get("theme");

    function getCurrentTheme() {
      return theme && themes[theme]
        ? theme
        : (localStorage.getItem("meaningless-theme") || "mint");
    }

    function addTheme(url) {
      const separator = url.includes("?") ? "&" : "?";
      return `${url}${separator}theme=${encodeURIComponent(getCurrentTheme())}`;
    }

    if (theme && themes[theme]) applyTheme(theme);

    function updateBackLinks() {
      const href = addTheme("./index.html");
      $("backDiary").href = href;
      $("backHome").href = href;
    }

    updateBackLinks();

    // DIARY로 돌아갈 때는 기존 목록 페이지로 돌아가 로그인 상태를 유지합니다.
    $("backDiary").addEventListener("click", e => {
      if (document.referrer.includes("/index.html")) {
        e.preventDefault();
        history.back();
      }
    });

    async function loadPost() {
      if (!diaryId) throw new Error("DIARY ID가 없습니다.");

      const { data: post, error } = await supabase.from("diary")
        .select("id,date,title,content,image_url,created_at")
        .eq("id", diaryId).single();
      if (error) throw error;

      $("postTitle").textContent = post.title || "";
      $("postDate").textContent = formatDate(post.date);
      $("postContent").textContent = post.content || "";

      if (post.image_url) {
        const img = $("postImage");
        img.src = post.image_url;
        img.alt = post.title || "DIARY PHOTO";
        img.style.display = "block";
      }

      $("editButton").onclick = () => {
        location.href = addTheme(`./diary-write.html?edit=${encodeURIComponent(post.id)}`);
      };
      $("deleteButton").onclick = async () => {
        if (!confirm("이 DIARY를 삭제할까요?")) return;
        const { data: { user }, error: authError } = await supabase.auth.getUser();
        if (authError) { alert(authError.message); return; }
        if (!user) { alert("로그인이 필요합니다."); return; }
        const button = $("deleteButton");
        button.disabled = true;
        const { error: deleteError } = await supabase.from("diary").delete().eq("id", post.id);
        if (deleteError) {
          console.error("DIARY DELETE", deleteError);
          alert("삭제에 실패했습니다.\n" + deleteError.message);
          button.disabled = false;
          return;
        }
        location.href = addTheme("./index.html");
      };

      const { data: allPosts, error: listError } = await supabase.from("diary")
        .select("id,date,title,created_at")
        .order("date", { ascending:false }).order("created_at", { ascending:false });
      if (listError) throw listError;
      const index = (allPosts || []).findIndex(x => String(x.id) === String(post.id));
      const prev = index >= 0 ? allPosts[index + 1] : null;
      const next = index > 0 ? allPosts[index - 1] : null;

      if (prev) {
        const a = $("prevPost");
        a.href = addTheme(`./diary-detail.html?id=${encodeURIComponent(prev.id)}`);
        a.innerHTML = `← ${esc(formatDate(prev.date))}<br>${esc(prev.title || "")}`;
        a.style.visibility = "visible";
      }
      if (next) {
        const a = $("nextPost");
        a.href = addTheme(`./diary-detail.html?id=${encodeURIComponent(next.id)}`);
        a.innerHTML = `${esc(formatDate(next.date))} →<br>${esc(next.title || "")}`;
        a.style.visibility = "visible";
      }

      const { data: { session } } = await supabase.auth.getSession();
      document.documentElement.classList.toggle("is-authenticated", !!session);
      $("loading").style.display = "none";
      $("post").style.display = "block";
    }

    try { await loadPost(); }
    catch (error) {
      console.error("DIARY DETAIL", error);
      $("loading").textContent = "DIARY를 불러오지 못했습니다.";
    }

    supabase.auth.onAuthStateChange((_event, session) => {
      document.documentElement.classList.toggle("is-authenticated", !!session);
    });
  </script>
</body>
</html>
