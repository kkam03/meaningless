<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meaningless — diary</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --background: #fff;
      --text: #29262a;
      --muted: #8a8588;
      --line: #e5eeee;
      --point: #62b9aa;
      --point-soft: #dff2ee;
      --theme-bg: #f7fbfa;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(680px, calc(100% - 40px));
      margin: 0 auto;
    }

    .theme-wrap {
      position: fixed;
      top: 28px;
      right: 28px;
      z-index: 10;
    }

    .theme-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 10px;
      letter-spacing: .08em;
      cursor: pointer;
      padding: 6px 0;
    }

    .theme-button:hover { color: var(--point); }

    .theme-menu {
      display: none;
      width: 145px;
      margin-top: 6px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 8px 25px rgba(50,100,95,.08);
    }

    .theme-wrap.open .theme-menu { display: block; }

    .theme-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 11px;
      text-align: left;
      cursor: pointer;
    }

    .theme-option:hover { background: var(--point-soft); }

    .theme-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--theme-color);
    }

    header {
      padding: 45px 0 35px;
    }

    .back {
      display: inline-block;
      margin-bottom: 52px;
      color: var(--muted);
      font-size: 11px;
    }

    .back:hover { color: var(--point); }

    .label {
      color: var(--point);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .date {
      margin-top: 9px;
      color: var(--point);
      font-size: 10px;
    }

    .content {
      padding: 20px 0 70px;
    }

    .content h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -.045em;
    }

    .title-grid {
      width: 100%;
      height: 1px;
      margin: 25px 0 34px;
      background: var(--line);
    }

    .content p {
      margin: 0;
      font-size: 14px;
      line-height: 2;
      letter-spacing: -.025em;
      white-space: pre-line;
    }

    .post-divider {
      margin-top: 78px;
      border-top: 1px solid var(--line);
    }

    .post-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 20px 2px 0;
    }

    .post-nav a {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
    }

    .post-nav a:hover { color: var(--point); }

    .post-nav .next {
      text-align: right;
    }

    footer {
      padding: 0 0 50px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .container { width: min(100% - 30px, 680px); }

      .theme-wrap {
        top: 18px;
        right: 18px;
      }

      header {
        padding-top: 32px;
        padding-bottom: 28px;
      }

      .back { margin-bottom: 42px; }

      .content {
        padding-top: 16px;
        padding-bottom: 55px;
      }

      .content h1 {
        font-size: 19px;
      }

      .title-grid {
        margin: 21px 0 29px;
      }

      .content p {
        font-size: 13px;
        line-height: 1.9;
      }

      .post-divider {
        margin-top: 60px;
      }
    }
  </style>
</head>

<body>
  <div class="theme-wrap" id="themeWrap">
    <button class="theme-button" id="themeButton" type="button">THEME</button>
    <div class="theme-menu">
      <button class="theme-option" type="button" data-theme="mint">
        <span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint
      </button>
      <button class="theme-option" type="button" data-theme="pink">
        <span class="theme-dot" style="--theme-color:#d8799a"></span> Pink
      </button>
      <button class="theme-option" type="button" data-theme="lavender">
        <span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender
      </button>
      <button class="theme-option" type="button" data-theme="blue">
        <span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue
      </button>
    </div>
  </div>

  <div class="container">
    <header>
      <a href="index.html" class="back">← DIARY</a>
      <div class="label">♡ DIARY</div>
    </header>

    <main class="content">
      <h1>또 뭔가를 만들었다.</h1>
      <div class="date">2026.08.31</div>

      <div class="title-grid" aria-hidden="true"></div>

      <p>오늘도 뭔가를 만들었다.
별거 아닌 것 같은데
이런 게 은근 재미있다.</p>

      <div class="post-divider"></div>

      <nav class="post-nav">
        <a href="#">
          ← 08.28<br>
          오늘은 아무것도 안 했다.
        </a>
        <a href="#" class="next">
          09.01 →<br>
          다음 기록
        </a>
      </nav>
    </main>

    <footer>
      <a href="index.html">♡ back to meaningless</a>
    </footer>
  </div>

  <script>
    const themes = {
      mint: { point:"#62b9aa", pointSoft:"#dff2ee", line:"#e5eeee", themeBg:"#f7fbfa" },
      pink: { point:"#d8799a", pointSoft:"#f6dfe8", line:"#eee3e7", themeBg:"#fff8fa" },
      lavender: { point:"#9a8bc2", pointSoft:"#e9e4f4", line:"#e8e5ee", themeBg:"#faf8fd" },
      blue: { point:"#70a9c2", pointSoft:"#e0eef3", line:"#e3ebee", themeBg:"#f7fbfd" }
    };

    function applyTheme(name) {
      const theme = themes[name] || themes.mint;
      document.documentElement.style.setProperty("--point", theme.point);
      document.documentElement.style.setProperty("--point-soft", theme.pointSoft);
      document.documentElement.style.setProperty("--line", theme.line);
      document.documentElement.style.setProperty("--theme-bg", theme.themeBg);
      localStorage.setItem("meaningless-theme", name);
    }

    applyTheme(localStorage.getItem("meaningless-theme") || "mint");

    const themeWrap = document.getElementById("themeWrap");

    document.getElementById("themeButton").addEventListener("click", () => {
      themeWrap.classList.toggle("open");
    });

    document.querySelectorAll(".theme-option").forEach(button => {
      button.addEventListener("click", () => {
        applyTheme(button.dataset.theme);
        themeWrap.classList.remove("open");
      });
    });

    document.addEventListener("click", event => {
      if (!themeWrap.contains(event.target)) themeWrap.classList.remove("open");
    });
  </script>
</body>
</html>
