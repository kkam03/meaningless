<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meaningless — category</title>
<style>
*{box-sizing:border-box}
:root{
  --background:#fff;
  --text:#29262a;
  --muted:#8a8588;
  --line:#e5eeee;
  --point:#62b9aa;
  --point-soft:#dff2ee;
  --theme-bg:#f7fbfa
}
body{
  margin:0;background:var(--background);color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.7
}
a{color:inherit;text-decoration:none}
.container{width:min(760px,calc(100% - 40px));margin:0 auto}
.theme-wrap{position:fixed;top:28px;right:28px;z-index:20}
.theme-button{
  border:0;background:transparent;color:var(--muted);font:inherit;
  font-size:10px;letter-spacing:.08em;cursor:pointer;padding:6px 0
}
.theme-button:hover{color:var(--point)}
.theme-menu{
  display:none;width:145px;margin-top:6px;padding:8px;border:1px solid var(--line);
  border-radius:12px;background:rgba(255,255,255,.97);
  box-shadow:0 8px 25px rgba(50,100,95,.08)
}
.theme-wrap.open .theme-menu{display:block}
.theme-option{
  display:flex;align-items:center;gap:8px;width:100%;padding:8px 7px;
  border:0;border-radius:7px;background:transparent;color:var(--text);
  font:inherit;font-size:11px;text-align:left;cursor:pointer
}
.theme-option:hover{background:var(--point-soft)}
.theme-dot{width:9px;height:9px;border-radius:50%;background:var(--theme-color)}

header{padding:46px 0 34px}
.back{display:inline-block;margin-bottom:52px;color:var(--muted);font-size:11px}
.back:hover{color:var(--point)}
.category-label{color:var(--point);font-size:10px;font-weight:700;letter-spacing:.1em}
.category-title{
  margin:10px 0 0;font-size:34px;font-weight:700;letter-spacing:-.05em
}
.category-description{
  margin-top:7px;color:var(--muted);font-size:11px
}

main{padding-bottom:65px}
.archive-heading{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:15px;margin-bottom:13px
}
.archive-heading-label{color:var(--point);font-size:10px;font-weight:700;letter-spacing:.08em}
.archive-heading-note{color:var(--muted);font-size:10px}
.archive-list{display:grid;gap:10px}

.archive-row{
  position:relative;display:grid;grid-template-columns:76px minmax(0,1fr) 24px;
  gap:14px;align-items:center;padding:16px 14px;
  border:1px solid var(--line);border-radius:11px;background:#fff;
  transition:transform .18s ease,border-color .18s ease
}
.archive-row:hover{transform:translateY(-2px);border-color:var(--point)}
archive-delete{
  width:20px;height:20px;padding:0;
  border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:13px;line-height:1;
  display:none;align-items:center;justify-content:center;
  cursor:pointer;opacity:.7
}
.is-authenticated .archive-delete{display:flex}
.archive-delete:hover{color:var(--point);opacity:1}

.archive-year{color:var(--muted);font-size:10px}
.archive-row-main{min-width:0}
.archive-row-type{color:var(--point);font-size:9px;letter-spacing:.08em}
.archive-row-title{
  margin-top:2px;font-size:14px;font-weight:600;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.archive-row-count{margin-top:2px;color:var(--muted);font-size:9px}
.archive-row-arrow{color:var(--muted);font-size:12px;text-align:right}

.empty{padding:28px 0;color:var(--muted);font-size:11px}
footer{padding:0 0 50px;color:var(--muted);font-size:11px}

@media(max-width:600px){
  .container{width:min(100% - 30px,760px)}
  .theme-wrap{top:18px;right:18px}
  .category-title{font-size:28px}
  .archive-row{grid-template-columns:58px minmax(0,1fr) 20px;gap:10px}
}
</style>
</head>
<body>

<div class="theme-wrap" id="themeWrap">
  <button class="theme-button" id="themeButton" type="button">THEME</button>
  <div class="theme-menu">
    <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint</button>
    <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d8799a"></span> Pink</button>
    <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender</button>
    <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue</button>
  </div>
</div>

<div class="container">
  <header>
    <a class="back" id="backLink" href="index.html">← ARCHIVE</a>
    <div class="category-label">♡ CATEGORY</div>
    <h1 class="category-title" id="categoryTitle">불러오는 중…</h1>
    <div class="category-description" id="categoryDescription"></div>
  </header>

  <main>
    <div class="archive-heading">
      <div class="archive-heading-label">ARCHIVES</div>
      <div class="archive-heading-note">이 카테고리에 모아둔 기록</div>
    </div>
    <div class="archive-list" id="archiveList"></div>
  </main>

  <footer>
    <a id="footerBack" href="index.html">♡ back to meaningless</a>
  </footer>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const themes={
  mint:{point:"#62b9aa",pointSoft:"#dff2ee",line:"#e5eeee",themeBg:"#f7fbfa"},
  pink:{point:"#d8799a",pointSoft:"#f6dfe8",line:"#eee3e7",themeBg:"#fff8fa"},
  lavender:{point:"#9a8bc2",pointSoft:"#e9e4f4",line:"#e8e5ee",themeBg:"#faf8fd"},
  blue:{point:"#70a9c2",pointSoft:"#e0eef3",line:"#e3ebee",themeBg:"#f7fbfd"}
};

const esc=v=>String(v??"")
  .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
  .replaceAll('"',"&quot;").replaceAll("'","&#039;");

const typeLabel=t=>({
  basic:"BASIC",
  concert:"CONCERT",
  travel:"TRAVEL",
  movie:"MOVIE",
  custom:"ARCHIVE"
})[t]||"ARCHIVE";

function getTheme(){
  const p=new URLSearchParams(location.search);
  if(themes[p.get("theme")])return p.get("theme");
  const m=document.cookie.match(/(?:^|;\s*)meaningless-theme=([^;]+)/);
  const n=m?decodeURIComponent(m[1]):null;
  return themes[n]?n:"mint";
}
function applyTheme(n,remember=true){
  const t=themes[n]||themes.mint;
  document.documentElement.style.setProperty("--point",t.point);
  document.documentElement.style.setProperty("--point-soft",t.pointSoft);
  document.documentElement.style.setProperty("--line",t.line);
  document.documentElement.style.setProperty("--theme-bg",t.themeBg);
  if(remember)document.cookie=`meaningless-theme=${encodeURIComponent(n)}; path=/; max-age=31536000; SameSite=Lax`;
}

let currentTheme=getTheme();
applyTheme(currentTheme,false);

const themeWrap=document.getElementById("themeWrap");
document.getElementById("themeButton").addEventListener("click",e=>{
  e.stopPropagation();
  themeWrap.classList.toggle("open");
});
document.querySelectorAll(".theme-option").forEach(button=>{
  button.addEventListener("click",()=>{
    currentTheme=button.dataset.theme;
    applyTheme(currentTheme);
    updateBackLinks();
    themeWrap.classList.remove("open");
  });
});
document.addEventListener("click",e=>{
  if(!themeWrap.contains(e.target))themeWrap.classList.remove("open");
});

const params=new URLSearchParams(location.search);
const categoryId=params.get("id");
let currentSession=null;

function updateBackLinks(){
  const url="./index.html?theme="+encodeURIComponent(currentTheme);
  document.getElementById("backLink").href=url;
  document.getElementById("footerBack").href=url;
}
updateBackLinks();

async function syncAuth(){
  const {data:{session}}=await supabase.auth.getSession();
  currentSession=session||null;
  document.documentElement.classList.toggle("is-authenticated",!!currentSession);
}
async function updateViewAuth(){
  const {data:{session}}=await supabase.auth.getSession();
  currentSession=session||null;
  document.documentElement.classList.toggle("is-authenticated",!!currentSession);
}
async function loadCategory(){
  if(!categoryId){
    document.getElementById("categoryTitle").textContent="카테고리를 찾을 수 없습니다.";
    return;
  }

  const {data:category,error:categoryError}=await supabase
    .from("archive_categories")
    .select("id,name,description,created_at")
    .eq("id",categoryId)
    .single();

  if(categoryError){
    console.error("CATEGORY LOAD",categoryError);
    document.getElementById("categoryTitle").textContent="카테고리를 불러오지 못했습니다.";
    return;
  }

  document.getElementById("categoryTitle").textContent=category.name;
  document.getElementById("categoryDescription").textContent=category.description||"";

  const {data:archives,error:archiveError}=await supabase
    .from("archives")
    .select("id,name,type,created_at")
    .eq("category_id",categoryId)
    .order("created_at",{ascending:true});

  if(archiveError){
    console.error("CATEGORY ARCHIVES LOAD",archiveError);
    document.getElementById("archiveList").innerHTML='<div class="empty">ARCHIVE를 불러오지 못했습니다.</div>';
    return;
  }

  if(!archives?.length){
    document.getElementById("archiveList").innerHTML='<div class="empty">아직 이 카테고리에 기록이 없습니다.</div>';
    return;
  }

  const rows=archives.map(async archive=>{
    const {count}=await supabase
      .from("archive_records")
      .select("id",{count:"exact",head:true})
      .eq("archive_id",archive.id);

    return {...archive,recordCount:count||0};
  });

  const enriched=await Promise.all(rows);

  document.getElementById("archiveList").innerHTML=enriched.map(archive=>`
    <div class="archive-row" data-archive-id="${archive.id}">
      <a class="archive-row-main" href="./archive-view.html?id=${encodeURIComponent(archive.id)}&theme=${encodeURIComponent(currentTheme)}">
        <div class="archive-year">${esc(new Date(archive.created_at).getFullYear())}</div>
        <div class="archive-row-main">
          <div class="archive-row-type">${esc(typeLabel(archive.type))}</div>
          <div class="archive-row-title">${esc(archive.name)}</div>
          <div class="archive-row-count">${archive.recordCount} ${archive.recordCount===1?"RECORD":"RECORDS"}</div>
        </div>
      </a>
      <div class="archive-row-arrow">↗</div>
      <button class="archive-delete" type="button" data-id="${archive.id}" aria-label="${esc(archive.name)} 삭제">×</button>
    </div>
  `).join("");
}

document.addEventListener("click",async e=>{
  const button=e.target.closest(".archive-delete");
  if(!button)return;

  e.preventDefault();
  e.stopPropagation();

  if(!currentSession){alert("로그인이 필요합니다.");return}
  if(!confirm("이 ARCHIVE를 삭제할까요?"))return;

  const archiveId=button.dataset.id || button.closest(".archive-row")?.dataset.archiveId;
  if(!archiveId || archiveId==="undefined"){
    alert("ARCHIVE ID를 읽지 못했습니다. 페이지를 새로고침해주세요.");
    return;
  }

  button.disabled=true;
  try{
    const {error}=await supabase.rpc("delete_archive",{p_archive_id:archiveId});
    if(error)throw error;
    await loadCategory();
  }catch(error){
    console.error("ARCHIVE DELETE",error);
    alert("삭제에 실패했습니다.\n"+(error?.message||"알 수 없는 오류"));
  }finally{
    button.disabled=false;
  }
});

await syncAuth();
supabase.auth.onAuthStateChange((_event,next)=>{
  currentSession=next||null;
  document.documentElement.classList.toggle("is-authenticated",!!currentSession);
});
loadCategory();
</script>
</body>
</html>
