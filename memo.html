<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meaningless — memo</title>
  <style>
    *{box-sizing:border-box}
    :root{--background:#fff;--text:#29262a;--muted:#8a8588;--line:#e0ecea;--point:#4fae9f;--point-soft:#d6efea;--theme-bg:#f7fbfa}
    body{margin:0;background:var(--background);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
    a{color:inherit;text-decoration:none}
    button,input,textarea{font:inherit}
    .container{width:min(760px,calc(100% - 40px));margin:0 auto}
    .top-nav{position:fixed;top:28px;right:28px;z-index:10}
    .theme-button{border:0;background:transparent;color:var(--muted);font-size:10px;letter-spacing:.08em;cursor:pointer;padding:6px 0}
    .theme-menu{display:none;width:145px;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.97)}
    .theme-wrap.open .theme-menu{display:block}
    .theme-option{display:flex;align-items:center;gap:8px;width:100%;padding:8px 7px;border:0;border-radius:7px;background:transparent;color:var(--text);font-size:11px;text-align:left;cursor:pointer}
    .theme-option:hover{background:var(--point-soft)}
    .theme-dot{width:8px;height:8px;border-radius:50%;background:var(--theme-color)}
    header{padding:105px 0 45px}
    .back{display:inline-block;margin-bottom:38px;color:var(--muted);font-size:11px;letter-spacing:.04em}
    .back:hover{color:var(--point)}
    .label{font-size:11px;letter-spacing:.16em;color:var(--point);margin-bottom:8px}
    .note{font-size:12px;color:var(--muted)}
    main{padding-bottom:70px}
    .memo-editor{border-top:1px solid var(--line);padding-top:22px}
    .memo-title{width:100%;border:0;border-bottom:1px solid var(--line);outline:0;padding:8px 2px 11px;color:var(--text);font-size:18px;font-weight:500;background:transparent}
    .memo-title::placeholder,.memo-content::placeholder{color:#b5afb2}
    .memo-content{display:block;width:100%;min-height:190px;margin-top:14px;padding:12px 2px;border:0;outline:0;resize:vertical;background:transparent;color:var(--text);font-size:12px;line-height:1.8}
    .memo-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:8px}
    .memo-actions button{border:0;background:transparent;color:var(--muted);font-size:10px;letter-spacing:.05em;cursor:pointer;padding:8px 0}
    .memo-actions .save{color:var(--point)}
    .memo-list{margin-top:54px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .memo-item{position:relative;min-height:170px;padding:20px 20px 22px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#fff 0%,var(--theme-bg) 100%);transition:transform .18s ease,border-color .18s ease}
    .memo-item:hover{transform:translateY(-2px);border-color:var(--point)}
    .memo-item-title{padding-right:46px;font-size:15px;font-weight:500;letter-spacing:-.025em}
    .memo-item-date{margin-top:5px;color:var(--muted);font-size:9px;letter-spacing:.04em}
    .memo-item-content{margin-top:18px;color:var(--muted);font-size:11px;line-height:1.8;white-space:pre-wrap}
    .memo-item-actions{position:absolute;right:13px;top:12px;display:flex;gap:4px}
    .memo-item-actions button{border:0;background:transparent;color:var(--muted);font-size:9px;letter-spacing:.04em;cursor:pointer;padding:5px}
    .memo-item-actions button:hover{color:var(--point)}
    .empty{padding:28px 2px;color:var(--muted);font-size:11px}
    footer{padding:0 0 55px}
    footer a{color:var(--muted);font-size:10px;letter-spacing:.05em}
    footer a:hover{color:var(--point)}
    @media(max-width:600px){
      .container{width:calc(100% - 32px)}
      .top-nav{top:18px;right:18px}
      header{padding-top:90px}
      .memo-title{font-size:16px}
      .memo-content{min-height:220px;font-size:12px}
      .memo-list{grid-template-columns:1fr;gap:12px;margin-top:46px}
      .memo-item{min-height:150px;padding:18px}
    }
  </style>
</head>
<body>
  <div class="theme-wrap top-nav" id="themeWrap">
    <button class="theme-button" id="themeButton" type="button">THEME</button>
    <div class="theme-menu">
      <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#4fae9f"></span> Mint</button>
      <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d3638b"></span> Pink</button>
      <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#8d78bb"></span> Lavender</button>
      <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#5f9fbc"></span> Blue</button>
    </div>
  </div>

  <div class="container">
    <header>
      <a id="backHome" href="./index.html" class="back">← HOME</a>
      <div class="label">♡ MEMO</div>
      <div class="note">생각나는 것들을 잠깐 적어둡니다.</div>
    </header>

    <main>
      <form class="memo-editor" id="memoForm">
        <input class="memo-title" id="memoTitle" maxlength="120" placeholder="제목" aria-label="메모 제목">
        <textarea class="memo-content" id="memoContent" placeholder="여기에 적어두세요." aria-label="메모 내용"></textarea>
        <div class="memo-actions">
          <button type="button" id="cancelEdit">CLEAR</button>
          <button class="save" type="submit">SAVE</button>
        </div>
      </form>
      <div class="memo-list" id="memoList"></div>
    </main>

    <footer><a id="backHome2" href="./index.html">♡ back to meaningless</a></footer>
  </div>

  <script>
    const themes={
      mint:{point:"#4fae9f",pointSoft:"#d6efea",line:"#e0ecea",themeBg:"#f7fbfa"},
      pink:{point:"#d3638b",pointSoft:"#f3d6e1",line:"#e4d8de",themeBg:"#fff8fa"},
      lavender:{point:"#8d78bb",pointSoft:"#e5dff2",line:"#e4e1ea",themeBg:"#faf8fd"},
      blue:{point:"#5f9fbc",pointSoft:"#dbeaf0",line:"#dfe8eb",themeBg:"#f7fbfd"}
    };
    const $=id=>document.getElementById(id);
    const params=new URLSearchParams(location.search);
    let currentTheme=params.get("theme") in themes?params.get("theme"):"mint";
    const key="meaningless-memos";
    let memos=JSON.parse(localStorage.getItem(key)||"[]");
    let editingId=null;

    function applyTheme(name){
      const t=themes[name];
      document.documentElement.style.setProperty("--point",t.point);
      document.documentElement.style.setProperty("--point-soft",t.pointSoft);
      document.documentElement.style.setProperty("--line",t.line);
      document.documentElement.style.setProperty("--theme-bg",t.themeBg);
      document.cookie=`meaningless-theme=${encodeURIComponent(name)}; path=/; max-age=31536000; SameSite=Lax`;
      const suffix=`?theme=${encodeURIComponent(name)}`;
      $("backHome").href="./index.html"+suffix;
      $("backHome2").href="./index.html"+suffix;
      history.replaceState(null,"",location.pathname+suffix);
    }
    applyTheme(currentTheme);
    $("themeButton").addEventListener("click",e=>{e.stopPropagation();$("themeWrap").classList.toggle("open")});
    document.addEventListener("click",e=>{if(!$("themeWrap").contains(e.target))$("themeWrap").classList.remove("open")});
    document.querySelectorAll(".theme-option").forEach(b=>b.addEventListener("click",()=>{currentTheme=b.dataset.theme;applyTheme(currentTheme);$("themeWrap").classList.remove("open")}));

    function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function render(){
      if(!memos.length){$("memoList").innerHTML='<div class="empty">아직 적어둔 메모가 없습니다.</div>';return}
      $("memoList").innerHTML=memos.map(m=>`
        <article class="memo-item">
          <div class="memo-item-actions">
            <button type="button" data-edit="${m.id}">EDIT</button>
            <button type="button" data-delete="${m.id}">DELETE</button>
          </div>
          <div class="memo-item-title">${esc(m.title||"UNTITLED")}</div>
          <div class="memo-item-date">${esc(m.date)}</div>
          <div class="memo-item-content">${esc(m.content)}</div>
        </article>`).join("");
    }
    function clearForm(){editingId=null;$("memoTitle").value="";$("memoContent").value="";$("memoTitle").focus()}
    $("memoForm").addEventListener("submit",e=>{
      e.preventDefault();
      const title=$("memoTitle").value.trim();
      const content=$("memoContent").value.trim();
      if(!title&&!content){$("memoTitle").focus();return}
      if(editingId){
        memos=memos.map(m=>m.id===editingId?{...m,title:title||"UNTITLED",content}:m);
      }else{
        memos.unshift({id:crypto.randomUUID(),title:title||"UNTITLED",content,date:new Date().toLocaleDateString("ko-KR")});
      }
      localStorage.setItem(key,JSON.stringify(memos));
      clearForm();render();
    });
    $("cancelEdit").addEventListener("click",clearForm);
    $("memoList").addEventListener("click",e=>{
      const edit=e.target.closest("[data-edit]"), del=e.target.closest("[data-delete]");
      if(edit){
        const m=memos.find(x=>x.id===edit.dataset.edit);if(!m)return;
        editingId=m.id;$("memoTitle").value=m.title;$("memoContent").value=m.content;$("memoTitle").focus();scrollTo({top:0,behavior:"smooth"});
      }
      if(del){
        const id=del.dataset.delete;if(confirm("이 메모를 삭제할까요?")){memos=memos.filter(m=>m.id!==id);localStorage.setItem(key,JSON.stringify(memos));render()}
      }
    });
    render();
  </script>
</body>
</html>
