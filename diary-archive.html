<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meaningless — year archive</title>
  <style>
    *{box-sizing:border-box} :root{--background:#fff;--text:#29262a;--muted:#8a8588;--line:#e5eeee;--point:#62b9aa;--point-soft:#dff2ee;--theme-bg:#f7fbfa}
    body{margin:0;background:var(--background);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
    a{color:inherit;text-decoration:none}.container{width:min(760px,calc(100% - 40px));margin:0 auto}
    .theme-wrap{position:fixed;top:28px;right:28px;z-index:10}.theme-button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:10px;letter-spacing:.08em;cursor:pointer;padding:6px 0}.theme-button:hover{color:var(--point)}
    .theme-menu{display:none;width:145px;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.97);box-shadow:0 8px 25px rgba(50,100,95,.08)}.theme-wrap.open .theme-menu{display:block}
    .theme-option{display:flex;align-items:center;gap:8px;width:100%;padding:8px 7px;border:0;border-radius:7px;background:transparent;color:var(--text);font:inherit;font-size:11px;text-align:left;cursor:pointer}.theme-option:hover{background:var(--point-soft)}.theme-dot{width:8px;height:8px;border-radius:50%;background:var(--theme-color);flex:0 0 auto}
    header{padding:105px 0 44px}.back{display:inline-block;margin-bottom:38px;color:var(--muted);font-size:11px;letter-spacing:.04em}.back:hover{color:var(--point)}
    .label{font-size:11px;letter-spacing:.16em;color:var(--point);margin-bottom:8px}.year-heading{font-size:30px;font-weight:500;letter-spacing:.01em;margin:0 0 5px}.note{font-size:12px;color:var(--muted)}
    main{padding-bottom:70px}.status{padding:35px 0;color:var(--muted);font-size:11px}.month-block{margin-bottom:12px;border-bottom:1px solid var(--line)}.month-title{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:14px 2px;font-size:10px;letter-spacing:.12em;color:var(--point);cursor:pointer}.month-title::-webkit-details-marker{display:none}.month-title::after{content:"＋";font-size:13px;line-height:1}.month-block[open] .month-title::after{content:"−"}.post-list{padding-bottom:10px}
    .post{display:grid;grid-template-columns:105px 1fr;gap:18px;padding:13px 2px;border-bottom:1px solid var(--line);align-items:center}.post-date{font-size:10px;color:var(--muted);letter-spacing:.02em}.post-title{font-size:13px}.month-count{margin-left:auto;color:var(--muted);font-size:9px;letter-spacing:.04em}.post-title:hover{color:var(--point)}
    footer{padding:0 0 55px}footer a{color:var(--muted);font-size:10px;letter-spacing:.05em}footer a:hover{color:var(--point)}
    @media(max-width:600px){.container{width:calc(100% - 32px)}.theme-wrap{top:18px;right:18px}header{padding-top:90px}.year-heading{font-size:26px}.post{grid-template-columns:78px 1fr;gap:10px;padding:11px 2px}.post-title{font-size:12px}.post-date{font-size:9px}.month-title{padding:12px 2px}.month-count{font-size:8px}}
  </style>
</head>
<body>
  <div class="theme-wrap" id="themeWrap"><button class="theme-button" id="themeButton" type="button">THEME</button><div class="theme-menu">
    <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint</button>
    <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d8799a"></span> Pink</button>
    <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender</button>
    <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue</button>
  </div></div>
  <div class="container">
    <header><a id="backArchive" href="./diary-archive.html" class="back">← ARCHIVE</a><div class="label">♡ YEAR ARCHIVE</div><h1 class="year-heading" id="yearHeading">YEAR</h1><div class="note" id="yearNote">해당 연도의 기록입니다.</div></header>
    <main><div id="loading" class="status">LOADING...</div><div id="yearArchive"></div></main>
    <footer><a id="backHome" href="./index.html">♡ back to meaningless</a></footer>
  </div>
  <script type="module">
    import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
    import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from "./supabase-config.js";
    const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY); const $=id=>document.getElementById(id);
    const themes={mint:{point:"#62b9aa",pointSoft:"#dff2ee",line:"#e5eeee",themeBg:"#f7fbfa"},pink:{point:"#d8799a",pointSoft:"#f6dfe8",line:"#eee3e7",themeBg:"#fff8fa"},lavender:{point:"#9a8bc2",pointSoft:"#e9e4f4",line:"#e8e5ee",themeBg:"#faf8fd"},blue:{point:"#70a9c2",pointSoft:"#e0eef3",line:"#e3ebee",themeBg:"#f7fbfd"}};
    const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    const formatDate=d=>{if(!d)return"";const x=new Date(`${d}T00:00:00`);return Number.isNaN(x.getTime())?String(d):`${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,"0")}.${String(x.getDate()).padStart(2,"0")}`};
    function getTheme(){const p=new URLSearchParams(location.search);if(themes[p.get("theme")])return p.get("theme");const m=document.cookie.match(/(?:^|;\s*)meaningless-theme=([^;]+)/);const n=m?decodeURIComponent(m[1]):null;return themes[n]?n:"mint"}
    let currentTheme=getTheme(); function applyTheme(name,remember=true){const t=themes[name]||themes.mint;document.documentElement.style.setProperty("--point",t.point);document.documentElement.style.setProperty("--point-soft",t.pointSoft);document.documentElement.style.setProperty("--line",t.line);document.documentElement.style.setProperty("--theme-bg",t.themeBg);if(remember)document.cookie=`meaningless-theme=${encodeURIComponent(name)}; path=/; max-age=31536000; SameSite=Lax`}
    function addTheme(url){const separator=url.includes("?")?"&":"?";return `${url}${separator}theme=${encodeURIComponent(currentTheme)}`}; applyTheme(currentTheme,false);
    const themeWrap=$("themeWrap"); $("themeButton").addEventListener("click",e=>{e.stopPropagation();themeWrap.classList.toggle("open")});
    document.querySelectorAll(".theme-option").forEach(button=>button.addEventListener("click",()=>{currentTheme=button.dataset.theme;applyTheme(currentTheme);history.replaceState(null,"",addTheme(location.pathname));updateLinks();themeWrap.classList.remove("open")}));
    document.addEventListener("click",e=>{if(!themeWrap.contains(e.target))themeWrap.classList.remove("open")});
    const params=new URLSearchParams(location.search); const year=Number(params.get("year"));
    function updateLinks(){$("backArchive").href=addTheme("./diary-archive.html");$("backHome").href=addTheme("./index.html")}; updateLinks();
    async function loadYear(){
      if(!Number.isInteger(year)||year<1900||year>9999)throw new Error("invalid year");
      $("yearHeading").textContent=year; $("yearNote").textContent=`${year}년에 남긴 기록을 모아둡니다.`; document.title=`meaningless — ${year}`;
      const {data,error}=await supabase.from("diary").select("id,date,title,created_at").order("date",{ascending:false}).order("created_at",{ascending:false}); if(error)throw error;
      const posts=(data||[]).filter(post=>{const d=post.date?new Date(`${post.date}T00:00:00`):new Date(post.created_at);return d.getFullYear()===year});
      if(!posts.length){$("yearArchive").innerHTML='<div class="status">이 연도에는 아직 기록된 DIARY가 없습니다.</div>'}else{
        const months=new Map(); posts.forEach(post=>{const d=post.date?new Date(`${post.date}T00:00:00`):new Date(post.created_at);const month=d.getMonth()+1;if(!months.has(month))months.set(month,[]);months.get(month).push(post)});
        let html=""; for(const [month,monthPosts] of months){html+=`<details class="month-block" ${month===Math.max(...months.keys())?"open":""}><summary class="month-title"><span>${String(month).padStart(2,"0")} MONTH</span><span class="month-count">${monthPosts.length} ${monthPosts.length===1?"DIARY":"DIARIES"}</span></summary><div class="post-list">`;html+=monthPosts.map(post=>`<article class="post"><div class="post-date">${esc(formatDate(post.date))}</div><div><a class="post-title" href="./diary-detail.html?id=${encodeURIComponent(post.id)}&theme=${encodeURIComponent(currentTheme)}">${esc(post.title)}</a></div></article>`).join("");html+=`</div></details>`}$("yearArchive").innerHTML=html;
      }
      $("loading").style.display="none";
    }
    try{await loadYear()}catch(error){console.error("YEAR ARCHIVE",error);$("loading").textContent="DIARY를 불러오지 못했습니다."}
  </script>
</body>
</html>
