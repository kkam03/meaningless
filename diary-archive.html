<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>meaningless — all diary</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --background: #ffffff;
      --text: #29262a;
      --muted: #8a8588;
      --line: #e5eeee;
      --point: #62b9aa;
      --point-soft: #dff2ee;
      --theme-bg: #f7fbfa;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
    }

    .theme-wrap {
      position: fixed;
      top: 28px;
      right: 28px;
      z-index: 10;
    }

    .theme-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 10px;
      letter-spacing: .08em;
      cursor: pointer;
      padding: 6px 0;
    }

    .theme-button:hover { color: var(--point); }

    .theme-menu {
      display: none;
      width: 145px;
      margin-top: 6px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 8px 25px rgba(50,100,95,.08);
    }

    .theme-wrap.open .theme-menu { display: block; }

    .theme-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 7px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 11px;
      text-align: left;
      cursor: pointer;
    }

    .theme-option:hover { background: var(--point-soft); }

    .theme-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--theme-color);
    }

    header {
      padding: 45px 0 52px;
    }

    .back {
      display: inline-block;
      margin-bottom: 48px;
      color: var(--muted);
      font-size: 11px;
    }

    .back:hover { color: var(--point); }

    .label {
      color: var(--point);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .status {
      color: var(--muted);
      font-size: 12px;
    }

    .year-block {
      margin-bottom: 52px;
    }

    .year-title {
      margin-bottom: 18px;
      color: var(--point);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -.03em;
    }

    .month-block {
      margin-bottom: 30px;
    }

    .month-title {
      margin: 0 0 10px 4px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .08em;
    }

    .post-list {
      border-top: 1px solid var(--line);
    }

    .post {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 12px;
      align-items: baseline;
      padding: 12px 4px;
      border-bottom: 1px solid var(--line);
      transition: opacity .2s ease, padding-left .2s ease;
    }

    .post:hover {
      opacity: .6;
      padding-left: 9px;
    }

    .post-date {
      color: var(--point);
      font-size: 10px;
      font-weight: 500;
    }

    .post-title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -.025em;
    }

    footer {
      padding: 15px 0 55px;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .container { width: min(100% - 30px, 760px); }
      .theme-wrap { top: 18px; right: 18px; }
      header { padding-top: 32px; padding-bottom: 42px; }
      .back { margin-bottom: 40px; }
      .year-block { margin-bottom: 42px; }
      .post { grid-template-columns: 58px 1fr; gap: 9px; padding: 10px 2px; }
      .post-date { font-size: 9px; }
      .post-title { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="theme-wrap" id="themeWrap">
    <button class="theme-button" id="themeButton" type="button">THEME</button>
    <div class="theme-menu">
      <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint</button>
      <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d8799a"></span> Pink</button>
      <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender</button>
      <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue</button>
    </div>
  </div>

  <div class="container">
    <header>
      <a id="backDiary" href="./index.html" class="back">← DIARY</a>
      <div class="label">♡ ALL DIARY</div>
      <div class="note">모든 기록을 시간순으로 모아둡니다.</div>
    </header>

    <main>
      <div id="loading" class="status">LOADING...</div>
      <div id="diaryArchive"></div>
    </main>

    <footer>
      <a id="backHome" href="./index.html">♡ back to meaningless</a>
    </footer>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const $ = id => document.getElementById(id);

    const themes = {
      mint: { point:"#62b9aa", pointSoft:"#dff2ee", line:"#e5eeee", themeBg:"#f7fbfa" },
      pink: { point:"#d8799a", pointSoft:"#f6dfe8", line:"#eee3e7", themeBg:"#fff8fa" },
      lavender: { point:"#9a8bc2", pointSoft:"#e9e4f4", line:"#e8e5ee", themeBg:"#faf8fd" },
      blue: { point:"#70a9c2", pointSoft:"#e0eef3", line:"#e3ebee", themeBg:"#f7fbfd" }
    };

    const esc = v => String(v ?? "")
      .replaceAll("&","&amp;").replaceAll("<","&lt;")
      .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");

    const formatDate = d => {
      if (!d) return "";
      const x = new Date(`${d}T00:00:00`);
      return Number.isNaN(x.getTime())
        ? String(d)
        : `${x.getFullYear()}.${String(x.getMonth()+1).padStart(2,"0")}.${String(x.getDate()).padStart(2,"0")}`;
    };

    function getTheme() {
      const p = new URLSearchParams(location.search);
      if (themes[p.get("theme")]) return p.get("theme");
      const m = document.cookie.match(/(?:^|;\s*)meaningless-theme=([^;]+)/);
      const n = m ? decodeURIComponent(m[1]) : null;
      return themes[n] ? n : "mint";
    }

    let currentTheme = getTheme();

    function applyTheme(name, remember=true) {
      const t = themes[name] || themes.mint;
      document.documentElement.style.setProperty("--point", t.point);
      document.documentElement.style.setProperty("--point-soft", t.pointSoft);
      document.documentElement.style.setProperty("--line", t.line);
      document.documentElement.style.setProperty("--theme-bg", t.themeBg);
      if (remember) {
        document.cookie = `meaningless-theme=${encodeURIComponent(name)}; path=/; max-age=31536000; SameSite=Lax`;
      }
    }

    function addTheme(url) {
      const separator = url.includes("?") ? "&" : "?";
      return `${url}${separator}theme=${encodeURIComponent(currentTheme)}`;
    }

    applyTheme(currentTheme, false);

    const themeWrap = $("themeWrap");
    $("themeButton").addEventListener("click", e => {
      e.stopPropagation();
      themeWrap.classList.toggle("open");
    });

    document.querySelectorAll(".theme-option").forEach(button => {
      button.addEventListener("click", () => {
        currentTheme = button.dataset.theme;
        applyTheme(currentTheme);
        history.replaceState(null, "", addTheme(location.pathname));
        updateLinks();
        themeWrap.classList.remove("open");
      });
    });

    document.addEventListener("click", e => {
      if (!themeWrap.contains(e.target)) themeWrap.classList.remove("open");
    });

    function updateLinks() {
      $("backDiary").href = addTheme("./index.html");
      $("backHome").href = addTheme("./index.html");
    }

    updateLinks();

    async function loadDiaryArchive() {
      const { data, error } = await supabase
        .from("diary")
        .select("id,date,title,created_at")
        .order("date", { ascending:false })
        .order("created_at", { ascending:false });

      if (error) throw error;

      const groups = new Map();

      (data || []).forEach(post => {
        const date = post.date ? new Date(`${post.date}T00:00:00`) : new Date(post.created_at);
        const year = date.getFullYear();
        const month = date.getMonth() + 1;
        const key = `${year}-${String(month).padStart(2,"0")}`;

        if (!groups.has(year)) groups.set(year, new Map());
        const yearGroup = groups.get(year);
        if (!yearGroup.has(key)) yearGroup.set(key, []);
        yearGroup.get(key).push(post);
      });

      if (!data || !data.length) {
        $("diaryArchive").innerHTML = '<div class="status">아직 기록된 DIARY가 없습니다.</div>';
      } else {
        let html = "";

        for (const [year, months] of groups) {
          html += `<section class="year-block"><div class="year-title">${year}</div>`;

          for (const [key, posts] of months) {
            const month = key.split("-")[1];
            html += `<div class="month-block">
              <div class="month-title">${month} MONTH</div>
              <div class="post-list">`;

            html += posts.map(post => `
              <article class="post">
                <div class="post-date">${esc(formatDate(post.date))}</div>
                <div><a class="post-title" href="./diary-detail.html?id=${encodeURIComponent(post.id)}&theme=${encodeURIComponent(currentTheme)}">${esc(post.title)}</a></div>
              </article>
            `).join("");

            html += `</div></div>`;
          }

          html += `</section>`;
        }

        $("diaryArchive").innerHTML = html;
      }

      $("loading").style.display = "none";
    }

    try {
      await loadDiaryArchive();
    } catch (error) {
      console.error("DIARY ARCHIVE", error);
      $("loading").textContent = "DIARY를 불러오지 못했습니다.";
    }
  </script>
</body>
</html>
