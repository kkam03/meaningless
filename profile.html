<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meaningless — profile</title>
<style>
*{box-sizing:border-box}
:root{
  --background:#fff;--text:#29262a;--muted:#8a8588;--line:#e5eeee;
  --point:#62b9aa;--point-soft:#dff2ee;--theme-bg:#f7fbfa
}
body{margin:0;background:var(--background);color:var(--text);
font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
.container{width:min(560px,calc(100% - 40px));margin:0 auto}
.theme-wrap{position:fixed;top:28px;right:28px;z-index:20}
.theme-button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:10px;letter-spacing:.08em;cursor:pointer;padding:6px 0}
.theme-menu{display:none;width:145px;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.97);box-shadow:0 8px 25px rgba(50,100,95,.08)}
.theme-wrap.open .theme-menu{display:block}
.theme-option{display:flex;align-items:center;gap:8px;width:100%;padding:8px 7px;border:0;border-radius:7px;background:transparent;color:var(--text);font:inherit;font-size:11px;text-align:left;cursor:pointer}
.theme-option:hover{background:var(--point-soft)}
.theme-dot{width:9px;height:9px;border-radius:50%;background:var(--theme-color)}
header{padding:28px 0 36px}
.back{display:inline-block;margin-bottom:30px;color:var(--muted);font-size:11px}
.back:hover{color:var(--point)}
.label{color:var(--point);font-size:11px;font-weight:700;letter-spacing:.08em}
h1{margin:7px 0 0;font-size:30px;letter-spacing:-.05em}
main{padding-bottom:70px}
.profile-photo-wrap{display:flex;justify-content:center;margin:0 0 34px}
.profile-photo{
  width:150px;height:150px;border-radius:50%;object-fit:cover;
  display:block;border:1px solid var(--line);background:var(--theme-bg)
}
.photo-placeholder{
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:10px;letter-spacing:.05em
}
.field{margin-bottom:24px}
.field label{display:block;margin-bottom:7px;color:var(--point);font-size:9px;font-weight:700;letter-spacing:.08em}
.field input,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);
  font:inherit;font-size:12px;padding:10px 11px;outline:none
}
.field input:focus,.field textarea:focus{border-color:var(--point);box-shadow:0 0 0 3px var(--point-soft)}
.field textarea{min-height:110px;resize:vertical;line-height:1.8}
.photo-row{display:flex;align-items:center;gap:10px}
.photo-button{
  border:1px solid var(--line);background:#fff;color:var(--point);border-radius:8px;
  padding:8px 11px;font:inherit;font-size:9px;font-weight:600;letter-spacing:.05em;cursor:pointer
}
.photo-button:hover{border-color:var(--point);background:var(--theme-bg)}
.photo-name{color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo-input{display:none}
.actions{display:flex;justify-content:flex-end;margin-top:30px}
.save{
  border:1px solid var(--point);background:var(--point);color:#fff;border-radius:8px;
  padding:8px 15px;font:inherit;font-size:9px;letter-spacing:.08em;cursor:pointer
}
footer{padding:0 0 50px;color:var(--muted);font-size:11px}
@media(max-width:600px){
  .container{width:min(100% - 30px,560px)}
  .theme-wrap{top:18px;right:18px}
  h1{font-size:24px}
}
</style>
</head>
<body>
<div class="theme-wrap" id="themeWrap">
  <button class="theme-button" id="themeButton" type="button">THEME</button>
  <div class="theme-menu">
    <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint</button>
    <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d8799a"></span> Pink</button>
    <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender</button>
    <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue</button>
  </div>
</div>

<div class="container">
<header>
  <a href="index.html" class="back" id="backLink">← MEANINGLESS</a>
  <div class="label">♡ PROFILE</div>
  <h1>PROFILE</h1>
</header>

<main>
  <div class="profile-photo-wrap">
    <div class="profile-photo photo-placeholder" id="photoPreview">PHOTO</div>
  </div>

  <div class="field">
    <label>PROFILE PHOTO</label>
    <div class="photo-row">
      <button class="photo-button" id="photoButton" type="button">＋ PHOTO</button>
      <span class="photo-name" id="photoName">사진을 선택해주세요.</span>
      <input class="photo-input" id="photoInput" type="file" accept="image/*">
    </div>
  </div>

  <div class="field">
    <label>NICKNAME</label>
    <input id="nickname" type="text" maxlength="30" placeholder="닉네임을 입력해주세요.">
  </div>

  <div class="field">
    <label>ABOUT</label>
    <textarea id="bio" maxlength="300" placeholder="짧은 소개를 남겨보세요."></textarea>
  </div>

  <div class="actions">
    <button class="save" id="saveButton" type="button">SAVE</button>
  </div>
</main>

<footer><a href="index.html">♡ back to meaningless</a></footer>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const themes={
  mint:{point:"#62b9aa",pointSoft:"#dff2ee",line:"#e5eeee",themeBg:"#f7fbfa"},
  pink:{point:"#d8799a",pointSoft:"#f6dfe8",line:"#eee3e7",themeBg:"#fff8fa"},
  lavender:{point:"#9a8bc2",pointSoft:"#e9e4f4",line:"#e8e5ee",themeBg:"#faf8fd"},
  blue:{point:"#70a9c2",pointSoft:"#e0eef3",line:"#e3ebee",themeBg:"#f7fbfd"}
};
function getTheme(){
  const p=new URLSearchParams(location.search);
  if(themes[p.get("theme")])return p.get("theme");
  const m=document.cookie.match(/(?:^|;\\s*)meaningless-theme=([^;]+)/);
  const n=m?decodeURIComponent(m[1]):null;
  return themes[n]?n:"mint";
}
function saveTheme(n){document.cookie="meaningless-theme="+encodeURIComponent(n)+"; path=/; max-age=31536000; SameSite=Lax"}
function applyTheme(n,save=true){
  const t=themes[n]||themes.mint;
  document.documentElement.style.setProperty("--point",t.point);
  document.documentElement.style.setProperty("--point-soft",t.pointSoft);
  document.documentElement.style.setProperty("--line",t.line);
  document.documentElement.style.setProperty("--theme-bg",t.themeBg);
  if(save)saveTheme(n);
}
let currentTheme=getTheme(); applyTheme(currentTheme,false);
const themeWrap=document.getElementById("themeWrap");
document.getElementById("themeButton").onclick=e=>{e.stopPropagation();themeWrap.classList.toggle("open")};
document.querySelectorAll(".theme-option").forEach(btn=>btn.onclick=()=>{
  currentTheme=btn.dataset.theme; applyTheme(currentTheme);
  const url=new URL(location.href); url.searchParams.set("theme",currentTheme);
  history.replaceState(null,"",url.pathname+"?"+url.searchParams.toString());
  themeWrap.classList.remove("open");
});
document.addEventListener("click",e=>{if(!themeWrap.contains(e.target))themeWrap.classList.remove("open")});
document.getElementById("backLink").href="index.html?theme="+encodeURIComponent(currentTheme);

const photoInput=document.getElementById("photoInput");
const photoButton=document.getElementById("photoButton");
const preview=document.getElementById("photoPreview");
const photoName=document.getElementById("photoName");
photoButton.onclick=()=>photoInput.click();
photoInput.onchange=()=>{
  const file=photoInput.files?.[0];
  if(!file)return;
  photoName.textContent=file.name;
  const reader=new FileReader();
  reader.onload=()=>{preview.className="profile-photo";preview.innerHTML="";preview.style.backgroundImage=`url("${reader.result}")`;preview.style.backgroundSize="cover";preview.style.backgroundPosition="center"};
  reader.readAsDataURL(file);
};
async function loadProfile(){
  const {data:{user},error:authError}=await supabase.auth.getUser();
  if(authError)throw authError;
  if(!user){alert("로그인이 필요합니다.");return null;}
  const {data,error}=await supabase.from("profiles").select("id,nickname,avatar_url,bio").eq("id",user.id).maybeSingle();
  if(error)throw error;
  if(data){
    document.getElementById("nickname").value=data.nickname||"";
    document.getElementById("bio").value=data.bio||"";
    if(data.avatar_url){
      preview.className="profile-photo"; preview.innerHTML="";
      preview.style.backgroundImage=`url("${data.avatar_url}")`;
      preview.style.backgroundSize="cover"; preview.style.backgroundPosition="center";
      photoName.textContent="현재 프로필 사진";
    }
  }
  return user;
}
async function uploadAvatar(file,userId){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  const path=`${userId}/profile.${ext}`;
  const {error}=await supabase.storage.from("profile-images").upload(path,file,{cacheControl:"3600",upsert:true,contentType:file.type});
  if(error)throw error;
  return supabase.storage.from("profile-images").getPublicUrl(path).data.publicUrl;
}
document.getElementById("saveButton").onclick=async()=>{
  const nickname=document.getElementById("nickname").value.trim();
  if(!nickname){alert("닉네임을 입력해주세요.");return;}
  const btn=document.getElementById("saveButton"); btn.disabled=true; btn.textContent="SAVING…";
  try{
    const user=await loadProfile(); if(!user)return;
    let avatarUrl=null;
    const file=photoInput.files?.[0];
    if(file) avatarUrl=await uploadAvatar(file,user.id);
    else {
      const {data}=await supabase.from("profiles").select("avatar_url").eq("id",user.id).maybeSingle();
      avatarUrl=data?.avatar_url||null;
    }
    const {error}=await supabase.from("profiles").upsert({
      id:user.id,nickname,avatar_url:avatarUrl,
      bio:document.getElementById("bio").value.trim(),
      updated_at:new Date().toISOString()
    });
    if(error)throw error;
    alert("프로필이 저장되었습니다.");
    window.location.href="index.html?theme="+encodeURIComponent(currentTheme);
  }catch(error){
    console.error("PROFILE SAVE",error);
    alert("프로필 저장에 실패했습니다.\n"+(error?.message||"알 수 없는 오류"));
  }finally{btn.disabled=false;btn.textContent="SAVE";}
};
loadProfile().catch(error=>{
  console.error("PROFILE LOAD",error);
  alert("프로필을 불러오지 못했습니다.\n"+(error?.message||"알 수 없는 오류"));
});
</script>
</body>
</html>
