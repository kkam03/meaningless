<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meaningless — new archive</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fff;--text:#29262a;--muted:#8a8588;--line:#e5eeee;--point:#62b9aa;--soft:#dff2ee;--theme-bg:#f7fbfa}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{width:min(680px,calc(100% - 40px));margin:auto}
header{padding:45px 0 48px}
.back{display:inline-block;margin-bottom:48px;color:var(--muted);font-size:11px;text-decoration:none}
.back:hover{color:var(--point)}
.heading{display:flex;align-items:baseline;gap:12px;margin-left:3px}
.label{color:var(--point);font-size:12px;font-weight:700;letter-spacing:.08em}
.subtitle{color:var(--muted);font-size:11px}
.field{margin-bottom:30px}
.field-label{display:block;margin-bottom:8px;color:var(--point);font-size:10px;font-weight:700;letter-spacing:.08em}
input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font:inherit;font-size:13px;outline:none}
input{height:42px;padding:0 12px}
textarea{min-height:110px;padding:12px;resize:vertical;line-height:1.8}
input:focus,textarea:focus{border-color:var(--point);box-shadow:0 0 0 3px var(--soft)}
.name input{font-size:16px;font-weight:500}
.types{display:flex;flex-wrap:wrap;gap:8px}
.type{padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--muted);font-size:10px;letter-spacing:-.01em;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease}
.type:hover{border-color:#c9dfdb;color:var(--point)}
.type.active{border-color:var(--point);background:var(--soft);color:var(--point);font-weight:600}
.option-fields{padding-top:2px}
.date-field{margin-bottom:8px}.date-field input{height:40px}
.option-panel{display:grid;gap:8px;width:100%;grid-template-columns:minmax(0,1fr)}
.option-panel input{height:40px}
.option-panel textarea{min-height:95px}
.add-custom{width:max-content;margin-top:2px;padding:4px 0;border:0;background:transparent;color:var(--point);font-size:10px;cursor:pointer}
.custom-row{display:flex;gap:8px}
.custom-row input{flex:1}
.custom-remove{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer}
.text-color-options{display:flex;gap:8px}
.text-color-option{padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--muted);font-size:10px;cursor:pointer}
.text-color-option.active{border-color:var(--point);background:var(--soft);color:var(--point);font-weight:600}

.record-editor-wrap{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.record-editor{min-height:230px;padding:14px 15px;outline:none;font-size:13px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.record-editor:empty:before{content:attr(data-placeholder);color:var(--muted)}
.record-editor:focus{box-shadow:0 0 0 3px var(--soft)}
.record-editor img{display:block;max-width:100%;width:auto;height:auto;margin:16px 0;border-radius:8px}
.record-toolbar{display:flex;align-items:center;border-top:1px solid var(--line);padding:8px 10px;background:#fff}
.photo-button{border:0;background:transparent;color:var(--point);font:inherit;font-size:10px;font-weight:600;letter-spacing:.02em;cursor:pointer;padding:5px 2px}
.photo-button:hover{opacity:.75}
.photo-input{display:none}
.basic-placeholder{color:var(--muted);font-size:10px;padding:4px 0 2px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:48px;padding-top:18px;border-top:1px solid var(--line)}
.actions a,.actions button{padding:8px 15px;border-radius:8px;font:inherit;font-size:11px;cursor:pointer}
.cancel{border:1px solid var(--line);background:#fff;color:var(--muted);text-decoration:none}
.save{border:1px solid var(--point);background:var(--point);color:#fff}
.theme{position:fixed;top:28px;right:28px;z-index:10}
.theme>button{border:0;background:transparent;color:var(--muted);font-size:10px;letter-spacing:.08em;cursor:pointer;padding:6px 0}
.theme-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;width:145px;padding:8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.97);box-shadow:0 8px 25px rgba(50,100,95,.08)}
.theme.open .theme-menu{display:block}
.theme-option{display:flex;align-items:center;gap:8px;width:100%;padding:8px 7px;border:0;border-radius:7px;background:transparent;color:var(--text);font-size:11px;text-align:left;cursor:pointer}
.theme-option:hover{background:var(--soft)}
.theme-dot{width:9px;height:9px;border-radius:50%;background:var(--theme-color)}
@media(max-width:600px){
  .container{width:calc(100% - 30px)}
  header{padding-top:32px;padding-bottom:40px}
  .theme{top:18px;right:18px}
}
</style>
</head>
<body>

<div class="theme" id="themeWrap">
  <button type="button" id="themeButton">THEME</button>
  <div class="theme-menu">
    <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint</button>
    <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d8799a"></span> Pink</button>
    <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender</button>
    <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue</button>
  </div>
</div>

<div class="container">
<header>
  <a class="back" id="backLink" href="index.html">← ARCHIVE</a>
  <div class="heading"><div class="label">NEW ARCHIVE</div><div class="subtitle">기록해두고 싶은 것들</div></div>
</header>

<main>
<section class="field name">
  <label class="field-label" for="archiveName">ARCHIVE NAME</label>
  <input id="archiveName" type="text" placeholder="예: NELL, TRAVEL, MOVIE">
</section>

<section class="field">
  <label class="field-label">TYPE</label>
  <div class="types" role="group" aria-label="아카이브 종류">
    <button class="type active" type="button" data-type="basic">기본 기록</button>
    <button class="type" type="button" data-type="concert">공연 / 콘서트</button>
    <button class="type" type="button" data-type="travel">여행</button>
    <button class="type" type="button" data-type="movie">영화</button>
    <button class="type" type="button" data-type="custom">직접 설정</button>
  </div>
</section>

<section class="field option-fields" id="optionFields">
  <div class="field-label" id="optionLabel">RECORD</div>
  <div id="dateField" class="date-field" style="display:none"><input id="recordDate" type="date" aria-label="날짜"></div>

  <div id="basicOptions" class="option-panel">
    <div class="basic-placeholder">기본 기록을 아래 RECORD에 작성해주세요.</div>
  </div>

  <div id="concertOptions" class="option-panel" style="display:none">
    <input type="text" placeholder="공연장">
    <input type="text" placeholder="회차">
    <textarea placeholder="셋리스트"></textarea>
    <textarea placeholder="앵콜"></textarea>
  </div>

  <div id="travelOptions" class="option-panel" style="display:none">
    <input type="text" placeholder="지역">
    <input type="text" placeholder="기간 (예: 2026.09.01 — 2026.09.04)">
    <input type="text" placeholder="동행">
  </div>

  <div id="movieOptions" class="option-panel" style="display:none">
    <input type="text" placeholder="감독">
    <input type="text" placeholder="별점">
    <textarea placeholder="감상 메모"></textarea>
  </div>

  <div id="customOptions" class="option-panel" style="display:none">
    <div id="customRows"></div>
    <button class="add-custom" id="addCustom" type="button">＋ 항목 추가</button>
  </div>
</section>

<section class="field">
  <label class="field-label">TEXT COLOR</label>
  <div class="text-color-options" role="group" aria-label="사진 위 텍스트 색상">
    <button class="text-color-option active" type="button" data-text-color="black">BLACK</button>
    <button class="text-color-option" type="button" data-text-color="white">WHITE</button>
  </div>
</section>

<section class="field record-field">
  <label class="field-label">RECORD</label>
  <div class="record-editor-wrap">
    <div id="recordEditor" class="record-editor" contenteditable="true" data-placeholder="기록해두기."></div>
    <div class="record-toolbar">
      <button class="photo-button" type="button" id="photoButton">＋ PHOTO</button>
      <input id="photoInput" class="photo-input" type="file" accept="image/*">
    </div>
  </div>
</section>

<div class="actions">
  <a class="cancel" id="cancelLink" href="index.html">CANCEL</a>
  <button class="save" id="save" type="button">SAVE</button>
</div>
</main>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

// Used by the initial text block and any later text blocks.
const esc=value=>String(value??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

const themes={
  mint:{point:"#62b9aa",pointSoft:"#dff2ee",line:"#e5eeee",themeBg:"#f7fbfa"},
  pink:{point:"#d8799a",pointSoft:"#f6dfe8",line:"#eee3e7",themeBg:"#fff8fa"},
  lavender:{point:"#9a8bc2",pointSoft:"#e9e4f4",line:"#e8e5ee",themeBg:"#faf8fd"},
  blue:{point:"#70a9c2",pointSoft:"#e0eef3",line:"#e3ebee",themeBg:"#f7fbfd"}
};

function getThemeFromCookie(){
  const m=document.cookie.match(/(?:^|;\s*)meaningless-theme=([^;]+)/);
  const n=m?decodeURIComponent(m[1]):null;
  return themes[n]?n:null;
}
function saveThemeCookie(n){
  document.cookie="meaningless-theme="+encodeURIComponent(n)+"; path=/; max-age=31536000; SameSite=Lax";
}
function applyTheme(n,save=true){
  const t=themes[n]||themes.mint;
  document.documentElement.style.setProperty("--point",t.point);
  document.documentElement.style.setProperty("--soft",t.pointSoft);
  document.documentElement.style.setProperty("--line",t.line);
  document.documentElement.style.setProperty("--theme-bg",t.themeBg);
  if(save)saveThemeCookie(n);
}

const params=new URLSearchParams(location.search);
const categoryId=params.get("category");
let textColor="black";
let currentTheme=themes[params.get("theme")]?params.get("theme"): (getThemeFromCookie()||"mint");
applyTheme(currentTheme,false);

const backLink=document.getElementById("backLink");
const cancelLink=document.getElementById("cancelLink");

function getReturnUrl(){
  if(categoryId){
    return "./archive-view.html?category="+encodeURIComponent(categoryId)+"&theme="+encodeURIComponent(currentTheme);
  }
  return "./index.html?theme="+encodeURIComponent(currentTheme);
}

if(backLink)backLink.href=getReturnUrl();
if(cancelLink)cancelLink.href=getReturnUrl();

const themeWrap=document.getElementById("themeWrap");
document.getElementById("themeButton").addEventListener("click",e=>{
  e.stopPropagation();
  themeWrap.classList.toggle("open");
});
document.querySelectorAll(".theme-option").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentTheme=btn.dataset.theme;
    applyTheme(currentTheme);
    const url=getReturnUrl();
    if(backLink)backLink.href=url;
    if(cancelLink)cancelLink.href=url;
    themeWrap.classList.remove("open");
  });
});
document.addEventListener("click",e=>{
  if(!themeWrap.contains(e.target))themeWrap.classList.remove("open");
});

const textColorButtons=document.querySelectorAll(".text-color-option");
textColorButtons.forEach(btn=>btn.addEventListener("click",()=>{
  textColor=btn.dataset.textColor||"black";
  textColorButtons.forEach(b=>b.classList.toggle("active",b===btn));
}));

const typeButtons=document.querySelectorAll(".type");
const optionFields=document.getElementById("optionFields");
const optionLabel=document.getElementById("optionLabel");
const dateField=document.getElementById("dateField");
const recordDate=document.getElementById("recordDate");
const optionPanels={
  basic:document.getElementById("basicOptions"),
  concert:document.getElementById("concertOptions"),
  travel:document.getElementById("travelOptions"),
  movie:document.getElementById("movieOptions"),
  custom:document.getElementById("customOptions")
};

function showType(type){
  typeButtons.forEach(b=>b.classList.toggle("active",b.dataset.type===type));
  Object.values(optionPanels).forEach(panel=>{if(panel)panel.style.display="none";});
  optionFields.style.display="block";
  optionLabel.textContent=
    type==="basic"?"RECORD":
    type==="concert"?"CONCERT DETAILS":
    type==="travel"?"TRAVEL DETAILS":
    type==="movie"?"MOVIE DETAILS":
    "CUSTOM FIELDS";
  if(optionPanels[type])optionPanels[type].style.display="grid";
  if(dateField)dateField.style.display=type==="travel"?"none":"block";
}
typeButtons.forEach(btn=>btn.addEventListener("click",()=>showType(btn.dataset.type)));
recordDate.value=new Date().toISOString().slice(0,10);
showType("basic");

const customRows=document.getElementById("customRows");
document.getElementById("addCustom").addEventListener("click",()=>{
  const row=document.createElement("div");
  row.className="custom-row";
  row.innerHTML='<input type="text" placeholder="항목 이름"><button type="button" class="custom-remove">×</button>';
  row.querySelector(".custom-remove").addEventListener("click",()=>row.remove());
  customRows.appendChild(row);
});


function panelValues(type){
  const panel=optionPanels[type];
  if(!panel)return{};
  const inputs=[...panel.querySelectorAll("input,textarea")];
  return inputs.reduce((obj,input,index)=>{
    const value=input.value.trim();
    if(value)obj["field_"+(index+1)]=value;
    return obj;
  },{});
}

const recordEditor=document.getElementById("recordEditor");
const photoButton=document.getElementById("photoButton");
const photoInput=document.getElementById("photoInput");
const pendingImages=new Map();
let savedRange=null;

function rememberSelection(){
  const selection=window.getSelection();
  if(!selection || !selection.rangeCount)return;
  const range=selection.getRangeAt(0);
  if(recordEditor.contains(range.commonAncestorContainer)){
    savedRange=range.cloneRange();
  }
}

recordEditor.addEventListener("keyup",rememberSelection);
recordEditor.addEventListener("mouseup",rememberSelection);
recordEditor.addEventListener("input",rememberSelection);
recordEditor.addEventListener("focus",rememberSelection);

function insertImageAtCursor(url,file){
  recordEditor.focus();
  const selection=window.getSelection();
  const range=savedRange || (()=>{
    const r=document.createRange();
    r.selectNodeContents(recordEditor);
    r.collapse(false);
    return r;
  })();
  range.deleteContents();

  const img=document.createElement("img");
  img.src=url;
  img.alt=file?.name || "첨부 사진";
  img.dataset.localImage="true";
  img.dataset.fileName=file?.name || "";
  pendingImages.set(url,file);

  range.insertNode(img);
  const spacer=document.createTextNode("\n");
  img.after(spacer);
  range.setStartAfter(spacer);
  range.collapse(true);
  selection.removeAllRanges();
  selection.addRange(range);
  savedRange=range.cloneRange();
}

photoButton.addEventListener("mousedown",e=>e.preventDefault());
photoButton.addEventListener("click",()=>{
  rememberSelection();
  photoInput.click();
});

photoInput.addEventListener("change",()=>{
  const file=photoInput.files?.[0];
  if(!file)return;
  const url=URL.createObjectURL(file);
  insertImageAtCursor(url,file);
  photoInput.value="";
});

async function uploadImage(file,userId){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/gi,"");
  const path=`${userId}/archive/${crypto.randomUUID()}.${ext||"jpg"}`;
  const {error}=await supabase.storage.from("archive-images").upload(path,file,{
    cacheControl:"3600",
    upsert:false,
    contentType:file.type
  });
  if(error)throw error;
  return supabase.storage.from("archive-images").getPublicUrl(path).data.publicUrl;
}

async function collectContentBlocks(userId){
  const result=[];
  const nodes=[...recordEditor.childNodes];
  let textBuffer="";

  const flushText=()=>{
    const value=textBuffer.replace(/\u00a0/g," ").replace(/^[\n\r]+|[\n\r]+$/g,"");
    if(value.trim())result.push({type:"text",value});
    textBuffer="";
  };

  const walk=(node)=>{
    if(node.nodeType===Node.TEXT_NODE){
      textBuffer+=node.nodeValue||"";
      return;
    }
    if(node.nodeType!==Node.ELEMENT_NODE)return;

    const tag=node.tagName;
    if(tag==="IMG") {
      flushText();
      const localSrc=node.getAttribute("src")||"";
      const file=pendingImages.get(localSrc);
      if(file){
        result.push({type:"image",file});
      }else if(localSrc && !localSrc.startsWith("blob:")){
        result.push({type:"image",url:localSrc});
      }
      textBuffer+="\n";
      return;
    }

    if(tag==="BR"){
      textBuffer+="\n";
      return;
    }

    [...node.childNodes].forEach(walk);
    if(["DIV","P","LI"].includes(tag))textBuffer+="\n";
  };

  nodes.forEach(walk);
  flushText();

  const uploaded=[];
  for(const block of result){
    if(block.type==="image" && block.file){
      const url=await uploadImage(block.file,userId);
      uploaded.push({type:"image",url});
    }else{
      uploaded.push(block);
    }
  }
  return uploaded;
}

document.getElementById("save").addEventListener("click",async()=>{
  const name=document.getElementById("archiveName").value.trim();
  const activeType=document.querySelector(".type.active")?.dataset.type||"basic";
  const saveButton=document.getElementById("save");

  if(!name){
    alert("아카이브 이름을 입력해주세요.");
    return;
  }

  saveButton.disabled=true;
  saveButton.textContent="SAVING…";

  try{
    const {data:{user},error:userError}=await supabase.auth.getUser();
    if(userError||!user)throw new Error("로그인이 필요합니다.");

    const details=panelValues(activeType);
    const contentBlocks=await collectContentBlocks(user.id);

    const combinedDetails={...details,content_blocks:contentBlocks};

    const archivePayload={user_id:user.id,name,type:activeType,text_color:textColor};
    if(categoryId)archivePayload.category_id=categoryId;

    const {data:archive,error:archiveError}=await supabase
      .from("archives")
      .insert(archivePayload)
      .select()
      .single();

    if(archiveError)throw archiveError;

    const plainText=contentBlocks
      .filter(block=>block.type==="text")
      .map(block=>block.value)
      .join("\n");

    const firstImage=contentBlocks.find(block=>block.type==="image")?.url||null;

    const {error:recordError}=await supabase
      .from("archive_records")
      .insert({
        archive_id:archive.id,
        user_id:user.id,
        date:(recordDate.value||new Date().toISOString().slice(0,10)),
        title:name,
        content:plainText,
        image_url:firstImage,
        extra_data:combinedDetails
      });

    if(recordError)throw recordError;

    alert("ARCHIVE가 저장되었습니다.");
    location.href=getReturnUrl();
  }catch(error){
    console.error(error);
    alert("저장에 실패했습니다.\\n"+(error?.message||"알 수 없는 오류"));
  }finally{
    saveButton.disabled=false;
    saveButton.textContent="SAVE";
  }
});</script>
</body>
</html>
