<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meaningless — new archive</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fff;--text:#29262a;--muted:#8a8588;--line:#e5eeee;--point:#62b9aa;--soft:#dff2ee;--theme-bg:#f7fbfa}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{width:min(680px,calc(100% - 40px));margin:auto}
header{padding:45px 0 48px}
.back{display:inline-block;margin-bottom:48px;color:var(--muted);font-size:11px;text-decoration:none}
.back:hover{color:var(--point)}
.heading{display:flex;align-items:baseline;gap:12px;margin-left:3px}
.label{color:var(--point);font-size:12px;font-weight:700;letter-spacing:.08em}
.subtitle{color:var(--muted);font-size:11px}
.field{margin-bottom:30px}
.field-label{display:block;margin-bottom:8px;color:var(--point);font-size:10px;font-weight:700;letter-spacing:.08em}
input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font:inherit;font-size:13px;outline:none}
input{height:42px;padding:0 12px}
textarea{min-height:110px;padding:12px;resize:vertical;line-height:1.8}
input:focus,textarea:focus{border-color:var(--point);box-shadow:0 0 0 3px var(--soft)}
.name input{font-size:16px;font-weight:500}
.types{display:flex;flex-wrap:wrap;gap:8px}
.type{padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--muted);font-size:10px;letter-spacing:-.01em;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease}
.type:hover{border-color:#c9dfdb;color:var(--point)}
.type.active{border-color:var(--point);background:var(--soft);color:var(--point);font-weight:600}
.option-fields{padding-top:2px}
.option-panel{display:grid;gap:8px}
.option-panel input{height:40px}
.option-panel textarea{min-height:95px}
.add-custom{width:max-content;margin-top:2px;padding:4px 0;border:0;background:transparent;color:var(--point);font-size:10px;cursor:pointer}
.custom-row{display:flex;gap:8px}
.custom-row input{flex:1}
.custom-remove{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer}

.photo-placeholder{display:flex;align-items:center;justify-content:center;min-height:110px;border:1px dashed #cfe5e1;border-radius:10px;background:var(--theme-bg);color:var(--muted);font-size:11px;cursor:pointer;transition:border-color .15s ease,color .15s ease}
.photo-placeholder:hover{border-color:var(--point);color:var(--point)}
.photo-placeholder input{display:none}
.photo-preview{margin-top:10px;position:relative}
.photo-preview img{display:block;width:100%;max-height:360px;object-fit:cover;border:1px solid var(--line);border-radius:10px}
.photo-remove{margin-top:7px;border:0;background:transparent;color:var(--muted);font-size:10px;cursor:pointer;padding:2px 0}
.photo-remove:hover{color:var(--point)}
.record-note{margin:-2px 0 10px;color:var(--muted);font-size:10px}
.records{display:grid;gap:14px}
.record-editor{padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--theme-bg)}
.record-editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.record-editor-label{color:var(--point);font-size:9px;font-weight:700;letter-spacing:.08em}
.record-editor-delete{border:0;background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
.record-date-input,.record-title-input{width:100%;height:40px;padding:0 10px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font:inherit;font-size:11px;outline:none}
.record-blocks{display:grid;gap:9px}
.record-block{position:relative;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.record-textarea{width:100%;min-height:90px;padding:4px 26px 4px 0;border:0;background:transparent;color:var(--text);font:inherit;font-size:12px;line-height:1.8;resize:vertical;outline:none}
.record-image-preview{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:7px}
.block-remove{position:absolute;top:6px;right:6px;border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.block-tools{display:flex;gap:7px;margin-top:8px}
.block-tool{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;padding:6px 9px;font:inherit;font-size:9px;cursor:pointer}
.block-tool:hover,.record-add:hover{border-color:var(--point);color:var(--point)}
.record-add{margin-top:10px;border:1px solid var(--line);background:#fff;color:var(--point);border-radius:8px;padding:8px 11px;font:inherit;font-size:10px;cursor:pointer}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:48px;padding-top:18px;border-top:1px solid var(--line)}
.actions a,.actions button{padding:8px 15px;border-radius:8px;font:inherit;font-size:11px;cursor:pointer}
.cancel{border:1px solid var(--line);background:#fff;color:var(--muted);text-decoration:none}
.save{border:1px solid var(--point);background:var(--point);color:#fff}
.theme{position:fixed;top:28px;right:28px;z-index:10}
.theme>button{border:0;background:transparent;color:var(--muted);font-size:10px;letter-spacing:.08em;cursor:pointer;padding:6px 0}
.theme-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;width:145px;padding:8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.97);box-shadow:0 8px 25px rgba(50,100,95,.08)}
.theme.open .theme-menu{display:block}
.theme-option{display:flex;align-items:center;gap:8px;width:100%;padding:8px 7px;border:0;border-radius:7px;background:transparent;color:var(--text);font-size:11px;text-align:left;cursor:pointer}
.theme-option:hover{background:var(--soft)}
.theme-dot{width:9px;height:9px;border-radius:50%;background:var(--theme-color)}
@media(max-width:600px){
  .container{width:calc(100% - 30px)}
  header{padding-top:32px;padding-bottom:40px}
  .theme{top:18px;right:18px}
}
</style>
</head>
<body>

<div class="theme" id="themeWrap">
  <button type="button" id="themeButton">THEME</button>
  <div class="theme-menu">
    <button class="theme-option" type="button" data-theme="mint"><span class="theme-dot" style="--theme-color:#62b9aa"></span> Mint</button>
    <button class="theme-option" type="button" data-theme="pink"><span class="theme-dot" style="--theme-color:#d8799a"></span> Pink</button>
    <button class="theme-option" type="button" data-theme="lavender"><span class="theme-dot" style="--theme-color:#9a8bc2"></span> Lavender</button>
    <button class="theme-option" type="button" data-theme="blue"><span class="theme-dot" style="--theme-color:#70a9c2"></span> Blue</button>
  </div>
</div>

<div class="container">
<header>
  <a class="back" id="backLink" href="index.html">← ARCHIVE</a>
  <div class="heading"><div class="label">NEW ARCHIVE</div><div class="subtitle">기록해두고 싶은 것들</div></div>
</header>

<main>
<section class="field name">
  <label class="field-label" for="archiveName">ARCHIVE NAME</label>
  <input id="archiveName" type="text" placeholder="예: NELL, TRAVEL, MOVIE">
</section>

<section class="field">
  <label class="field-label">TYPE</label>
  <div class="types" role="group" aria-label="아카이브 종류">
    <button class="type active" type="button" data-type="basic">기본 기록</button>
    <button class="type" type="button" data-type="concert">공연 / 콘서트</button>
    <button class="type" type="button" data-type="travel">여행</button>
    <button class="type" type="button" data-type="movie">영화</button>
    <button class="type" type="button" data-type="custom">직접 설정</button>
  </div>
</section>

<section class="field option-fields" id="optionFields">
  <div class="field-label" id="optionLabel">RECORD</div>

  <div id="basicOptions" class="option-panel">
    <div class="basic-placeholder">아래 RECORD에서 기록을 추가해주세요.</div>
  </div>

  <div id="concertOptions" class="option-panel" style="display:none">
    <input type="text" placeholder="공연장">
    <input type="text" placeholder="회차">
    <textarea placeholder="셋리스트"></textarea>
    <input type="text" placeholder="앵콜">
  </div>

  <div id="travelOptions" class="option-panel" style="display:none">
    <input type="text" placeholder="장소">
    <input type="text" placeholder="숙소">
    <textarea placeholder="여행 메모"></textarea>
  </div>

  <div id="movieOptions" class="option-panel" style="display:none">
    <input type="text" placeholder="감독">
    <input type="text" placeholder="별점">
    <textarea placeholder="감상 메모"></textarea>
  </div>

  <div id="customOptions" class="option-panel" style="display:none">
    <div id="customRows"></div>
    <button class="add-custom" id="addCustom" type="button">＋ 항목 추가</button>
  </div>
</section>
<section class="field record-field">
  <label class="field-label">RECORD</label>
  <div class="record-note">공연·여행·영화에 대한 나의 기록과 후기를 남겨주세요.</div>
  <div id="records" class="records"></div>
  <button class="record-add" id="addRecord" type="button">＋ 기록 추가</button>
</section>

<div class="actions">
  <a class="cancel" id="cancelLink" href="index.html">CANCEL</a>
  <button class="save" id="save" type="button">SAVE</button>
</div>
</main>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

document.addEventListener("DOMContentLoaded", () => {
  const themes = {
    mint:{point:"#62b9aa",pointSoft:"#dff2ee",line:"#e5eeee",themeBg:"#f7fbfa"},
    pink:{point:"#d8799a",pointSoft:"#f6dfe8",line:"#eee3e7",themeBg:"#fff8fa"},
    lavender:{point:"#9a8bc2",pointSoft:"#e9e4f4",line:"#e8e5ee",themeBg:"#faf8fd"},
    blue:{point:"#70a9c2",pointSoft:"#e0eef3",line:"#e3ebee",themeBg:"#f7fbfd"}
  };

  const esc = (v) => String(v ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");

  const cookieTheme = () => {
    const m=document.cookie.match(/(?:^|;\s*)meaningless-theme=([^;]+)/);
    const n=m?decodeURIComponent(m[1]):null;
    return themes[n] ? n : "mint";
  };

  let currentTheme = themes[new URLSearchParams(location.search).get("theme")]
    ? new URLSearchParams(location.search).get("theme")
    : cookieTheme();

  const applyTheme = (name, save=true) => {
    const t=themes[name] || themes.mint;
    document.documentElement.style.setProperty("--point",t.point);
    document.documentElement.style.setProperty("--soft",t.pointSoft);
    document.documentElement.style.setProperty("--line",t.line);
    document.documentElement.style.setProperty("--theme-bg",t.themeBg);
    if(save) document.cookie="meaningless-theme="+encodeURIComponent(name)+"; path=/; max-age=31536000; SameSite=Lax";
  };
  applyTheme(currentTheme,false);

  const indexUrl=()=> "./index.html?theme="+encodeURIComponent(currentTheme);
  document.getElementById("backLink").href=indexUrl();
  document.getElementById("cancelLink").href=indexUrl();

  const themeWrap=document.getElementById("themeWrap");
  document.getElementById("themeButton").addEventListener("click",(e)=>{
    e.stopPropagation(); themeWrap.classList.toggle("open");
  });
  document.querySelectorAll(".theme-option").forEach(btn=>{
    btn.addEventListener("click",()=>{
      currentTheme=btn.dataset.theme;
      applyTheme(currentTheme);
      document.getElementById("backLink").href=indexUrl();
      document.getElementById("cancelLink").href=indexUrl();
      themeWrap.classList.remove("open");
    });
  });
  document.addEventListener("click",e=>{
    if(!themeWrap.contains(e.target)) themeWrap.classList.remove("open");
  });

  const typeButtons=document.querySelectorAll(".type");
  const optionFields=document.getElementById("optionFields");
  const optionLabel=document.getElementById("optionLabel");
  const optionPanels={
    basic:document.getElementById("basicOptions"),
    concert:document.getElementById("concertOptions"),
    travel:document.getElementById("travelOptions"),
    movie:document.getElementById("movieOptions"),
    custom:document.getElementById("customOptions")
  };

  function showType(type){
    typeButtons.forEach(b=>b.classList.toggle("active",b.dataset.type===type));
    Object.values(optionPanels).forEach(panel=>{if(panel) panel.style.display="none";});
    optionFields.style.display="block";
    optionLabel.textContent =
      type==="basic" ? "RECORD" :
      type==="concert" ? "CONCERT DETAILS" :
      type==="travel" ? "TRAVEL DETAILS" :
      type==="movie" ? "MOVIE DETAILS" : "CUSTOM FIELDS";
    if(optionPanels[type]) optionPanels[type].style.display="grid";
  }
  typeButtons.forEach(b=>b.addEventListener("click",()=>showType(b.dataset.type)));
  showType("basic");

  const customRows=document.getElementById("customRows");
  if(customRows){
    document.getElementById("addCustom").addEventListener("click",()=>{
      const row=document.createElement("div");
      row.className="custom-row";
      row.innerHTML='<input type="text" placeholder="항목 이름"><button type="button" class="custom-remove">×</button>';
      row.querySelector(".custom-remove").addEventListener("click",()=>row.remove());
      customRows.appendChild(row);
    });
  }

  const recordsEl=document.getElementById("records");
  const fileMap=new Map();

  function today(){
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  function addTextBlock(record){
    const block=document.createElement("div");
    block.className="record-block";
    block.dataset.kind="text";
    block.innerHTML='<button class="block-remove" type="button">×</button><textarea class="record-textarea" placeholder="후기나 메모를 남겨주세요."></textarea>';
    block.querySelector(".block-remove").addEventListener("click",()=>block.remove());
    record.querySelector(".record-blocks").appendChild(block);
  }

  function addImageBlock(record){
    const block=document.createElement("div");
    block.className="record-block";
    block.dataset.kind="image";
    block.innerHTML='<button class="block-remove" type="button">×</button><input class="record-image-input" type="file" accept="image/*" hidden><button class="block-tool pick-photo" type="button">＋ 사진 선택</button>';
    const input=block.querySelector(".record-image-input");
    const picker=block.querySelector(".pick-photo");
    fileMap.set(block,null);
    picker.addEventListener("click",()=>input.click());
    input.addEventListener("change",()=>{
      const file=input.files?.[0] || null;
      fileMap.set(block,file);
      block.querySelector(".record-image-preview")?.remove();
      if(file){
        const img=document.createElement("img");
        img.className="record-image-preview";
        img.src=URL.createObjectURL(file);
        img.alt="";
        block.insertBefore(img,picker);
        picker.textContent=file.name;
      }
    });
    block.querySelector(".block-remove").addEventListener("click",()=>{
      fileMap.delete(block); block.remove();
    });
    record.querySelector(".record-blocks").appendChild(block);
  }

  function addRecord(){
    const record=document.createElement("div");
    record.className="record-editor";
    record.innerHTML=`
      <div class="record-editor-head">
        <div class="record-editor-label">RECORD</div>
        <button class="record-editor-delete" type="button">×</button>
      </div>
      <input class="record-date-input" type="date" value="${today()}">
      <input class="record-title-input" type="text" placeholder="후기 제목">
      <div class="record-blocks"></div>
      <div class="block-tools">
        <button class="block-tool add-text" type="button">＋ 글</button>
        <button class="block-tool add-image" type="button">＋ 사진</button>
      </div>`;
    record.querySelector(".record-editor-delete").addEventListener("click",()=>{
      record.querySelectorAll(".record-block").forEach(b=>fileMap.delete(b));
      record.remove();
    });
    record.querySelector(".add-text").addEventListener("click",()=>addTextBlock(record));
    record.querySelector(".add-image").addEventListener("click",()=>addImageBlock(record));
    recordsEl.appendChild(record);
    addTextBlock(record);
  }

  document.getElementById("addRecord").addEventListener("click",addRecord);
  addRecord();

  function panelValues(type){
    const panel=optionPanels[type], result={};
    if(!panel) return result;
    [...panel.querySelectorAll("input:not([type=file]),textarea")].forEach((el,i)=>{
      const v=el.value.trim(); if(v) result["field_"+(i+1)]=v;
    });
    return result;
  }

  async function uploadImage(file,userId){
    const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/gi,"")||"jpg";
    const path=`${userId}/archive/${crypto.randomUUID()}.${ext}`;
    const {error}=await supabase.storage.from("archive-images").upload(path,file,{
      cacheControl:"3600",upsert:false,contentType:file.type
    });
    if(error) throw error;
    return supabase.storage.from("archive-images").getPublicUrl(path).data.publicUrl;
  }

  async function collectRecords(userId){
    const result=[];
    for(const record of [...recordsEl.querySelectorAll(".record-editor")]){
      const blocks=[];
      for(const block of [...record.querySelectorAll(".record-block")]){
        if(block.dataset.kind==="text"){
          const value=block.querySelector(".record-textarea")?.value.trim()||"";
          if(value) blocks.push({type:"text",value});
        }else{
          const file=fileMap.get(block)||block.querySelector(".record-image-input")?.files?.[0];
          if(file) blocks.push({type:"image",url:await uploadImage(file,userId)});
        }
      }
      result.push({
        date:record.querySelector(".record-date-input").value||today(),
        title:record.querySelector(".record-title-input").value.trim()||"기록",
        text:blocks.filter(b=>b.type==="text").map(b=>b.value).join("\n"),
        blocks
      });
    }
    return result;
  }

  document.getElementById("save").addEventListener("click",async()=>{
    const name=document.getElementById("archiveName").value.trim();
    const type=document.querySelector(".type.active")?.dataset.type||"basic";
    const save=document.getElementById("save");

    if(!name){alert("아카이브 이름을 입력해주세요.");return;}
    if(!recordsEl.querySelector(".record-editor")){
      alert("RECORD를 하나 이상 추가해주세요.");return;
    }

    save.disabled=true;
    save.textContent="SAVING…";

    try{
      const {data:{user},error:userError}=await supabase.auth.getUser();
      if(userError) throw userError;
      if(!user) throw new Error("로그인이 필요합니다.");

      const records=await collectRecords(user.id);
      const details=panelValues(type);

      const {data:archive,error:archiveError}=await supabase
        .from("archives")
        .insert({user_id:user.id,name,type})
        .select("id")
        .single();
      if(archiveError) throw archiveError;

      for(const rec of records){
        const {error}=await supabase.from("archive_records").insert({
          archive_id:archive.id,
          user_id:user.id,
          date:rec.date,
          title:rec.title,
          content:rec.text,
          image_url:rec.blocks.find(b=>b.type==="image")?.url||null,
          extra_data:{...details,content_blocks:rec.blocks}
        });
        if(error) throw error;
      }

      alert("ARCHIVE가 저장되었습니다.");
      location.href=indexUrl();
    }catch(error){
      console.error("ARCHIVE SAVE ERROR:",error);
      alert("저장에 실패했습니다.\n"+(error?.message||String(error)));
    }finally{
      save.disabled=false;
      save.textContent="SAVE";
    }
  });
});
</script>
</body>
</html>
