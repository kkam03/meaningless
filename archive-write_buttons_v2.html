<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meaningless — new archive</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fff;--text:#29262a;--muted:#8a8588;--line:#e5eeee;--point:#62b9aa;--soft:#dff2ee}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{width:min(680px,calc(100% - 40px));margin:auto}
header{padding:45px 0 48px}
.back{display:inline-block;margin-bottom:48px;color:var(--muted);font-size:11px;text-decoration:none}
.heading{display:flex;align-items:baseline;gap:12px;margin-left:3px}
.label{color:var(--point);font-size:12px;font-weight:700;letter-spacing:.08em}
.subtitle{color:var(--muted);font-size:11px}
.field{margin-bottom:30px}
.field-label{display:block;margin-bottom:8px;color:var(--point);font-size:10px;font-weight:700;letter-spacing:.08em}
input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font:inherit;font-size:13px;outline:none}
input{height:42px;padding:0 12px}
select{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font:inherit;font-size:13px;outline:none}
select:focus{border-color:var(--point);box-shadow:0 0 0 3px var(--soft)}
textarea{min-height:110px;padding:12px;resize:vertical;line-height:1.8}
input:focus,textarea:focus{border-color:var(--point);box-shadow:0 0 0 3px var(--soft)}
.name input{font-size:16px;font-weight:500}
.types{display:flex;flex-wrap:wrap;gap:8px}
.type{padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--muted);font-size:10px;letter-spacing:-.01em;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease}
.type:hover{border-color:#c9dfdb;color:var(--point)}
.type.active{border-color:var(--point);background:var(--soft);color:var(--point);font-weight:600}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:48px;padding-top:18px;border-top:1px solid var(--line)}
.actions a,.actions button{padding:8px 15px;border-radius:8px;font:inherit;font-size:11px;cursor:pointer}
.cancel{border:1px solid var(--line);background:#fff;color:var(--muted);text-decoration:none}
.save{border:1px solid var(--point);background:var(--point);color:#fff}
.theme{position:fixed;top:28px;right:28px}
.theme button{border:0;background:transparent;color:var(--muted);font-size:10px;letter-spacing:.08em;cursor:pointer}
@media(max-width:600px){
.container{width:calc(100% - 30px)}
header{padding-top:32px;padding-bottom:40px}
.theme{top:18px;right:18px}
}
</style>
</head>
<body>
<div class="theme"><button type="button">THEME</button></div>
<div class="container">
<header>
<a class="back" href="index.html">← ARCHIVE</a>
<div class="heading"><div class="label">NEW ARCHIVE</div><div class="subtitle">기록해두고 싶은 것들</div></div>
</header>

<main>
<section class="field name">
<label class="field-label" for="archiveName">ARCHIVE NAME</label>
<input id="archiveName" type="text" placeholder="예: NELL, TRAVEL, MOVIE">
</section>

<section class="field">
<label class="field-label" for="description">DESCRIPTION</label>
<textarea id="description" placeholder="이 아카이브에 무엇을 기록할지 짧게 적어두기."></textarea>
</section>

<section class="field">
<label class="field-label" for="categorySelect">CATEGORY</label>
<select id="categorySelect">
  <option value="">카테고리 없음</option>
</select>
</section>

<section class="field">
<label class="field-label">TYPE</label>
<div class="types" role="group" aria-label="아카이브 종류">
<button class="type active" type="button" data-type="basic">기본 기록</button>
<button class="type" type="button" data-type="concert">공연 / 콘서트</button>
<button class="type" type="button" data-type="travel">여행</button>
<button class="type" type="button" data-type="movie">영화</button>
<button class="type" type="button" data-type="custom">직접 설정</button>
</div>
</section>

<div class="actions">
<a class="cancel" href="index.html">CANCEL</a>
<button class="save" id="save" type="button">SAVE</button>
</div>
</main>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from "./supabase-config.js";

const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const themes={
  mint:{point:"#62b9aa",pointSoft:"#dff2ee",line:"#e5eeee",themeBg:"#f7fbfa"},
  pink:{point:"#d8799a",pointSoft:"#f6dfe8",line:"#eee3e7",themeBg:"#fff8fa"},
  lavender:{point:"#9a8bc2",pointSoft:"#e9e4f4",line:"#e8e5ee",themeBg:"#faf8fd"},
  blue:{point:"#70a9c2",pointSoft:"#e0eef3",line:"#e3ebee",themeBg:"#f7fbfd"}
};

function getThemeFromCookie(){
  const match=document.cookie.match(/(?:^|;\s*)meaningless-theme=([^;]+)/);
  const name=match?decodeURIComponent(match[1]):null;
  return themes[name]?name:null;
}
function saveThemeCookie(name){
  document.cookie="meaningless-theme="+encodeURIComponent(name)+"; path=/; max-age=31536000; SameSite=Lax";
}
function applyTheme(name,save=true){
  const t=themes[name]||themes.mint;
  document.documentElement.style.setProperty("--point",t.point);
  document.documentElement.style.setProperty("--soft",t.pointSoft);
  document.documentElement.style.setProperty("--line",t.line);
  document.documentElement.style.setProperty("--theme-bg",t.themeBg);
  if(save)saveThemeCookie(name);
}

const params=new URLSearchParams(location.search);
const initialTheme=themes[params.get("theme")] ? params.get("theme") : (getThemeFromCookie()||"mint");
applyTheme(initialTheme,false);

const themedIndexUrl="./index.html?theme="+encodeURIComponent(initialTheme);
document.getElementById("backLink").href=themedIndexUrl;
document.getElementById("cancelLink").href=themedIndexUrl;

const themeWrap=document.getElementById("themeWrap");
document.getElementById("themeButton").addEventListener("click",(event)=>{
  event.stopPropagation();
  themeWrap.classList.toggle("open");
});
document.querySelectorAll(".theme-option").forEach(button=>{
  button.addEventListener("click",()=>{
    applyTheme(button.dataset.theme);
    themeWrap.classList.remove("open");
  });
});
document.addEventListener("click",event=>{
  if(!themeWrap.contains(event.target))themeWrap.classList.remove("open");
});

const typeButtons=document.querySelectorAll(".type");
let activeType="basic";
typeButtons.forEach(button=>{
  button.addEventListener("click",()=>{
    typeButtons.forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
    activeType=button.dataset.type;
  });
});

const categorySelect=document.getElementById("categorySelect");

async function loadCategories(){
  const {data,error}=await supabase
    .from("archive_categories")
    .select("id,name")
    .order("created_at",{ascending:true});

  if(error){
    console.error("CATEGORY LOAD",error);
    return;
  }

  categorySelect.innerHTML='<option value="">카테고리 없음</option>'+
    (data||[]).map(c=>`<option value="${c.id}">${c.name}</option>`).join("");

  const categoryParam=params.get("category");
  if(categoryParam && (data||[]).some(c=>c.id===categoryParam)){
    categorySelect.value=categoryParam;
    categorySelect.disabled=true;
  }
}

await loadCategories();

document.getElementById("save").addEventListener("click",async()=>{
  const name=document.getElementById("archiveName").value.trim();
  const description=document.getElementById("description").value.trim();
  const dateInput=document.getElementById("date");
  const recordTitle=document.getElementById("recordTitle")?.value.trim()||"";
  const recordContent=document.getElementById("recordContent")?.value.trim()||"";
  const categoryId=categorySelect.value||null;
  const save=document.getElementById("save");

  if(!name){
    alert("아카이브 이름을 입력해주세요.");
    return;
  }

  save.disabled=true;
  save.textContent="SAVING…";

  try{
    const {data:{user},error:authError}=await supabase.auth.getUser();
    if(authError)throw authError;
    if(!user)throw new Error("로그인이 필요합니다.");

    const {data:archive,error:archiveError}=await supabase
      .from("archives")
      .insert({
        user_id:user.id,
        name,
        description:description||null,
        type:activeType,
        category_id:categoryId
      })
      .select("id")
      .single();

    if(archiveError)throw archiveError;

    // Keep the optional first record attached to this archive.
    if(dateInput?.value || recordTitle || recordContent){
      const {error:recordError}=await supabase
        .from("archive_records")
        .insert({
          archive_id:archive.id,
          user_id:user.id,
          date:dateInput?.value||null,
          title:recordTitle||null,
          content:recordContent||null
        });
      if(recordError)throw recordError;
    }

    alert("ARCHIVE가 저장되었습니다.");

    if(categoryId){
      location.href=`./category-view.html?id=${encodeURIComponent(categoryId)}&theme=${encodeURIComponent(initialTheme)}`;
    }else{
      location.href=themedIndexUrl;
    }
  }catch(error){
    console.error("ARCHIVE SAVE",error);
    alert("저장에 실패했습니다.\n"+(error?.message||"알 수 없는 오류"));
  }finally{
    save.disabled=false;
    save.textContent="SAVE";
  }
});
</script>
</body>
</html>
